id: wdi-urban-growth
title: Urban population growth (World Bank)
summary: Annual urban population growth rate for year t is the exponential rate of growth of midyear urban
  population from year t-1 to t, expressed as a percentage. Urban population refers to people living in
  urban areas as defined by national statistical offices. It is calculated using World Bank total population
  estimates and urban ratios from the United Nations World Urbanization Prospects.
