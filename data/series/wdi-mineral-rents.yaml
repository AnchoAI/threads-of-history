id: wdi-mineral-rents
title: Mineral rents (% of GDP) (World Bank)
summary: Mineral rents are the difference between the value of production for a stock of minerals at world
  prices and their total costs of production. Minerals included in the calculation are tin, gold, lead,
  zinc, iron, copper, nickel, silver, bauxite, and phosphate.
