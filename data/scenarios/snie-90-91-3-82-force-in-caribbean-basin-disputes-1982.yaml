id: snie-90-91-3-82-force-in-caribbean-basin-disputes-1982
title: 'SNIE 90/91-3-82: Force used in the Venezuela–Guyana, Guatemala–Belize or Nicaragua–Colombia disputes'
summary: In August 1982 the US intelligence community judged that domestic and international considerations would
  keep the governments in the Venezuela–Guyana, Guatemala–Belize and Nicaragua–Colombia disputes from using force.
  None used force in the following year; Venezuela let the Port of Spain Protocol lapse in 1983 and pursued its
  claim through the UN.
