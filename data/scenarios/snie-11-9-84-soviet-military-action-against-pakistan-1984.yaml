id: snie-11-9-84-soviet-military-action-against-pakistan-1984
title: 'SNIE 11-9-84: Large-scale Soviet military action against Pakistan'
summary: In August 1984 the US intelligence community judged that the Soviet Union might step up limited cross-border
  raids on Pakistan but that large-scale Soviet military action against Pakistan remained unlikely. Soviet aircraft
  violated Pakistani airspace during the Afghan war, but no large-scale action followed.
