id: snie-13-10-65-china-border-probes-1965
title: 'SNIE 13-10-65: China makes small-scale military probes across the Indian frontier'
summary: On 16 September 1965 the US intelligence community put at about even the chance that China would make small-scale
  military probes across India's frontier during the Indo-Pakistani war. China and India traded accusations over
  the Sikkim border; the sources found do not settle whether Chinese probes took place.
