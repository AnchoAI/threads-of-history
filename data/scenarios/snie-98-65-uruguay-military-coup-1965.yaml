stated_as: We consider it almost certain that no such move is now imminent.
probability_basis: 'Sherman Kent''s words of estimative probability: ''almost certain'' that it will not happen
  = ''almost certainly not'', about 7%'
forecast_by: US intelligence community (SNIE)
forecast_on: '1965-06-17'
resolves_by: '1966-06-17'
resolution:
