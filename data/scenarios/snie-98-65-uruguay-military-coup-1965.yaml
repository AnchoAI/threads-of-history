id: snie-98-65-uruguay-military-coup-1965
title: 'SNIE 98-65: Military coup in Uruguay'
summary: In June 1965 the US intelligence community judged it almost certain that no military coup in Uruguay was
  imminent. Uruguay held a general election in 1966; the coup came on 27 June 1973.
threads:
