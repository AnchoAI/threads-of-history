id: snie-91-2-82-argentina-nuclear-explosive-capability-1982
title: 'SNIE 91-2-82: Argentina gains the technical capability to make nuclear explosives by 1990'
summary: In September 1982 the US intelligence community judged that Argentina would achieve the technical capability
  to make nuclear explosives before the end of the decade. In November 1983 Argentine officials said research had
  yielded a capacity for weapons-grade uranium enrichment; the programme was then placed under civilian control
  and abandoned.
