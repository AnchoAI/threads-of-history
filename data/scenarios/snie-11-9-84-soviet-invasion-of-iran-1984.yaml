stated_as: But we believe this course of events is highly unlikely in the time frame of this Estimate.
probability_basis: 'Sherman Kent''s words of estimative probability: ''highly unlikely'', read as the opposite of
  ''highly likely'', which Kent lists under ''almost certain''; so ''almost certainly not'' = about 7%'
