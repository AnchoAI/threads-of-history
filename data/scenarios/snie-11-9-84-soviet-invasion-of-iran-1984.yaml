id: snie-11-9-84-soviet-invasion-of-iran-1984
title: 'SNIE 11-9-84: Soviet invasion of Iran after an Iranian victory over Iraq'
summary: In August 1984 the US intelligence community judged highly unlikely, within the estimate's time frame,
  a chain in which an Iranian victory over Iraq led to a Soviet invasion of Iran. No Soviet invasion of Iran followed;
  during the Iran–Iraq war the Soviet Union supplied Iraq with arms.
