id: snie-31-32-65-indo-pakistani-hostilities-renewed-1965
title: 'SNIE 31-32-65: Major Indo-Pakistani hostilities resume'
summary: In December 1965, with the September ceasefire still shaky, the US intelligence community judged a renewal
  of major hostilities between India and Pakistan unlikely over the next few months. The ceasefire held; the Tashkent
  Declaration followed in January 1966 and the next war came in 1971.
