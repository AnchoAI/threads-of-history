id: snie-53-14-3-75-saigon-government-defeated-by-early-1976
title: 'SNIE 53/14.3-75: South Vietnam''s government defeated by early 1976'
summary: On 27 March 1975 the US intelligence community judged that South Vietnam's government, left holding little
  more than Saigon and the delta, was likely to be defeated by early 1976. It was defeated on 30 April 1975.
