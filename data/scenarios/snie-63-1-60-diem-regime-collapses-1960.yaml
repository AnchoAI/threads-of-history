id: snie-63-1-60-diem-regime-collapses-1960
title: 'SNIE 63.1-60: Diem''s regime collapses within a year'
summary: In August 1960 the US intelligence community judged that unchecked adverse trends would in time bring down
  Ngo Dinh Diem's regime in South Vietnam, but did not expect this within the estimate's period of about a year.
  Diem survived a coup attempt in November 1960 and was overthrown in November 1963.
