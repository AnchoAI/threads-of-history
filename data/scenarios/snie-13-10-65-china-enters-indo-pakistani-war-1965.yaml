stated_as: We believe that China will avoid direct, large-scale, military involvement in the Indo-Pakistan war.
probability_basis: 'Sherman Kent''s words of estimative probability: ''we believe'' (Kent''s ''probable'' bracket)
  = about 75% that China stays out, so about 25% that it intervenes'
