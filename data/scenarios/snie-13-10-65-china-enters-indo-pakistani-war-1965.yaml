id: snie-13-10-65-china-enters-indo-pakistani-war-1965
title: 'SNIE 13-10-65: China intervenes militarily in the Indo-Pakistani war'
summary: On 16 September 1965 the US intelligence community judged that China would avoid direct, large-scale military
  involvement in the war between India and Pakistan. China issued an ultimatum to India but did not intervene; the
  war ended in a ceasefire on 23 September.
