id: snie-30-56-egypt-initiates-war-with-israel-1956
title: 'SNIE 30-56: Egypt deliberately starts a war with Israel'
summary: In February 1956 the US intelligence community judged that Nasser's government would probably seek to avoid
  war with Israel over the following year while absorbing Soviet arms. Egypt did not start a war; Israel invaded
  Egypt on 29 October 1956.
