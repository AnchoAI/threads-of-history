id: snie-13-10-65-china-offers-material-aid-to-pakistan-1965
title: 'SNIE 13-10-65: China offers material aid to Pakistan'
summary: On 16 September 1965 the US intelligence community judged that China would probably offer Pakistan material
  aid during the Indo-Pakistani war, though it could deliver little. China did offer military aid, which Pakistan
  rejected.
