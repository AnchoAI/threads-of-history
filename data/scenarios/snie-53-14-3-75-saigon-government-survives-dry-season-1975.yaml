id: snie-53-14-3-75-saigon-government-survives-dry-season-1975
title: 'SNIE 53/14.3-75: South Vietnam''s government survives the dry season'
summary: On 27 March 1975 the US intelligence community judged that the South Vietnamese government's military strength
  in the south would enable it to survive the 1975 dry season. Saigon fell to North Vietnamese forces on 30 April
  1975.
