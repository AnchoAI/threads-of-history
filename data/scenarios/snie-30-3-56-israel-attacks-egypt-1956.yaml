id: snie-30-3-56-israel-attacks-egypt-1956
title: 'SNIE 30-3-56: Israel attacks Egypt early in the Suez crisis'
summary: Days after Egypt nationalised the Suez Canal Company in July 1956, the US intelligence community judged
  that Israel would not attack Egypt, at least during the early phases of the crisis. Israel invaded Egypt on 29
  October 1956, three months later; whether that falls in the 'early phases' is open.
