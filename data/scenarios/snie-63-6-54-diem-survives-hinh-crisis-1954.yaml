id: snie-63-6-54-diem-survives-hinh-crisis-1954
title: 'SNIE 63-6-54: Diem government survives the Hinh crisis'
summary: In September 1954 the US intelligence community judged that Ngo Dinh Diem's government in South Vietnam
  would probably survive the insubordination of his army chief of staff, General Nguyen Van Hinh. Hinh was replaced
  and returned to France in November 1954.
