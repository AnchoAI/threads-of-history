id: snie-90-91-3-82-ecuador-attacks-peru-1982
title: 'SNIE 90/91-3-82: Ecuador acts militarily against Peru'
summary: In August 1982 the US intelligence community judged Ecuador not likely to act militarily against Peru in
  the next year or so. Ecuador and Peru fought in 1981 and next in 1995.
