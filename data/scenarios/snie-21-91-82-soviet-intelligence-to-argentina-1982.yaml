id: snie-21-91-82-soviet-intelligence-to-argentina-1982
title: 'SNIE 21/91-82: The Soviet Union secretly gives Argentina information on British deployments'
summary: On 9 April 1982 the US intelligence community judged that the Soviet Union would probably give Argentina
  secret information on British military deployments. Reports conflict on whether Soviet surveillance data reached
  Argentina and played a role.
