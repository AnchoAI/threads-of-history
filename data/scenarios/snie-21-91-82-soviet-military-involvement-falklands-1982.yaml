id: snie-21-91-82-soviet-military-involvement-falklands-1982
title: 'SNIE 21/91-82: The Soviet Union becomes directly involved militarily in the Falklands conflict'
summary: On 9 April 1982 the US intelligence community judged the Soviet Union unlikely to become directly involved
  militarily in the Falklands dispute. The Soviet Union stayed out of the fighting, though it is reported to have
  run clandestine logistics operations and launched surveillance satellites over the South Atlantic.
