  precision: day
probability: 0.3
stated_as: Neither Peru nor Bolivia is likely to attack Chile
probability_basis: 'Sherman Kent''s words of estimative probability: ''not likely'' (Kent''s ''probably not'' bracket,
  with ''unlikely'') = about 30%'
forecast_by: US intelligence community (SNIE)
forecast_on: '1982-08-10'
resolves_by: '1983-08-10'
resolution:
  outcome: did_not_happen
  resolved_on: '1983-08-10'
  note: No attack took place; Peru and Chile had come close to war in 1975 but avoided armed conflict.
