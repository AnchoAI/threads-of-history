id: snie-90-91-3-82-peru-or-bolivia-attacks-chile-1982
title: 'SNIE 90/91-3-82: Peru or Bolivia attacks Chile'
summary: In August 1982 the US intelligence community judged that neither Peru nor Bolivia was likely to attack
  Chile in the next year or so. Neither did.
threads:
- intel
regions:
