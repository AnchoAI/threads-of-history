id: snie-100-11-58-prc-assaults-major-offshore-islands-1958
title: 'SNIE 100-11-58: China assaults the major offshore islands'
summary: In September 1958, during the Second Taiwan Strait Crisis, the US intelligence community judged it possible
  but unlikely that the Chinese Communists would assault one or more of the major Nationalist-held offshore islands.
  No assault came; the crisis ended in an arrangement of shelling on alternate days.
