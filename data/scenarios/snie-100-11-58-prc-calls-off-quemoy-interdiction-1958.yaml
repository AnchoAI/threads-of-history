id: snie-100-11-58-prc-calls-off-quemoy-interdiction-1958
title: 'SNIE 100-11-58: China gradually calls off the interdiction of Quemoy'
summary: In September 1958, during the Second Taiwan Strait Crisis, the US intelligence community judged it unlikely
  that the Chinese Communists would gradually call off their interdiction of supplies to the Nationalist-held Quemoy
  (Kinmen) islands. Beijing announced a ceasefire on 6 October and on 25 October said it would not fire on even-numbered
  days, letting supplies through.
