id: snie-53-14-3-75-nha-trang-falls-1975
title: 'SNIE 53/14.3-75: Nha Trang falls'
summary: On 27 March 1975 the US intelligence community judged that the lightly defended South Vietnamese military
  headquarters at Nha Trang would probably fall. It fell on 1 April 1975.
