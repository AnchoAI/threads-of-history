id: snie-11-9-84-el-salvador-insurgent-offensive-1984
title: 'SNIE 11-9-84: Insurgent offensive in El Salvador in late summer or autumn 1984'
summary: In August 1984 the US intelligence community judged that an insurgent offensive of limited scope and moderate
  effectiveness was likely in El Salvador in late summer or autumn 1984. The sources checked so far do not settle
  whether one took place.
