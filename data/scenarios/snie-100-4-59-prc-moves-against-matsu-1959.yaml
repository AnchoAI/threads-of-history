id: snie-100-4-59-prc-moves-against-matsu-1959
title: 'SNIE 100-4-59: China tries to seize the Matsus or cut off their supply'
summary: In March 1959 the US intelligence community judged it unlikely that over the next year the Chinese Communists
  would try to seize the Matsu islands or make an all-out effort to stop their resupply. Neither happened.
