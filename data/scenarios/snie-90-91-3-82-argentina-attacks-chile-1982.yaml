id: snie-90-91-3-82-argentina-attacks-chile-1982
title: 'SNIE 90/91-3-82: Argentina starts military action against Chile over the Beagle Channel'
summary: In August 1982 the US intelligence community judged that Argentina was not likely to start military action
  against Chile over the Beagle Channel dispute in the next year or so. It did not; the dispute was settled through
  papal mediation in 1984.
