id: snie-91-2-82-argentina-diverts-reactor-fuel-1982
title: 'SNIE 91-2-82: Argentina diverts fuel from its power reactors for explosives'
summary: In September 1982 the US intelligence community judged it unlikely that Argentina would divert fuel from
  its power reactors, clandestinely or openly, to get a nuclear explosive capability. Argentina's weapons programme
  was abandoned after the return of democracy in December 1983.
