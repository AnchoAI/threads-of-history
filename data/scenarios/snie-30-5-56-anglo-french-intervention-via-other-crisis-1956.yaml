id: snie-30-5-56-anglo-french-intervention-via-other-crisis-1956
title: 'SNIE 30-5-56: Britain and France intervene against Nasser through another regional crisis'
summary: In September 1956 the US intelligence community judged it possible but unlikely, over the following few
  weeks, that another regional conflict such as the Arab-Israeli one would give Britain and France an occasion to
  intervene militarily against Nasser. Israel invaded Egypt on 29 October and Britain and France attacked Egypt
  on 31 October.
