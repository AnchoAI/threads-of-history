review:
  status: sourced
  notes:
  - Batch N (intelligence estimates benchmark). Chosen by a stratified random draw of FRUS Special National Intelligence
    Estimates, taking every qualifying judgment in each drawn estimate; see the batch report.
  - '''The next few weeks'' is read here as eight weeks (to 14 November 1956); the intervention came six weeks after
    the estimate. A reviewer may prefer a shorter reading, which would change the outcome to did_not_happen.'
  - The same estimate judged that, absent a new violent provocation, Britain and France would not use force while
    the US opposed it; that judgment was conditional and is not recorded separately.
