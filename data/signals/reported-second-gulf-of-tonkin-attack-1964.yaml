id: reported-second-gulf-of-tonkin-attack-1964
title: Reported second attack in the Gulf of Tonkin
summary: 'On the night of 4 August 1964 the destroyers Maddox and Turner Joy reported that North Vietnamese
  boats were attacking them, and the Johnson administration treated signals intercepts as confirmation. No
  attack took place: there were no North Vietnamese boats in the area, and the intercepts concerned the 2 August
  clash.'
