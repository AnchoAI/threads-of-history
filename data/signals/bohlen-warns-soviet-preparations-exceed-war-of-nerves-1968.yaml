id: bohlen-warns-soviet-preparations-exceed-war-of-nerves-1968
title: 'Bohlen: Soviet preparations look excessive for a war of nerves'
summary: On 26 July 1968 Deputy Under Secretary Charles Bohlen told Rusk that Soviet mobilisation and reported
  division moves towards the Czech border looked "somewhat excessive for a war of nerves" and could be final
  preparation for a move into Czechoslovakia, while calling this "pure speculation".
