id: able-archer-83-war-scare-1983
title: Able Archer 83 war scare
summary: During NATO's Able Archer 83 nuclear-release exercise in November 1983, Moscow Centre sends KGB
  residencies a flash telegram wrongly reporting an alert at American bases and asking for information
  on a US first strike; Soviet fears ended when the exercise finished on 11 November. Some scholars count
  it among the closest moments to nuclear war since 1962; others, including Simon Miles, dispute that
  Soviet leaders believed an attack was imminent.
