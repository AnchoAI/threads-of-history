id: draft-nie-on-iran-1978
title: 'Draft NIE: the period to mid-1979 is critical for the Pahlavi dynasty'
summary: A draft National Intelligence Estimate of about September 1978 judged that the months up to mid-1979 would
  prove critical for the Shah's ability to preserve the powers of the Pahlavi dynasty. The National Security Archive
  notes it is unclear whether a final version reached policymakers.
