id: inr-future-of-iran-report-1977
title: 'INR Report 704: "Iran is likely to remain stable under the Shah"'
summary: A State Department intelligence report of 28 January 1977 judged that the Shah had an excellent chance
  to rule for a dozen or more years and that Iran would have relatively clear sailing until at least the mid-1980s.
  The Shah left Iran two years later.
