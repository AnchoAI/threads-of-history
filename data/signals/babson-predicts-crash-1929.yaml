id: babson-predicts-crash-1929
title: Roger Babson predicts a crash
summary: On 5 September 1929 the financial forecaster Roger Babson told the Annual National Business Conference
  that "sooner or later a crash is coming, and it may be terrific"; prices then fell sharply in what was
  called the Babson Break. He said he was repeating a warning he had made in each of the two previous
  years.
