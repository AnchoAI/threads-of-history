id: mps-raise-profumo-rumours-in-commons-1963
title: MPs raise rumours about a minister and Christine Keeler in the Commons
summary: On 21 March 1963, under parliamentary privilege, George Wigg asked the Home Secretary to deny rumours connecting
  'a minister' to Christine Keeler, Mandy Rice-Davies and the Edgecombe shooting. The next day John Profumo told
  the House there had been 'no impropriety whatsoever' in his acquaintance with Keeler; on 4 June he admitted that
  he had lied.
