title: Bondi says Epstein "client list" is on her desk
summary: Asked by Fox News whether the Justice Department would publish "the list of Jeffrey Epstein's clients",
  Attorney General Pam Bondi says "It's sitting on my desk right now to review." In July the department and the
  FBI said they had found no incriminating "client list".
