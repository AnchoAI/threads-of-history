  - 'Outcome unresolved for the specific allegations in these two articles: Weinstein''s criminal convictions
    (New York 2020, overturned 2024, partly re-convicted 2025; Los Angeles 2022) rest on complaints by
    other women. A count based on Lucia Evans''s allegation in the New Yorker article was later dropped
    (not sourced here). A reviewer may prefer "confirmed" given the later convictions for similar conduct.'
