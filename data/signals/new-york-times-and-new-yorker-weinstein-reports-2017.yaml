id: new-york-times-and-new-yorker-weinstein-reports-2017
title: New York Times and New Yorker report allegations against Harvey Weinstein
wikidata: Q41832063
summary: The New York Times (Jodi Kantor and Megan Twohey, 5 October) reports that Harvey Weinstein had
  for three decades been accused of sexual harassment and had reached eight settlements; The New Yorker
  (Ronan Farrow, 10 October) reports thirteen women who say he harassed or assaulted them, three of whom
  say he raped them. Weinstein denied any non-consensual sex.
