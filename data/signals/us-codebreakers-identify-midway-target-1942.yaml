id: us-codebreakers-identify-midway-target-1942
title: US code breakers identify Midway as the target
summary: US Navy cryptanalysts at Station HYPO, who had partly broken the Japanese naval code JN-25, use
  a ruse about a water shortage to confirm that the target 'AF' is Midway. By the last week of May 1942
  they understand much of the Japanese attack plan, letting Nimitz prepare an ambush.
