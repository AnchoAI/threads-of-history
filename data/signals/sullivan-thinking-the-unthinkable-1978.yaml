id: sullivan-thinking-the-unthinkable-1978
title: 'Sullivan cable: "Thinking the Unthinkable"'
summary: On 9 November 1978 Ambassador William Sullivan cabled that the Shah's authority had shrunk, that an accommodation
  with the religious opposition would require the Shah to leave in favour of an Islamic Republic, and that Washington
  needed to "think the unthinkable" in case the Shah abdicated. He said it was not the embassy's prediction.
