id: rajan-warns-of-financial-risk-2005
title: Rajan warns that finance has made the world riskier
summary: At a 2005 event honouring the retiring Fed chairman Alan Greenspan, IMF chief economist Raghuram
  Rajan presented a paper, "Has Financial Development Made the World Riskier?", arguing that financial
  managers were paid to take risks with small chances of severe consequences and that disaster might loom.
  Lawrence Summers called the warnings "misguided"; after the 2008 crisis they were seen as prescient.
