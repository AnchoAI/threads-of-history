id: rostow-memo-risk-of-soviet-intervention-rising-1968
title: 'Rostow memo: risk of Soviet intervention is rising'
summary: On 20 July 1968 Under Secretary Eugene Rostow wrote to Rusk that Ambassador Thompson and others thought
  the risk of Soviet military intervention in Czechoslovakia was increasing, and that the time left for deterrence
  was "a matter of four or five days".
