id: johnson-advisers-judge-czech-crisis-subsided-1968
title: Johnson's advisers judge the Czech crisis has subsided
summary: 'At President Johnson''s lunch with his foreign policy advisers on 24 July 1968, Walt Rostow said
  he did not think the Soviets would move militarily against the Czechs, and Secretary Rusk said: "We saw the
  Czech situation as nearly over. The real crisis has subsided."'
