id: snie-11-19-62-judges-ussr-will-not-force-blockade-1962
title: 'SNIE 11-19-62: USSR will not force a blockade'
summary: US intelligence estimates of 19–20 October 1962 on Soviet reactions judged that the USSR would
  not attack the United States, and (as McNamara told the National Security Council on 20 October) that
  the Russians would not use force to push their ships through a US blockade. Some Soviet ships turned
  back from the quarantine line on 24–25 October.
