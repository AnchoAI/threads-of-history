  notes:
  - Batch P1 (Cuba 1962, primary documents). Quotes copied from fetched pages; no person has reviewed
    this yet.
  - The blockade judgment is quoted from McNamara's summary in the NSC minutes; the text of SNIE 11-19-62
    itself was not fetched (State Department Central Files, 737.56361/10-2662; also in CIA Documents on
    the Cuban Missile Crisis, 1962, pp. 211-220).
  - SNIE 11-18-62 also judged it "unlikely" that the missiles were mainly for bargaining, and did not
