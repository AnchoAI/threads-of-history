id: franklin-child-abuse-allegations-1988
title: Franklin child abuse allegations
summary: Alleged victims say that Lawrence E. King Jr. and other prominent Nebraskans abused minors at parties and
  that children in foster care were flown to the East Coast to be abused; King calls the claims "garbage". In 1990
  a county grand jury and a federal grand jury find the allegations unfounded, the county jury calling them "a carefully
  crafted hoax".
