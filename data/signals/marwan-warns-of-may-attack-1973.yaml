id: marwan-warns-of-may-attack-1973
title: Marwan warns of an Egyptian–Syrian attack in May 1973
summary: Ashraf Marwan, an Egyptian official spying for Israel, warned that Egypt and Syria would attack in
  mid-May 1973. No attack came, and Israel's costly Blue-White mobilisation led some Israelis to dismiss the
  real preparations in October as another exercise. Whether Marwan was a double agent is disputed.
