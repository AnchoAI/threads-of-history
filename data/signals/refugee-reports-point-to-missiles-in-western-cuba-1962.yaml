id: refugee-reports-point-to-missiles-in-western-cuba-1962
title: Refugee reports point to missiles in western Cuba
summary: A US military briefing paper prepared for 28 September and used on 1 October 1962 combined unevaluated
  refugee reports and the pattern of SA-2 sites. It noted a Soviet-controlled restricted area in Pinar
  del Rio province, the greatest concentration of Soviet personnel in western Cuba, and a single unconfirmed
  report of about 20 SS-4-type missiles seen near Havana on 12 September.
