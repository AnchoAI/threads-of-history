id: blood-telegram-1971
title: The Blood Telegram
summary: Twenty members of the US consulate in Dhaka, led by Consul General Archer Blood, send a dissent
  cable protesting that their government has failed to denounce atrocities in East Pakistan. Nixon and
  Kissinger recalled Blood; officials later called the telegram alarmist.
