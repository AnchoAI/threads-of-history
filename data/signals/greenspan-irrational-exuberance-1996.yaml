id: greenspan-irrational-exuberance-1996
title: Greenspan's "irrational exuberance" warning
summary: In a televised speech on 5 December 1996, Federal Reserve chairman Alan Greenspan asked how one
  would know "when irrational exuberance has unduly escalated asset values"; the remark was read as a
  warning that stocks were overvalued, and Tokyo's market closed 3 percent down. The dot-com bubble went
  on growing until March 2000.
