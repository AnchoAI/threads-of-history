id: cia-iran-after-the-shah-1978
title: 'CIA: Iran "is not in a revolutionary or even a prerevolutionary situation"'
summary: The CIA paper "Iran After the Shah" (August 1978), completed in early summer, said in its preface that
  Iran was not in a revolutionary or even a prerevolutionary situation and that dissatisfaction did not at present
  threaten the government. CIA's own 1979 review found that NFAC failed to anticipate the course of events.
