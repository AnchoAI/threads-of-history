id: chamberlain-peace-for-our-time-1938
title: Chamberlain's "peace for our time"
summary: Returning from Munich on 30 September 1938, Neville Chamberlain gave his "peace for our time"
  speech, and Hitler said the Sudetenland was his last territorial claim. In March 1939 Germany occupied
  the rest of the Czech lands, and Britain and France declared war on Germany on 3 September 1939.
