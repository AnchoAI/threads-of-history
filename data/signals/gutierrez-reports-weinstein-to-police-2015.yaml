id: gutierrez-reports-weinstein-to-police-2015
title: Ambra Battilana Gutierrez reports Harvey Weinstein to New York police
summary: Model Ambra Battilana Gutierrez tells New York police that Harvey Weinstein groped her. In a
  conversation recorded in a police sting, Weinstein admits groping her, but after two weeks the Manhattan
  District Attorney's office decides not to file charges.
