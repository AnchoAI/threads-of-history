id: tass-denies-need-for-soviet-missiles-in-cuba-1962
title: TASS statement denies need for Soviet missile bases in Cuba
summary: A Soviet government statement issued through TASS on 11 September 1962 warned that a US attack
  on Cuba or on Soviet ships bound for it would mean war, stressed that the weapons sent were defensive,
  and said the Soviet Union had no need or intention to put offensive nuclear missiles in Cuba.
