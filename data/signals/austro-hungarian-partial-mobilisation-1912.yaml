id: austro-hungarian-partial-mobilisation-1912
title: Austria-Hungary partially mobilises during the First Balkan War
summary: After Serbia captured Adriatic ports, Austria-Hungary began a partial mobilisation on 21 November 1912,
  including units on the Russian border. Russia decided not to mobilise in response, and no great-power war followed.
