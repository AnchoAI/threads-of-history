  - 'Unverified because the only source is a PDF that src.py cannot read, so no checked quote could be attached.
    The text extracted with pdftxt.py from page 10 of the CIA booklet reads: "Three days later, CIA''s Office
    of Strategic Research (OSR) warned, ''[i]t would appear the Soviet high command has in about two weeks''
    time completed military preparations sufficient for intervening in Czechoslovakia if that is deemed necessary
    by the political leadership.''" "Three days later" follows a report of 31 July, which gives about 3 August;
    Radio Prague (blocked here) is reported to give 2 August. Find the original OSR memorandum in the CIA reading
    room collection and quote it.'
