id: cia-warns-soviet-invasion-preparations-complete-1968
title: 'CIA: Soviet preparations for intervention complete'
summary: In early August 1968 the CIA's Office of Strategic Research reported that the Soviet high command
  appeared to have completed, in about two weeks, military preparations sufficient to intervene in Czechoslovakia
  if the political leadership so decided.
