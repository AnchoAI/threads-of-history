id: indianapolis-star-reports-nassar-allegations-2016
title: Indianapolis Star reports allegations against Larry Nassar
summary: The Indianapolis Star reports that two former gymnasts, one of them Rachael Denhollander, have
  accused Larry Nassar of sexual abuse. Dozens more complaints follow, police search his home, and he
  is removed from his posts at Michigan State and elsewhere.
