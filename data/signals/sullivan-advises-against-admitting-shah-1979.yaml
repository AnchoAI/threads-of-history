id: sullivan-advises-against-admitting-shah-1979
title: Sullivan advises against admitting the Shah to the US
summary: Asked by Secretary of State Vance in February 1979, after militants briefly held the embassy, Ambassador
  Sullivan advised that admitting the Shah to the United States was not a sound idea for embassy security or for
  relations with Iran's new government.
