review:
  status: sourced
  notes:
  - 'source_credibility ''high'' is an editorial judgement: Sorge''s information came from the German
    ambassador''s circle and proved correct, but the Barbarossa article notes that earlier dates from
    him and others passed without an attack, which may be why Moscow discounted him.'
  - 'The two Wikipedia articles disagree on whether Sorge gave the exact date; the summary says it is
    disputed. The ''early false alarms'' could become their own signal items with outcome: false once
    dated sources are found.'
