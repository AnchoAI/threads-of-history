id: sorge-warns-of-german-attack-1941
title: Sorge warns Moscow of a German attack
summary: Richard Sorge, a Soviet intelligence officer in Tokyo, reports from German embassy sources on
  30 May 1941 that Germany will attack in the latter part of June, and on 20 June that war is inevitable.
  Stalin and other Soviet leaders ignore his and other warnings. Whether Sorge gave the exact date is
  disputed.
