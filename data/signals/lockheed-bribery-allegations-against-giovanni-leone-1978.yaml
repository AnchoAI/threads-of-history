id: lockheed-bribery-allegations-against-giovanni-leone-1978
title: Lockheed bribery allegations against President Giovanni Leone
summary: In 1978 Italian President Giovanni Leone is accused of bribery in the Lockheed scandal, in allegations
  supported by the magazine L'Espresso. He resigned in June 1978; according to Wikipedia the accusations were never
  proved, his most prominent accuser was convicted of libel three times, and he was later rehabilitated.
