id: fisher-permanently-high-plateau-1929
title: Irving Fisher's "permanently high plateau"
summary: Irving Fisher, then one of the best-known economists in the United States, said that stock prices
  had reached "what looks like a permanently high plateau"; the remark appeared in the New York Times
  on 16 October 1929, about a week before the crash.
