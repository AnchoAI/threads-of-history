id: cia-says-shah-may-lose-dynasty-1978
title: 'CIA: the Shah''s delay has substantially reduced his chance of preserving the dynasty'
summary: On 9 November 1978 the CIA commented on a DIA paper that the Shah had delayed so long that he had substantially
  reduced his chance of preserving the Pahlavi dynasty with its past powers; by then, its later review says, analysts
  had concluded that the Shah might fall.
