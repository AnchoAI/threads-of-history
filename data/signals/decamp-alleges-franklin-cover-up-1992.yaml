id: decamp-alleges-franklin-cover-up-1992
title: John DeCamp alleges a Franklin cover-up
summary: Former Nebraska state senator John DeCamp publishes The Franklin Cover-up, alleging that the abuse ring
  was real and that the investigations covered it up; later writers, including Nick Bryant, and a 1993 Yorkshire
  Television documentary that was never broadcast make similar claims. No court or law-enforcement agency has substantiated
  them.
