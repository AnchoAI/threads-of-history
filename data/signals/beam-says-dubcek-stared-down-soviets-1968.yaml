id: beam-says-dubcek-stared-down-soviets-1968
title: 'US Embassy Prague: Dubček stared down the Soviet threat'
summary: On 4 August 1968, after Čierna and Bratislava, Ambassador Jacob Beam reported that the Dubček leadership
  could "take considerable credit for saving its skin at Cierna and for staring down the Soviet threat of force",
  while warning that the Bratislava Declaration gave a possible future justification for intervention.
