id: officials-call-inflation-transitory-2021
title: US officials call rising inflation "transitory"
summary: In 2021 Federal Reserve chairman Jerome Powell expected inflation to be "transitory" and Treasury
  Secretary Janet Yellen called the risk "small" and "manageable", a view Paul Krugman shared, while Larry
  Summers and Olivier Blanchard warned it would persist. Inflation kept accelerating through 2021 and
  into 2022.
