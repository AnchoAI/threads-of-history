id: ball-report-on-iranian-crisis-1978
title: 'George Ball report: the Shah "irreparably damaged"; open a channel to Khomeini'
summary: In a report to President Carter dated 12 December 1978, George Ball judged that the time for action could
  be measured in days and urged a disavowable channel to Khomeini. The National Security Archive says he predicted
  the Shah could not survive in his present role and that the report had virtually no impact.
