id: ash-shiraa-reports-us-arms-sales-to-iran-1986
title: Ash-Shiraa reports secret US arms sales to Iran
summary: On 3 November 1986 the Lebanese magazine Ash-Shiraa reports that the United States had been secretly selling
  weapons to Iran, the first public report of what became the Iran–Contra affair. Reagan then said on television
  that the transfers had occurred but denied trading arms for hostages; in March 1987 he said the opening to Iran
  had deteriorated into trading arms for hostages.
