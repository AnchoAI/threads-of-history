id: baden-disputes-epstein-suicide-ruling-2019
title: Pathologist hired by Epstein estate questions suicide ruling
summary: Michael Baden, a pathologist hired by Epstein's estate who observed the autopsy, says injuries including
  a broken neck bone are "extremely unusual in suicidal hangings"; Epstein's lawyers say the evidence is more consistent
  with murder. The FBI found no criminality, and the Justice Department's Inspector General found no evidence contradicting
  that.
