  notes:
  - Batch P1 (Cuba 1962, primary documents). Quotes copied from fetched pages; no person has reviewed
    this yet.
  - 'source_credibility medium is an editorial judgement: McCone was the DCI, but his warning was an inference
    from the air-defence pattern (his own word in one cable was "hunch"), not evidence of missiles.'
  - The cables themselves are in the FRUS Supplement; this item quotes the FRUS editorial note that summarises
    and quotes them.
