id: mccone-warns-of-soviet-mrbms-in-cuba-1962
title: McCone warns Soviet MRBMs may be coming to Cuba
summary: From August 1962 CIA Director John McCone argued that the Soviet buildup in Cuba could include
  medium-range ballistic missiles, and in cables from his honeymoon in September said the costly air defences
  were hard to explain unless they were meant to hide them. CIA analysts and SNIE 85-3-62 disagreed; McCone
  took exception to the estimate on 20 September.
