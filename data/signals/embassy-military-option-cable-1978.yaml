id: embassy-military-option-cable-1978
title: 'Embassy Tehran: "A military takeover is feasible but at heavy long-term cost"'
summary: On 2 November 1978 Ambassador William Sullivan reported that almost everybody expected the Shah to order
  a military takeover if disorders continued, that the Shah had named a military government as one of his options,
  and that a takeover was feasible but at heavy long-term cost. The Shah appointed a military government four days
  later.
