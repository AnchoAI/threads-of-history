id: soviet-nuclear-false-alarm-1983
title: Soviet early-warning system reports US missile launches
summary: On 26 September 1983 the Soviet Oko early-warning system reports the launch of one US intercontinental
  ballistic missile, followed by four more. The duty officer, Stanislav Petrov, waits for corroborating
  evidence, which never comes, instead of passing the warning up the chain of command; the alarms were
  later traced to sunlight on high-altitude clouds. The incident was first made public in 1998.
