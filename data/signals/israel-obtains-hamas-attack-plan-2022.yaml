id: israel-obtains-hamas-attack-plan-2022
title: Israeli intelligence obtains Hamas's 'Jericho Wall' attack plan
summary: More than a year before 7 October 2023, Israeli officials obtained a detailed Hamas plan for a mass
  invasion of southern Israel, which the New York Times later reported Hamas followed closely. Military and
  intelligence leaders largely dismissed it as beyond Hamas's capabilities.
