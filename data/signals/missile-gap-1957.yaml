id: missile-gap-1957
title: US estimates of a Soviet "missile gap"
summary: From December 1957 US estimates, including the Gaither Committee's and National Intelligence
  Estimates, projected a fast-growing Soviet ICBM force; NIE 11-5-58 (August 1958) foresaw 100 ICBMs in
  1960 and perhaps 500 in 1961. Khrushchev's boasts fed the perception, and Senator John F. Kennedy campaigned
  on the "missile gap". The gap did not exist except in exaggerated estimates.
