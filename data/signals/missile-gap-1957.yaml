id: missile-gap-1957
title: US estimates warn of a Soviet "missile gap"
summary: After Sputnik, the Gaither Committee and US Air Force estimates warn that the Soviet Union will
  soon lead in intercontinental missiles, and Kennedy campaigns on a "missile gap". Satellite photographs
  in 1961 showed the gap did not exist and favoured the United States.
