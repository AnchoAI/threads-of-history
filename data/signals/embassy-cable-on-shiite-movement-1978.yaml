id: embassy-cable-on-shiite-movement-1978
title: 'US Embassy Tehran: ''Understanding the Shi''ite Islamic Movement'''
summary: A 3 February 1978 embassy telegram analysed the renascent Shi'ite religious movement, named Ayatollah Khomeini
  as its symbolic leader and advised that Islam was deeply imbedded in the lives of most Iranians.
