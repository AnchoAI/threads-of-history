id: helms-warns-johnson-of-emergency-politburo-meeting-1968
title: Helms links an emergency Politburo meeting to invasion
summary: On 20 August 1968, hours before the invasion, CIA Director Richard Helms and his analysts concluded
  that an urgent Politburo meeting in Moscow, together with the military alert in Central Europe, pointed to
  an invasion of Czechoslovakia; according to the CIA's later history, President Johnson replied that the meeting
  was about the United States.
