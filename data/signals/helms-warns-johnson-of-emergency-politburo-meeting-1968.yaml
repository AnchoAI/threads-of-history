  - 'Sourced once the quote checker could read PDFs; the analysts'' conclusion is in the PDF but split across
    its two-column layout, so only Johnson''s reply is quoted. Extracted text (pages 10–11): "Clarke, Lehman, and Helms agreed that, taken together with
    the military alert in Central Europe, the emergency Politburo meeting was a sure indicator something was
    about to happen, most probably the invasion of Czechoslovakia." and "Remarkably, LBJ rejected that conclusion,
    saying, ''Dick, that Moscow meeting is to talk about us.''" The FRUS quote (Helms at the NSC meeting that
    night) is checked.'
