id: thompson-expects-soviets-to-push-czechs-back-1968
title: 'Thompson: Soviets will go to great lengths to push the Czechs back'
summary: In a 2 August 1968 cable from Moscow, after the Čierna talks, Ambassador Llewellyn Thompson judged
  that the Soviets would "go to great lengths to push the Czechs back to something close to the pre-January
  situation" and said he was pessimistic in the short run, while noting the Soviet leaders' tendency to "postpone,
  compromise or muddle through".
