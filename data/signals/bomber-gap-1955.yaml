id: bomber-gap-1955
title: US fears of a Soviet "bomber gap"
summary: At the July 1955 Soviet Aviation Day flypast, ten Bison bombers flew past twice, with eight more,
  giving the illusion of 28; Western analysts projected 800 Soviet bombers by 1960, and NIE 11-4-57 later
  forecast 150 to 250 by 1958. The US Air Force built up its own bomber fleet in response. U-2 flights
  later showed the gap did not exist.
