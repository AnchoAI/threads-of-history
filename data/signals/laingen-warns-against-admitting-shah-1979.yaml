id: laingen-warns-against-admitting-shah-1979
title: Chargé Laingen warns that admitting the Shah could endanger the embassy
summary: Through the summer and autumn of 1979 chargé d'affaires Bruce Laingen warned that admitting the Shah would
  harm US interests and put the embassy staff at risk; in early October the embassy reported that admission, even
  on humanitarian grounds, might provoke a severe disturbance. Militants seized the embassy on 4 November.
