id: opana-radar-detects-japanese-aircraft-1941
title: Opana radar detects incoming aircraft
summary: As the first wave of Japanese aircraft approaches Oahu on the morning of 7 December 1941, a US
  Army radar at Opana Point detects it. The duty officer at the Intercept Center presumes it is a scheduled
  flight of B-17 bombers from California, and no alarm is raised.
