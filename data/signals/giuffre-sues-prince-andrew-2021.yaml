id: giuffre-sues-prince-andrew-2021
title: Virginia Giuffre sues Prince Andrew
summary: Virginia Giuffre sues Prince Andrew in federal court in New York, alleging that he sexually abused her
  in the early 2000s after she was trafficked by Jeffrey Epstein at 16 and 17. Andrew denies the allegations; the
  suit is settled in February 2022 without an admission of liability, so no court ruled on them.
