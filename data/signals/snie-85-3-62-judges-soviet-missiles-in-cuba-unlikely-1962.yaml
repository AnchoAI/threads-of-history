id: snie-85-3-62-judges-soviet-missiles-in-cuba-unlikely-1962
title: SNIE 85-3-62 judges Soviet missiles in Cuba unlikely
summary: The US intelligence community's Special National Intelligence Estimate of 19 September 1962 judged
  that Soviet medium and intermediate range missiles in Cuba would be incompatible with Soviet policy
  as then estimated, and that the Soviets would almost certainly see that this would provoke a dangerous
  US reaction. Missile sites were photographed under construction on 14 October.
