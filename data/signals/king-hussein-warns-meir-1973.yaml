id: king-hussein-warns-meir-1973
title: King Hussein warns Golda Meir of a Syrian attack
summary: On the night of 25 September 1973 King Hussein of Jordan flew secretly to Tel Aviv to warn Prime Minister
  Golda Meir of an impending Syrian attack. The warning was not acted on; Israeli intelligence judged he had
  said nothing new.
