id: lifting-of-martial-law-in-taiwan-1987
title: Lifting of martial law in Taiwan
summary: President Chiang Ching-kuo ended martial law in Taiwan on 14–15 July 1987, after more than 38 years,
  which was followed by Taiwan's liberalisation and democratisation.
occurred:
  start: '1987-07-15'
  precision: day
  note: The source gives 14 July for the proclamation; martial law ended on 15 July.
