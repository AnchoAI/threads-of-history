id: arpanet-1969
title: ARPANET
summary: The US Advanced Research Projects Agency's packet-switched network makes its first host-to-host
  connection, between UCLA and the Stanford Research Institute. It adopted TCP/IP in 1983 and, with it,
  became a technical foundation of the Internet; it was decommissioned in 1990.
