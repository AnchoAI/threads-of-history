id: locarno-treaties-1925
title: Locarno Treaties
summary: Seven agreements negotiated at Locarno in October 1925 and signed in London on 1 December. Germany,
  France, Belgium, Britain and Italy guaranteed the Franco-German and Belgian-German borders set at Versailles
  and the demilitarised Rhineland; the treaties led to Germany joining the League of Nations in 1926.
