id: kristallnacht-1938
title: Kristallnacht
summary: A state-sponsored pogrom against Jews across Nazi Germany, including Austria and the Sudetenland,
  on 9–10 November 1938, which the regime presented as a response to the shooting of German diplomat Ernst
  vom Rath in Paris. Nazis burned more than 1,400 synagogues and vandalised thousands of Jewish businesses,
  and some 30,000 Jewish men were sent to concentration camps.
