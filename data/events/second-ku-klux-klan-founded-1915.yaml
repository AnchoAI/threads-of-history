id: second-ku-klux-klan-founded-1915
title: Second Ku Klux Klan founded
summary: William Joseph Simmons founds a revived Ku Klux Klan atop Stone Mountain, Georgia, in 1915. Reaching its
  peak in the 1920s, it spread beyond the South, attracted millions of members and promoted nativism and racial
  segregation, at times with mob violence.
