id: east-german-uprising-1953
title: East German uprising of 1953
summary: On 16 June 1953 construction workers in East Berlin struck against raised work quotas; the next
  day protests against the government and the ruling SED spread to about 700 localities and over a million
  people, and Soviet tanks were sent in to put them down. Estimates of the dead range from 55 to more
  than 125.
