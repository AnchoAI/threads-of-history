id: putin-succeeds-yeltsin-1999
title: Putin succeeds Yeltsin as president
summary: Vladimir Putin, named prime minister in August 1999 and at first little known, gains popularity
  from television coverage of his leadership of the war in Chechnya. He becomes acting president when
  Boris Yeltsin resigns on 31 December 1999 and wins the presidential election in the first round on 26
  March 2000.
