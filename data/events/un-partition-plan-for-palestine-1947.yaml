id: un-partition-plan-for-palestine-1947
title: UN Partition Plan for Palestine
summary: The UN General Assembly adopted Resolution 181, recommending that Mandatory Palestine be partitioned
  into independent Arab and Jewish states with an international regime for Jerusalem. The Jewish Agency accepted
  it with misgivings; the Arab Higher Committee and Arab governments rejected it.
