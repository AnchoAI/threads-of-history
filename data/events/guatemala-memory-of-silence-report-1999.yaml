id: guatemala-memory-of-silence-report-1999
title: Guatemalan truth commission report 'Memory of Silence'
summary: The Commission for Historical Clarification presents its report on the civil war, finding that
  over 200,000 people were killed or disappeared and attributing 93% of violations to state forces. The
  US supplied declassified documents; President Clinton apologised to Guatemala soon after.
