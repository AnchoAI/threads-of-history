id: decline-of-serfdom-in-western-europe-1350
title: Decline of serfdom in Western Europe
summary: Between the mid-14th century and about 1500, serfdom largely disappeared across much of Western and Central
  Europe, while in Eastern Europe it was tightened (the 'second serfdom'). Why the two regions diverged is a long-running
  historians' debate.
