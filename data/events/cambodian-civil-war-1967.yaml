id: cambodian-civil-war-1967
title: Cambodian Civil War
summary: A civil war in Cambodia in which the Khmer Rouge fought the government. After the March 1970 coup, the
  Khmer Rouge and forces loyal to Norodom Sihanouk, backed by North Vietnam and China, fought the US- and South
  Vietnam-backed Khmer Republic. The article describes it as part of the Vietnam War.
