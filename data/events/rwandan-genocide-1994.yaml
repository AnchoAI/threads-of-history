id: rwandan-genocide-1994
title: Rwandan genocide
summary: Over about 100 days, Hutu militias systematically kill members of the Tutsi minority, as well
  as some moderate Hutu and Twa. Most scholarly estimates put Tutsi deaths at 500,000 to 662,000; Rwanda's
  constitution says over a million people were killed. The Rwandan Patriotic Front ended it by defeating
  the government forces.
