id: letter-of-invitation-1968
title: Czechoslovak hardliners' "letter of invitation" to Brezhnev
summary: Five conservative Czechoslovak party leaders (Alois Indra, Drahomír Kolder, Antonín Kapek, Oldřich
  Švestka and Vasil Biľak) signed a secret letter in Russian asking Brezhnev to "lend support and assistance
  with all the means at your disposal" against "the imminent danger of counterrevolution". It was reportedly
  handed over during the Bratislava conference; the letter itself was not produced until Russia gave copies
  to Czechoslovakia in July 1992.
