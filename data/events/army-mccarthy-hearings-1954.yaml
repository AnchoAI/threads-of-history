id: army-mccarthy-hearings-1954
title: Army–McCarthy hearings televised
summary: Senate hearings into conflicting accusations between the US Army and Senator Joseph McCarthy convene on
  16 March 1954 and are carried live on ABC and DuMont television from 22 April to 17 June. McCarthy's Gallup approval
  fell from 50% in January to 34% in June.
