id: maastricht-treaty-1992
title: Maastricht Treaty founds the European Union
summary: Signed on 7 February 1992 by the twelve members of the European Communities and in force from
  1 November 1993, the Maastricht Treaty founded the European Union and set a staged path to monetary
  union, with criteria for adopting a single currency and a European Central Bank. Since the eurozone
  crisis it is cited above all for these 'Maastricht criteria'.
