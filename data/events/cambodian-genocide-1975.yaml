id: cambodian-genocide-1975
title: Cambodian genocide
summary: The Khmer Rouge under Pol Pot, after taking Phnom Penh on 17 April 1975, emptied the cities and persecuted
  and killed Cambodians until Vietnam's invasion toppled the regime in January 1979. Estimates of the dead
  range from about 1.2 to 2.2 million, roughly a quarter of the 1975 population.
