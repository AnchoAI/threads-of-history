id: japanese-occupation-of-the-dutch-east-indies-1942
title: Japanese occupation of the Dutch East Indies
summary: Japan invades the Dutch East Indies, the Dutch surrender on 8 March 1942, and Japan occupies
  the colony until after the end of the war. A later UN report put deaths from famine and forced labour
  at 4 million.
