id: fascist-and-anti-fascist-violence-in-italy-1919
title: Fascist and anti-Fascist violence in Italy (1919–1926)
summary: Widespread civil unrest and political strife in Italy after the First World War, as Benito Mussolini's
  fascist movement rose against the political left. The Fascists, and later some historians, called the period the
  "Fascist Revolution", a term Italian historians did not commonly accept.
