id: iran-saudi-arabia-proxy-conflict-1979
title: Iran–Saudi Arabia proxy conflict
summary: Since Iran's 1979 revolution, Iran and Saudi Arabia have competed for influence across the Middle East
  and backed opposing sides in conflicts including the civil wars in Syria and Yemen. Analysts describe a mainly
  political and economic struggle in which both sides exploit sectarian differences.
