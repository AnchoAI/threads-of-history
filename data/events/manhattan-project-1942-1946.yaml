id: manhattan-project-1942-1946
title: Manhattan Project
summary: The secret US-led programme, directed from 1942 to 1946 by General Leslie Groves, that built
  the first nuclear weapons, tested at Trinity and used on Hiroshima and Nagasaki. Its existence was kept
  secret until after the Hiroshima bombing, although Soviet spies penetrated it.
