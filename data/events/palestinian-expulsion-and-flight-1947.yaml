  notes:
  - 'Year precision: the source''s first phase is ''December 1947 – March 1948'' and the end is given only
    as 1949. The UN Conciliation Commission estimated 711,000 refugees outside Israel in September 1949.'
  - Whether the exodus amounted to ethnic cleansing is itself debated; the source says 'Scholars widely describe
    the event as ethnic cleansing, although some disagree.' The summary avoids the term and attributes the
    causal dispute instead.
