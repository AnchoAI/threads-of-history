id: palestinian-expulsion-and-flight-1947
title: Palestinian exodus (Nakba)
summary: 'During the 1947–49 Palestine war more than 700,000 Palestinian Arabs, about half of Mandatory Palestine''s
  Arab population, were expelled or fled; Palestinians call this part of the Nakba. Its causes are disputed:
  most scholarship cited by the source sees expulsions, violence and fear as primary, while historians such
  as Efraim Karsh argue most left of their own accord or under Arab pressure.'
