id: oil-crisis-1979
title: 1979 oil crisis
summary: After Iran's revolution cut its oil output by 4.8 million barrels a day by January 1979, oil
  prices more than doubled between April 1979 and April 1980. The Federal Reserve History account says
  fear of further disruption, speculative hoarding and strong demand may have mattered more than the lost
  supply itself.
