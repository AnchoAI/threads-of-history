id: bloody-sunday-1905
title: Bloody Sunday
summary: Soldiers of the Imperial Guard fired on workers marching under Father Georgy Gapon to petition
  Tsar Nicholas II in St Petersburg. Official figures gave 96 dead; other estimates are far higher.
