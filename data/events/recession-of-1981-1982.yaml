id: recession-of-1981-1982
title: US recession of 1981–1982
summary: A US recession from July 1981 to November 1982, triggered by the tight monetary policy used to
  fight inflation. Unemployment reached nearly 11 percent, the highest since the Second World War, while
  inflation fell to 5 percent by October 1982.
