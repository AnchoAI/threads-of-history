id: cold-war-1947-1991
title: Cold War
summary: A period of geopolitical rivalry between the United States and the Soviet Union and their allies, waged
  through proxy wars, a nuclear arms race, espionage and propaganda rather than direct war between the two superpowers.
  It is generally dated from the Truman Doctrine of March 1947 to the dissolution of the Soviet Union in December
  1991.
