id: guatemalan-civil-war-1960
title: Guatemalan Civil War
summary: Leftist insurgencies starting in 1960 grow into a 36-year war with the US-backed military government.
  A truth commission later attributed 93% of the violations to state forces, including genocide against
  the Maya in the 1980s; an estimated 200,000 people were killed or disappeared.
