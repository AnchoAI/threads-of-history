title: Princess Diana shakes hands with an HIV patient
summary: In April 1987 Diana, Princess of Wales, opens the UK's first purpose-built HIV/AIDS unit, at London's Middlesex
  Hospital, and is photographed shaking the hand of a man with the illness in front of the press.
