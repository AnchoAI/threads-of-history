id: operation-wrath-of-god-1972
title: Operation Wrath of God
summary: A covert Mossad operation, authorised by Israeli Prime Minister Golda Meir in autumn 1972, to assassinate
  people it accused of involvement in the Munich massacre, targeting members of Black September and the PLO; it
  is believed to have continued for over twenty years.
