id: iran-contra-affair-1984
title: Iran–Contra affair
summary: 'Two secret Reagan administration operations coordinated by National Security Council staff: arms sales
  to Iran in 1985–86, despite an embargo, to obtain the release of American hostages in the Middle East, and secret
  support for the Nicaraguan Contras while Congress prohibited it. Some proceeds of the arms sales were diverted
  to the Contras; Independent Counsel Lawrence Walsh concluded that high-ranking officials violated laws and executive
  orders.'
