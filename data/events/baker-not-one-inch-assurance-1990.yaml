id: baker-not-one-inch-assurance-1990
title: Baker's 'not one inch eastward' assurance
summary: 'Meeting Gorbachev in Moscow on 9 February 1990 during the German unification talks, US Secretary
  of State James Baker asks whether he would prefer a united Germany outside NATO or one tied to NATO
  ''with assurances that NATO''s jurisdiction would not shift one inch eastward''. Whether such statements
  amounted to a promise against NATO enlargement is disputed: the National Security Archive says later
  Soviet and Russian complaints were founded in the records, while the historian Mark Kramer called the
  pledge a ''myth''.'
