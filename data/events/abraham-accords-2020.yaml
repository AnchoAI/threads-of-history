id: abraham-accords-2020
title: Abraham Accords
summary: US-mediated agreements, signed in Washington on 15 September 2020, under which the UAE and Bahrain
  normalised relations with Israel; Sudan and Morocco followed. The UAE deal came in exchange for Israel suspending
  plans to annex parts of the West Bank; public opinion in many Arab countries remained opposed.
