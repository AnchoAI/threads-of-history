id: doj-inspector-general-report-on-fbi-nassar-handling-2021
title: Inspector General report on the FBI's handling of the Nassar allegations
wikidata: none
summary: The Justice Department's Inspector General reports that senior officials in the FBI's Indianapolis
  field office, told of allegations against Nassar by USA Gymnastics on 28 July 2015, failed to respond
  with the seriousness and urgency required and violated FBI policies; about 70 or more athletes were
  allegedly abused between then and September 2016.
