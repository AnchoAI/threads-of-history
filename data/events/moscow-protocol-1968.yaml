id: moscow-protocol-1968
title: Moscow Protocol
summary: After the invasion, Czechoslovak leaders including Svoboda, Dubček, Černík and Smrkovský negotiated
  in Moscow from 23 to 26 August 1968 and signed a protocol promising to protect socialism, restrain critical
  media and reject UN Security Council involvement; only František Kriegel refused to sign.
