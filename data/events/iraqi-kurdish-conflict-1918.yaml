id: iraqi-kurdish-conflict-1918
title: Iraqi–Kurdish conflict
summary: A series of wars, rebellions and disputes between Kurds and the central government of Iraq, starting shortly
  after the Ottoman Empire's defeat in the First World War. Some date its start to Mahmud Barzanji's attempt to
  found a Kingdom of Kurdistan; others count only the Barzani insurrection from 1961.
