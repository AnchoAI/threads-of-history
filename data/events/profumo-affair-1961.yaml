id: profumo-affair-1961
title: Profumo affair
summary: John Profumo, Secretary of State for War in Harold Macmillan's Conservative government, had an affair with
  the 19-year-old model Christine Keeler beginning in 1961. He denied it in the House of Commons in March 1963 and
  resigned in June after admitting he had lied; reports that Keeler may also have been involved with the Soviet
  naval attaché Yevgeny Ivanov raised security concerns.
