id: ottoman-safavid-wars-1514
title: Ottoman–Safavid wars
summary: From the Ottoman victory at Chaldiran in 1514, the Sunni Ottoman and Shia Safavid empires fought for more
  than a century, largely over the borderlands and Iraq, until the Treaty of Zuhab in 1639 left Iraq to the Ottomans.
