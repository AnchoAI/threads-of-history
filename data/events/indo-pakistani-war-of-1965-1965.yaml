id: indo-pakistani-war-of-1965-1965
title: Second Kashmir war
summary: After Pakistan's covert Operation Gibraltar fails to spark an insurgency in Indian-held Kashmir,
  India and Pakistan fight a seventeen-day war that ends in a UN-called ceasefire and the Soviet-mediated
  Tashkent Declaration.
