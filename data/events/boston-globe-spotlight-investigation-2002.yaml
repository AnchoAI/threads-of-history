id: boston-globe-spotlight-investigation-2002
title: Boston Globe "Spotlight" investigation of the Archdiocese of Boston
wikidata: none
summary: The Boston Globe's Spotlight Team publishes the first part of an investigation reporting that
  the Archdiocese of Boston, aware of John Geoghan's record of abusing children, moved him from parish
  to parish for years. The series, which won a Pulitzer Prize, brought abuse by Catholic priests to national
  attention.
