id: bush-pardons-iran-contra-defendants-1992
title: George H. W. Bush pardons Iran–Contra defendants
summary: On 24 December 1992 President George H. W. Bush pardons former Defense Secretary Caspar Weinberger, less
  than two weeks before his trial on charges including perjury and false statements, and the CIA officials Duane
  Clarridge, Clair George and Alan Fiers. Independent Counsel Walsh wrote that the Weinberger pardon pre-empted
  a trial at which the defence meant to call Bush as a witness.
