  notes:
  - Batch S1 (political and corporate scandals). Summary and dates checked against the quoted sources; no person
    has reviewed them yet.
  - Walsh's executive summary does not give the date of the CIA officials' pardons; the summary assumes the same
    day. Wikipedia says all the remaining defendants were pardoned 'in the final days' of Bush's presidency. A reviewer
    should confirm the date for Clarridge, George and Fiers.
  - Robert McFarlane and Elliott Abrams were also pardoned (per other sources) but are not named in the fetched
    text, so they are left out.
