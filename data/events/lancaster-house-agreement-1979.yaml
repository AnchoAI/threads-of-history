id: lancaster-house-agreement-1979
title: Lancaster House Agreement
summary: Britain, the Zimbabwe Rhodesia government and the Patriotic Front of Mugabe and Nkomo sign an
  agreement that ends the Bush War and Rhodesia's UDI, restores British rule for a transition, and sets
  a post-independence constitution and a ceasefire.
