  title: 1996 Taiwanese presidential election
  publisher: Wikipedia
  quote: Lee Teng-hui was re-elected President, and Lien Chan as Vice President. Lee stood as the candidate
    for the ruling Kuomintang. He won a majority of 54% of the votes cast. His election followed missile tests
    by the People's Republic of China (PRC). These attempted to intimidate and discourage the Taiwanese electorate
    from supporting Lee; however, the tactic backfired.
