id: taiwan-presidential-election-1996
title: Taiwan's first direct presidential election
summary: On 23 March 1996 Taiwan held its first direct presidential election. Lee Teng-hui of the Kuomintang
  won 54% of the vote, after PRC missile tests intended to intimidate voters.
