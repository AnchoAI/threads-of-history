id: kakuei-tanaka-convicted-1983
title: Kakuei Tanaka convicted in the Lockheed case
summary: On 12 October 1983 the Tokyo District Court convicts former prime minister Kakuei Tanaka of receiving a
  ¥500 million bribe from Lockheed while in office to persuade a domestic airline to buy Lockheed aircraft, and
  sentences him to four years in prison. He had been arrested in July 1976 and remained free on appeal until his
  death in 1993.
