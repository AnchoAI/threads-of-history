id: first-aids-cases-reported-1981
title: First AIDS cases reported
summary: The US CDC reports five cases of a rare pneumonia in previously healthy young gay men in Los
  Angeles, the first official report of what became the AIDS epidemic. By 2024 the disease had caused
  an estimated 42.3 million deaths.
