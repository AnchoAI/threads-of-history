id: mau-mau-uprising-1952
title: Mau Mau uprising
summary: An armed conflict in British Kenya between the Kenya Land and Freedom Army and the colonial authorities.
  Britain declared a state of emergency in October 1952 and interned tens of thousands (80,000 by official
  figures; 160,000–320,000 by Caroline Elkins's estimate); in 2012 the UK government accepted that prisoners
  had suffered torture and ill-treatment.
