id: usa-gymnastics-sex-abuse-scandal-1992
title: Sexual abuse of gymnasts in USA Gymnastics
wikidata: Q42531060
summary: Coaches and other adults sexually abused young gymnasts between 1992 and 2016; the central figure
  was Larry Nassar, national team doctor for USA Gymnastics and a Michigan State University physician,
  whom more than 265 women said abused them under the pretence of medical treatment. USA Gymnastics reported
  him to the FBI in July 2015, more than a year before the public knew.
