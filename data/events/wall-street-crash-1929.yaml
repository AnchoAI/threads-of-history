id: wall-street-crash-1929
title: Wall Street crash
summary: US stock prices collapsed on the New York Stock Exchange in late October 1929, most sharply on
  Black Thursday (24 October) and on Black Monday and Black Tuesday (28–29 October). Prices kept falling
  until July 1932, by when the market had lost some 90% of its pre-crash value.
