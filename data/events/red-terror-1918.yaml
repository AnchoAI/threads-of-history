id: red-terror-1918
title: Red Terror
summary: A Bolshevik campaign of political repression and mass executions, organised by the Cheka and
  officially declared after the attempt on Lenin's life and the killing of Moisei Uritsky. Mainstream
  estimates of deaths range from 50,000 to 600,000.
occurred:
  start: 1918-08
  end: 1922-02
  precision: month
  note: Infobox dates. The text says it officially started in early September 1918; the Sovnarkom decree
    is dated 5 September 1918.
