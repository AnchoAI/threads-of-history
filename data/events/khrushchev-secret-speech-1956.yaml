id: khrushchev-secret-speech-1956
title: Khrushchev's "Secret Speech"
summary: On 25 February 1956, in a closed session of the Soviet party congress, Nikita Khrushchev denounced
  Stalin's purges and his cult of personality, opening the "Khrushchev Thaw" and de-Stalinization. The
  speech was classified "not for publication" but was read to party meetings; its content was known abroad
  within weeks, The New York Times printed the full text on 5 June 1956, and the Soviet press published
  it only in 1989.
