id: new-deal-1933
title: New Deal
summary: A series of economic, social and political reforms in response to the Great Depression in the
  United States under President Franklin D. Roosevelt, from his first hundred days in 1933 until 1938,
  when a conservative coalition in Congress blocked further legislation. It aimed at relief for the unemployed
  and poor, economic recovery and financial reform.
