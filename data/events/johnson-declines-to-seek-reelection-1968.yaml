id: johnson-declines-to-seek-reelection-1968
title: Lyndon Johnson announces he will not seek re-election
summary: On 31 March 1968 President Lyndon B. Johnson announces a partial halt to the bombing of North Vietnam and
  says he will not seek re-election. Historians disagree about why he withdrew.
