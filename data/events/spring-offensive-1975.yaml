id: spring-offensive-1975
title: North Vietnam's 1975 spring offensive
summary: The final North Vietnamese campaign of the Vietnam War, from December 1974 to 30 April 1975, which ended
  in the capitulation of South Vietnam. Coastal cities including Nha Trang fell in early April 1975.
