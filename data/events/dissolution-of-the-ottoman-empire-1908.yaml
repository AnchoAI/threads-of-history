id: dissolution-of-the-ottoman-empire-1908
title: Dissolution of the Ottoman Empire
summary: The final period of the Ottoman Empire, from the Young Turk Revolution of 1908 to the abolition of the
  sultanate in 1922, marked by military defeats, the First World War, partition by the Allies and the founding of
  the modern state of Turkey.
