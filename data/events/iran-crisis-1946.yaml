id: iran-crisis-1946
title: Iran crisis of 1946
summary: After the Second World War the Soviet Union kept troops in northern Iran past the 2 March 1946
  withdrawal deadline while pro-Soviet Iranians proclaimed the separatist Azerbaijan People's Government
  and the Kurdish Republic of Mahabad. Iranian negotiation and US diplomatic pressure led to Soviet withdrawal,
  and Iranian troops re-entered the region in December 1946.
