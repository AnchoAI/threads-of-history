id: 1984-summer-olympics-boycott-1984
title: Boycott of the 1984 Los Angeles Olympics
summary: On 8 May 1984 the Soviet Union announced it would boycott the Los Angeles Summer Olympics, citing security
  concerns and an 'anti-Soviet hysteria' in the United States; fourteen other Eastern Bloc countries followed, and
  four non-aligned countries boycotted on their own initiative.
