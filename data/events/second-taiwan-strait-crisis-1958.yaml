id: second-taiwan-strait-crisis-1958
title: Second Taiwan Strait Crisis
summary: From August to December 1958 the PRC shelled Kinmen and the Matsu Islands to try to take them from
  the ROC and to probe how far the US would defend it. US Navy escorts of ROC supply convoys broke the artillery
  blockade, and the ROC held Kinmen.
