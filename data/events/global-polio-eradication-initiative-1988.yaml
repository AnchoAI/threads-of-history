id: global-polio-eradication-initiative-1988
title: Global Polio Eradication Initiative launched
summary: After a World Health Assembly resolution, the WHO, Rotary International, UNICEF and the US CDC
  launch a campaign to eradicate polio by 2000. Reported cases fell from an estimated 350,000 in 1988
  to 33 in 2018, though the disease was not eradicated.
