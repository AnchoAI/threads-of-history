id: cultural-revolution-1966
title: Cultural Revolution
summary: A sociopolitical movement launched by Mao Zedong in May 1966 to purge 'capitalist and traditional
  elements', marked by Red Guard violence; it ended with Mao's death and the arrest of the Gang of Four in
  1976. Death toll estimates range from hundreds of thousands to millions, for example 1.1–1.6 million (Andrew
  G. Walder, 1966–1971) and 1.728 million 'unnatural deaths' (CCP History Research Center).
