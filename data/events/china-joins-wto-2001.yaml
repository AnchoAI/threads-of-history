id: china-joins-wto-2001
title: China joins the World Trade Organization
summary: China became a member of the World Trade Organization on 11 December 2001, after negotiations
  that began in 1986 and required major changes to its economy. Its membership has been contentious, with
  large economic and political effects on other countries, sometimes called the 'China shock'.
