id: falklands-war-1982
title: Falklands War
summary: Argentina's military junta invades the Falkland Islands; a British task force retakes them in
  a ten-week war that ends with Argentina's surrender. Defeat prompted mass protests in Argentina that
  hastened the junta's fall.
