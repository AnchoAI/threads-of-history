id: iraqi-civil-war-2006
title: Sectarian civil war in Iraq
summary: Sunni and Shia armed groups, among them the Islamic State of Iraq and the Mahdi Army, fought each other,
  the Iraqi government and US-led forces. The insurgency escalated into sectarian civil war after the bombing of
  the al-Askari Shrine in February 2006; by 2008 about 4.7 million Iraqis had been displaced.
