id: sharpeville-massacre-1960
title: Sharpeville massacre
summary: South African police fire on a crowd protesting against apartheid's pass laws at Sharpeville.
  Police records gave 69 dead; later research found at least 91. The ANC and PAC were banned and turned
  to armed struggle soon after.
