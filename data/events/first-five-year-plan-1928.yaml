id: first-five-year-plan-1928
title: First five-year plan
summary: Stalin's first five-year plan pushed rapid industrialisation and the collectivisation of agriculture,
  replacing the New Economic Policy. Peasant resistance and procurement contributed to famine; Stalin
  declared it fulfilled early in 1933.
