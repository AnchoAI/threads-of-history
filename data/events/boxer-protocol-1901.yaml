id: boxer-protocol-1901
title: Boxer Protocol
summary: The Qing government and the powers that had intervened against the Boxers sign a protocol in
  Beijing. It provides for the execution of officials who backed the Boxers, foreign troops in Beijing,
  and an indemnity of 450 million taels of silver.
