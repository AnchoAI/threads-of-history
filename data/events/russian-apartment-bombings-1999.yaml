id: russian-apartment-bombings-1999
title: Russian apartment bombings
summary: Bombs destroy four apartment blocks in Buynaksk, Moscow and Volgodonsk between 4 and 16 September
  1999, killing more than 300 people. A Russian court ruled that Islamist warlords ordered the attacks;
  a number of historians and journalists argue they were a false-flag operation by Russian security services,
  pointing among other things to FSB agents caught planting a device in Ryazan, which the FSB called a
  drill.
