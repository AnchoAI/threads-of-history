id: wto-founded-1995
title: World Trade Organization established
summary: The World Trade Organization was established on 1 January 1995 under the 1994 Marrakesh Agreement
  that concluded GATT's Uruguay Round. It succeeded the GATT and extended trade rules into new areas such
  as services and intellectual property.
