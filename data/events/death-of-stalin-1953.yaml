id: death-of-stalin-1953
title: Death of Stalin
summary: Joseph Stalin died after a stroke on 5 March 1953 at his dacha at Kuntsevo, leaving no designated
  successor; Malenkov, Beria and Khrushchev emerged as the dominant figures of a collective leadership.
  At least 109 people died in a crowd crush on the day of his funeral, 9 March.
