id: soviet-invasion-of-poland-1939
title: Soviet invasion of Poland
summary: On 17 September 1939 the Soviet Union invades eastern Poland without a declaration of war, in
  line with the secret protocol of the Molotov–Ribbentrop Pact. Operations end on 6 October with Poland
  divided between Germany and the Soviet Union.
