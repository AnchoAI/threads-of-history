id: detainee-treatment-act-2005
title: Detainee Treatment Act
summary: After the Senate passed Senator John McCain's amendment 90 to 9 in October 2005 despite White House opposition,
  President George W. Bush signs the Detainee Treatment Act on 30 December 2005. It prohibits cruel, inhuman or
  degrading treatment of any prisoner of the US government and limits military interrogations to the techniques
  in the Army Field Manual.
