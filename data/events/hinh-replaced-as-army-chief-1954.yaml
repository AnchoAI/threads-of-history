id: hinh-replaced-as-army-chief-1954
title: General Nguyen Van Hinh replaced as South Vietnam's army chief
summary: General Nguyen Van Hinh, chief of staff of the Vietnamese National Army, who had defied Prime Minister
  Ngo Dinh Diem, was replaced by General Le Van Ty and returned to France in November 1954.
