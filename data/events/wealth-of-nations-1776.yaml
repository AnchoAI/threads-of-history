id: wealth-of-nations-1776
title: Adam Smith's The Wealth of Nations published
summary: Adam Smith publishes The Wealth of Nations, which argues against mercantilism and for free trade. It became
  a foundational work of economic liberalism and the classical political economy that Marx later criticised.
