id: oral-contraceptive-pill-approved-1960
title: First contraceptive pill approved in the US
summary: The US Food and Drug Administration approves Enovid for contraception, the first oral contraceptive
  pill. The pill is described as a catalyst for the sexual revolution and is now used by more than 100
  million women.
