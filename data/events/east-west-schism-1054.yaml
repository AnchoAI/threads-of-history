id: east-west-schism-1054
title: East–West Schism (Great Schism)
summary: On 16 July 1054 papal legates excommunicated Patriarch Michael Cerularius in Hagia Sophia, and
  he excommunicated them in turn. The date is conventionally used for the break of communion between the
  Catholic and Eastern Orthodox churches, though historians describe a split that developed over centuries.
