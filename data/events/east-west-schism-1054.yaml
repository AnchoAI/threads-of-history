- url: https://en.wikipedia.org/wiki/East%E2%80%93West_Schism
  title: East–West Schism
  publisher: Wikipedia
  quote: On 16 July 1054, three months after Pope Leo's death in April 1054 and nine months before the
    next pope took office, they laid on the altar of Hagia Sophia, which was prepared for the celebration
    of the Divine Liturgy, a bull of excommunication of Cerularius and his supporters.
  type: reference
  accessed: '2026-10-14'
- url: https://en.wikipedia.org/wiki/East%E2%80%93West_Schism
  title: East–West Schism
  publisher: Wikipedia
  quote: At a synod held on 20 July 1054, Cerularius in turn excommunicated the legates.
  type: reference
