id: assassination-of-anwar-sadat-1981
title: Assassination of Anwar Sadat
summary: Members of Egyptian Islamic Jihad killed President Sadat at a Cairo victory parade on 6 October 1981.
  The source says the motive is debated but likely stemmed from opposition to his peace initiative with Israel;
  it followed a crackdown in which Sadat had ordered mass arrests.
