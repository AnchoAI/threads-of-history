id: hollywood-blacklist-1947
title: Hollywood blacklist
summary: The first systematic Hollywood blacklist is instituted on 25 November 1947, the day after ten screenwriters
  and directors who refused to answer questions before the House Un-American Activities Committee (HUAC) were cited
  for contempt of Congress. More than 300 actors, authors and directors were denied work; the blacklist had weakened
  by 1960.
occurred:
  start: '1947-11-25'
  precision: day
  note: No official end date; generally seen as weakened by 1960.
