id: thirteenth-amendment-1865
title: Thirteenth Amendment abolishes slavery in the US
summary: The Thirteenth Amendment makes slavery and involuntary servitude illegal in the United States, except as
  punishment for a crime. It was ratified on 6 December 1865, the first of three Reconstruction Amendments.
