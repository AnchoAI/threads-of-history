id: reform-and-opening-up-1978
title: Reform and opening up
summary: Economic reforms launched under Deng Xiaoping at the Third Plenum of the 11th Central Committee on
  18 December 1978. They de-collectivised agriculture, abolished the people's communes, allowed foreign investment
  and created special economic zones such as Shenzhen, moving China towards what is officially called a socialist
  market economy.
