id: russian-constitutional-crisis-1993
title: Russian constitutional crisis of 1993
summary: A standoff between President Boris Yeltsin and parliament ends when Yeltsin dissolves parliament
  and, on 4 October 1993, the army shells the parliament building and storms it; 147 people were killed
  according to official figures. Yeltsin then expanded the powers of the executive and pushed through
  the 1993 constitution.
