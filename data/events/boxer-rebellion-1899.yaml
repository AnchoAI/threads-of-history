id: boxer-rebellion-1899
title: Boxer Rebellion
summary: An anti-foreign, anti-Christian uprising in North China, which the Qing court came to back, besieged
  the foreign legations in Beijing from June to August 1900. It was defeated by the Eight-Nation Alliance
  and ended with the Boxer Protocol of 7 September 1901.
