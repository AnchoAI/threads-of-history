id: treaty-of-versailles-1919
title: Treaty of Versailles
summary: Peace treaty between Germany and most of the Allied powers, signed on 28 June 1919 and in force
  from 10 January 1920. Article 231 held Germany and her allies responsible for the war's loss and damage
  and set the stage for reparations; critics such as John Maynard Keynes called the treaty too harsh,
  while Marshal Ferdinand Foch called it too lenient.
