id: dna-double-helix-1953
title: Watson and Crick publish the DNA double helix
summary: Francis Crick and James Watson publish the double-helix structure of DNA in Nature, drawing heavily
  on unpublished X-ray work by Rosalind Franklin and others at King's College London. Crick, Watson and
  Maurice Wilkins won the 1962 Nobel Prize for it.
