id: iranian-election-protests-2009
title: Iranian presidential election protests (Green Movement)
summary: Protests break out across Iran on the night of 12 June 2009 after Mahmoud Ahmadinejad is declared the winner
  of the presidential election despite reported irregularities. Supporters of Mir-Hossein Mousavi and Mehdi Karroubi,
  calling themselves the Green Movement, protested until 2010.
