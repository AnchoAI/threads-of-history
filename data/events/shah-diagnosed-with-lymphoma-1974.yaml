id: shah-diagnosed-with-lymphoma-1974
title: The Shah's secret lymphoma
summary: In 1974 French doctors diagnosed the Shah with a mild form of lymphoma, which he kept a state secret. A
  1977 State Department report described him as in fine health; Washington learned of the cancer in October 1979,
  days before admitting him for treatment.
