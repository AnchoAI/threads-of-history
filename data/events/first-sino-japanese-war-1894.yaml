id: first-sino-japanese-war-1894
title: First Sino-Japanese War
summary: Japan and Qing China fought from July 1894 to April 1895, chiefly over influence in Korea. Japan
  won, and the Treaty of Shimonoseki forced China to pay a large indemnity and cede Taiwan.
