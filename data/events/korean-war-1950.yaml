id: korean-war-1950
title: Korean War
summary: North Korea invaded South Korea on 25 June 1950, and China's People's Volunteer Army entered
  the war on the North's side in October. Combat ended with the armistice of 27 July 1953, which created
  a demilitarised zone along the front line.
