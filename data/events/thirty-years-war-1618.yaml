id: thirty-years-war-1618
title: Thirty Years' War
summary: A war fought mainly in Central Europe from 1618 to 1648, among the most destructive in European
  history, with an estimated 4.5 to 8 million deaths. Its causes lay in religious conflict in the Holy
  Roman Empire, but external rivalries shaped its scope.
