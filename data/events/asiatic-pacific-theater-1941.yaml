id: asiatic-pacific-theater-1941
title: Asiatic-Pacific theater
summary: The theater of operations of United States forces in and around the Pacific Ocean during the Second World
  War. From mid-1942 it was split between two commands, the Pacific Ocean Areas under Chester Nimitz and the South
  West Pacific Area under Douglas MacArthur.
