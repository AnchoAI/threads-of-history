id: nigerian-civil-war-1967
title: Nigerian Civil War
summary: Nigeria fights the secessionist Republic of Biafra from July 1967 to January 1970. The war followed a 1966
  coup, a counter-coup and anti-Igbo pogroms; how far its roots lie in colonial rule is debated.
