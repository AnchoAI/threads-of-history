id: diet-of-worms-1521
title: Diet of Worms
summary: An imperial assembly called by Emperor Charles V met in Worms from 28 January to 25 May 1521.
  Martin Luther refused to recant his writings there, and the resulting Edict of Worms declared him a
  heretic, though it was never enforced in Germany.
