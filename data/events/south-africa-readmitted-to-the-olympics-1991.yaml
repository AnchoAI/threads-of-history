id: south-africa-readmitted-to-the-olympics-1991
title: South Africa readmitted to the Olympic movement
summary: On 9 July 1991, during the transition away from apartheid, the IOC recognised South Africa's new national
  Olympic committee, and the country competed at the 1992 Barcelona Olympics.
