id: second-opium-war-1856
title: Second Opium War
summary: Britain and France fought Qing China from 1856 to 1860, burning the Old Summer Palace in Beijing.
  The Convention of Peking ended the war and ceded the Kowloon Peninsula to British Hong Kong; in treaties
  made during and after the war China also ceded large territories to Russia.
