id: treaty-of-shimonoseki-1895
title: Treaty of Shimonoseki
summary: Signed on 17 April 1895, the treaty ended the First Sino-Japanese War. China recognised the independence
  of Korea and ceded Taiwan, the Penghu Islands and the Liaodong Peninsula to Japan.
