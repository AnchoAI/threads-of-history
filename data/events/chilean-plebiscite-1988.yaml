id: chilean-plebiscite-1988
title: Chile votes 'No' to Pinochet
summary: Chileans vote on whether Augusto Pinochet should stay president for eight more years; 'No' wins
  with 55.99% of valid votes, ending his chance of extending his rule and starting a transition to democracy.
