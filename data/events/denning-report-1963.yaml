id: denning-report-1963
title: Denning report on the Profumo affair
summary: Lord Denning's report, published on 26 September 1963 after Macmillan asked him to investigate in June,
  finds no security leaks in the Profumo affair and that the security services and ministers had acted appropriately.
  It was later described as superficial.
