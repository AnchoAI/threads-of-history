id: left-and-right-in-the-national-assembly-1789
title: '"Left" and "right" in politics'
summary: In France's revolutionary National Assembly, supporters of the old regime sit to the right of
  the president's chair and supporters of the revolution to the left, giving the world the political terms
  "left" and "right".
