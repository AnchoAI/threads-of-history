id: fall-of-the-berlin-wall-1989
title: Fall of the Berlin Wall
summary: On 9 November 1989, after East German spokesman Günter Schabowski says on television that new
  travel rules take effect 'immediately, without delay', crowds overwhelm the border guards and East Berlin's
  transit restrictions collapse. German reunification followed in October 1990.
