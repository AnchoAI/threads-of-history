  title: Paris Agreement
  publisher: Wikipedia
  quote: The Paris Agreement has a long-term temperature goal which is to keep the rise in global surface temperature
    to well below 2 °C (3.6 °F) above pre-industrial levels. The treaty also states that preferably the limit of
    the increase should only be 1.5 °C (2.7 °F).
  type: reference
  accessed: '2026-10-14'
