id: paris-agreement-2015
title: Paris Agreement adopted
summary: At the COP21 climate conference near Paris, the parties to the UN climate convention adopt by consensus
  a treaty to keep global warming well below 2 °C above pre-industrial levels, and preferably 1.5 °C. Unlike Kyoto,
  each country sets its own targets.
