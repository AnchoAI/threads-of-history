  title: Paris Agreement
  publisher: Wikipedia
  quote: Unlike its predecessor, the Kyoto Protocol, which sets commitment targets that have legal force, the Paris
    Agreement, with its emphasis on consensus building, allows for voluntary and nationally determined targets.
  type: reference
  accessed: '2026-10-14'
