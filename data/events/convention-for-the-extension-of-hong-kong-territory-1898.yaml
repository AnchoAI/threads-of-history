id: convention-for-the-extension-of-hong-kong-territory-1898
title: Britain leases the New Territories for 99 years
summary: Signed in Peking on 9 June 1898, the convention leased the New Territories and New Kowloon to
  Britain for 99 years at no charge. It was part of a "scramble for concessions" by foreign powers after
  China's defeat by Japan.
