id: dallas-charter-2002
title: US bishops adopt the Charter for the Protection of Children and Young People
wikidata: none
summary: Meeting in Dallas, the United States Conference of Catholic Bishops unanimously adopts the Charter
  for the Protection of Children and Young People, a "zero tolerance" policy that requires dioceses facing
  an allegation to alert the authorities, investigate and remove the accused from duty.
