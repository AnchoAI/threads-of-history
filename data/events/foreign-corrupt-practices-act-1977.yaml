id: foreign-corrupt-practices-act-1977
title: Foreign Corrupt Practices Act
summary: Signed by President Jimmy Carter on 19 December 1977, the act makes it unlawful for US persons and companies
  to pay foreign government officials to obtain or keep business. It followed SEC findings that more than 400 US
  companies had paid bribes abroad.
