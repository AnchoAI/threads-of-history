id: anschluss-1938
title: Anschluss
summary: Nazi Germany annexed Austria on 12 March 1938, after Hitler had forced Chancellor Kurt Schuschnigg
  to accept an ultimatum under threat of invasion. The 1919 treaties of Versailles and Saint-Germain had
  forbidden a union of the two countries.
