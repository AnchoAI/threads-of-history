id: kyoto-protocol-1997
title: Kyoto Protocol adopted
summary: Adopted in Kyoto, the protocol extends the 1992 UN climate convention with legally binding emission limits
  for most developed countries. It entered into force on 16 February 2005; the United States did not ratify it.
