id: operation-barbarossa-1941
title: Operation Barbarossa
summary: Germany and its Axis allies invade the Soviet Union on 22 June 1941, the largest and costliest
  military offensive in history. It opens the Eastern Front and brings the Soviet Union into the Allies;
  the offensive stalls outside Moscow by 5 December.
