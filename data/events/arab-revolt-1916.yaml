id: arab-revolt-1916
title: Arab Revolt
summary: Sharif Hussein bin Ali of Mecca launched a revolt against Ottoman rule on the basis of his correspondence
  with Britain's Henry McMahon. By 1918 the rebels had taken Damascus and proclaimed an Arab Kingdom of
  Syria under Faisal.
