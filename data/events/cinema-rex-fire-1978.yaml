id: cinema-rex-fire-1978
title: Cinema Rex fire in Abadan
summary: On 19 August 1978 the Cinema Rex in Abadan was set ablaze, killing between 377 and 470 people. Street protesters
  blamed the Shah's secret police, SAVAK; later findings attributed the arson to Islamist militants, though the
  Islamic Republic still blames SAVAK.
