id: entente-cordiale-1904
title: Entente Cordiale
summary: On 8 April 1904 the United Kingdom and France signed a series of agreements settling colonial disputes,
  recognising Egypt as a British and Morocco as a French sphere of influence. It was not a formal alliance.
