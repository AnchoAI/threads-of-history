id: sino-soviet-border-conflict-1969
title: Sino-Soviet border conflict
summary: A seven-month undeclared military conflict between the Soviet Union and China in 1969, following the
  Sino-Soviet split; the most serious clash was at Zhenbao (Damansky) Island on the Ussuri River. China based
  its territorial demands on 19th-century 'unequal treaties' by which the Qing ceded Outer Manchuria to Russia.
