id: cambridge-analytica-data-harvesting-2013
title: Cambridge Analytica harvests Facebook data
summary: An app built by Aleksandr Kogan in 2013 collects data on up to 87 million Facebook users, mostly
  without consent, which the consulting firm Cambridge Analytica used for political advertising, including
  for Donald Trump's 2016 campaign. First reported in December 2015, it became a scandal when a whistleblower
  spoke out in March 2018.
