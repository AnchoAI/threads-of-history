id: us-covert-action-in-chile-1970
title: US covert action against Allende
summary: After Salvador Allende wins the 1970 election, the Nixon administration and the CIA try first
  to stop Congress confirming him and then to encourage a military coup, and keep up diplomatic, economic
  and covert pressure on his government.
