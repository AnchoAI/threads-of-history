id: hinchey-report-2000
title: Hinchey Report on CIA activities in Chile
summary: A US intelligence community report finds that the CIA did not instigate the 1973 coup but knew
  of the plotting, had ties to some plotters and, having sought a coup in 1970, probably appeared to condone
  it.
