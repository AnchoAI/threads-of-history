  title: 1973 Chilean coup d'état
  publisher: Wikipedia
  quote: Although CIA did not instigate the coup that ended Allende's government on 11 September 1973,
    it was aware of coup-plotting by the military, had ongoing intelligence collection relationships with
    some plotters, and – because CIA did not discourage the takeover and had sought to instigate a coup
    in 1970 – probably appeared to condone it.
