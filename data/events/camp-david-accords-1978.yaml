id: camp-david-accords-1978
title: Camp David Accords
summary: After Sadat's November 1977 visit to Jerusalem and twelve days of secret talks hosted by Jimmy Carter,
  Sadat and Begin signed two framework agreements on 17 September 1978. The second led to the 1979 peace treaty;
  the first, on Palestinian autonomy, was written without Palestinian participation and condemned by the UN.
