id: xi-jinping-becomes-general-secretary-2012
title: Xi Jinping becomes leader of the Communist Party
summary: Xi Jinping succeeded Hu Jintao as general secretary of the Chinese Communist Party after the 18th
  Party Congress of 8–14 November 2012. Later that month he began promoting the 'Chinese Dream' of the 'great
  rejuvenation of the Chinese nation'.
