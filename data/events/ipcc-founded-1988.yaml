id: ipcc-founded-1988
title: IPCC founded
summary: The World Meteorological Organization and the UN Environment Programme set up the Intergovernmental Panel
  on Climate Change to give governments regular scientific assessments of climate change; the UN General Assembly
  endorsed it on 6 December 1988.
