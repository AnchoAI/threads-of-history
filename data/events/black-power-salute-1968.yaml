id: black-power-salute-1968
title: 1968 Olympics Black Power salute
summary: At the 200-metre medal ceremony of the Mexico City Olympics on 16 October 1968, US sprinters Tommie Smith
  and John Carlos each raise a black-gloved fist during the US national anthem. After IOC president Avery Brundage
  threatens to ban the whole US track team, the two are expelled from the Games.
