id: wikileaks-us-diplomatic-cables-2010
title: WikiLeaks publishes US diplomatic cables
summary: On 28 November 2010 WikiLeaks and five newspapers begin publishing leaked US diplomatic cables, 251,287
  in all. Cables from the US embassy in Tunisia described the self-dealing and excess of the Tunisian president's
  family.
