id: ottoman-caliphate-1517
title: Ottoman sultans claim the universal caliphate
summary: After Selim I conquered Mamluk Egypt in 1517 and ended the Cairo line of Abbasid caliphs, Ottoman sultans
  claimed to be caliphs of the entire Muslim world. The Ottoman Caliphate lasted until Turkey abolished it in 1924.
