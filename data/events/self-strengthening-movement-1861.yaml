id: self-strengthening-movement-1861
title: Self-Strengthening Movement
summary: A period of reforms in late Qing China, from 1861 to 1895, that tried to modernise the army and
  industry with Western technology after the Opium Wars and the Taiping Rebellion. It came to an abrupt
  end with China's defeat by Japan in 1895.
