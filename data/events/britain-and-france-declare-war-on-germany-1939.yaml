id: britain-and-france-declare-war-on-germany-1939
title: Britain and France declare war on Germany
summary: After Germany ignores a British ultimatum to halt its invasion of Poland, the United Kingdom
  and France declare war on Germany on 3 September 1939. Their direct military help to Poland is very
  limited.
