id: greek-civil-war-1946
title: Greek Civil War
summary: From 1946 to 1949 a Communist-led uprising, backed by Yugoslavia and Albania, fought the government
  of the Kingdom of Greece, which was supported first by Britain and then the United States and won. It
  is described as the first proxy conflict of the Cold War.
