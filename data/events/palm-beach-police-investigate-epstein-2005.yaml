id: palm-beach-police-investigate-epstein-2005
title: Palm Beach police open an investigation into Jeffrey Epstein
summary: Police in Palm Beach, Florida, open a criminal investigation into Jeffrey Epstein after a girl's parent
  reports that he paid a 14-year-old to massage him; investigators identify dozens of girls aged 14 to 17 with similar
  accounts. The police chief and lead detective later refer the case to the FBI.
