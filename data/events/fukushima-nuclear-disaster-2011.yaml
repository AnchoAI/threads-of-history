id: fukushima-nuclear-disaster-2011
title: Fukushima Daiichi nuclear disaster
summary: The Tōhoku earthquake and tsunami knock out power and cooling at the Fukushima Daiichi plant,
  leading to three core meltdowns and radioactive releases. At least 164,000 people were displaced; it
  was the worst nuclear accident since Chernobyl.
