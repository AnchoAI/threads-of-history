id: october-revolution-1917
title: October Revolution
summary: Lenin's Bolsheviks overthrew the Provisional Government in an insurrection in Petrograd and took
  the Winter Palace. Soviet accounts presented it as a workers' revolution; Western observers called it
  a coup.
