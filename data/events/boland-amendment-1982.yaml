id: boland-amendment-1982
title: Boland Amendments
summary: Between 1982 and 1984 the US Congress passes a series of amendments limiting US government assistance to
  the Contras fighting Nicaragua's Sandinista government; from October 1984 a total ban on such funding took effect.
