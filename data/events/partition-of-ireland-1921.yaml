id: partition-of-ireland-1921
title: Partition of Ireland
summary: On 3 May 1921, under the Government of Ireland Act 1920, the UK divided Ireland into Northern
  Ireland and Southern Ireland. Northern Ireland remained part of the UK, while the south became the Irish
  Free State.
