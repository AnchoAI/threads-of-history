id: battle-of-karbala-0680
title: Battle of Karbala
summary: Umayyad forces of Caliph Yazid I killed Husayn ibn Ali, Muhammad's grandson, with most of his family and
  companions at Karbala in present-day Iraq. Shia Muslims mourn his death each year, culminating on Ashura.
