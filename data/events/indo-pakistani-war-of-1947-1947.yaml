id: indo-pakistani-war-of-1947-1947
title: First Kashmir war
summary: Tribal militias from Pakistan cross into Jammu and Kashmir; its Maharaja accedes to India in
  return for military help, and Indian and later Pakistani troops fight until a UN-mediated ceasefire.
  The ceasefire line later became the Line of Control.
