id: ryan-white-barred-from-school-1985
title: Ryan White barred from school
summary: School officials in Kokomo, Indiana, refuse to readmit Ryan White, a teenager who contracted AIDS through
  contaminated blood products used to treat his haemophilia; a formal request is denied on 30 June 1985. The long
  legal and administrative fight makes him a national figure.
