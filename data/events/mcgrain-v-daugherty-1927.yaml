id: mcgrain-v-daugherty-1927
title: McGrain v. Daugherty
summary: On 17 January 1927 the US Supreme Court upholds the contempt arrest of Mally Daugherty, who had refused
  to appear before a Senate committee investigating his brother, Attorney General Harry Daugherty, over the Teapot
  Dome scandal. The court held for the first time that Congress has the power to compel witnesses to testify.
