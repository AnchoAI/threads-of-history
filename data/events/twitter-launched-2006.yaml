id: twitter-launched-2006
title: Twitter launched
summary: The microblogging service Twitter, created in March 2006 by Jack Dorsey, Noah Glass, Biz Stone and Evan
  Williams, opens to the public on 15 July 2006. By 2012 more than 100 million users posted 340 million tweets a
  day.
