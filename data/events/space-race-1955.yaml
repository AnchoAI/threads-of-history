id: space-race-1955
title: The Space Race
summary: The Cold War competition between the United States and the Soviet Union for superiority in spaceflight,
  rooted in their ballistic-missile and nuclear arms race. It is usually dated from 1955 to the joint
  Apollo–Soyuz mission of 1975.
