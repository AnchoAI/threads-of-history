id: great-inflation-1965
title: The Great Inflation
summary: From 1965 to 1982 US inflation climbed from about 1 percent to more than 14 percent in 1980,
  a period that saw four recessions, two energy crises and peacetime wage and price controls. The Federal
  Reserve History account traces its source to Fed policies that let the money supply grow too fast, while
  economists debate how much other factors, such as oil shocks and fiscal deficits, mattered.
