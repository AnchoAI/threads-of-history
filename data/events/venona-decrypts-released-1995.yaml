id: venona-decrypts-released-1995
title: Venona decrypts made public
summary: In 1995 the US Commission on Government Secrecy, chaired by Senator Daniel Patrick Moynihan,
  released material from the Venona project, a secret US programme (1943–1980) that decrypted about 3,000
  wartime Soviet intelligence messages. The decrypts named Soviet sources including Klaus Fuchs and Julius
  and Ethel Rosenberg; some identifications, notably Alger Hiss's, are disputed.
