id: armenian-genocide-1915
title: Armenian genocide
summary: During the First World War, Ottoman authorities led by the ruling Committee of Union and Progress
  deported and killed Armenians, mainly through death marches to the Syrian desert. The US Holocaust Memorial
  Museum gives at least 664,000 and possibly 1.2 million deaths. Turkey's government rejects the term
  genocide; 36 countries recognise it, in line with the academic consensus.
occurred:
  start: '1915'
  end: '1917'
  precision: year
  note: Wikipedia gives 1915–1917; the US Holocaust Memorial Museum gives spring 1915 to fall 1916. The
    mass arrests in Constantinople were on 24 April 1915.
