id: global-financial-crisis-2008
title: 2007–2008 global financial crisis
summary: The collapse of the US housing bubble set off a financial crisis that began with the subprime
  mortgage crisis in early 2007, peaked with the bankruptcy of Lehman Brothers in September 2008, and
  spread worldwide through bank runs and a stock market crash. It deepened the Great Recession (December
  2007 to June 2009 in the US); its causes are disputed, and the US inquiry commission split along party
  lines.
