id: douglas-county-grand-jury-franklin-report-1990
title: Douglas County grand jury calls Franklin allegations a hoax
summary: A Douglas County grand jury in Omaha reports that the abuse allegations are baseless, "a carefully crafted
  hoax", and indicts two of the accusers for perjury without naming who it suspected of creating the hoax; Franklin
  Committee chairman Loran Schmit calls the report "a strange document".
