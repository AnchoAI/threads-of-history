id: protestant-reformation-1517
title: The Protestant Reformation
summary: A period of religious movements in Western Christianity, usually dated from Luther's Ninety-five
  Theses in 1517, that split Protestant churches from the Catholic Church. Its end date is disputed; 1648
  is commonly used.
