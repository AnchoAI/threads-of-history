id: abu-ghraib-photographs-published-2004
title: CBS and The New Yorker publish the Abu Ghraib photographs
summary: On 28 April 2004 CBS's 60 Minutes II broadcasts photographs of US military personnel abusing prisoners
  at Abu Ghraib; on 30 April The New Yorker posts Seymour Hersh's article based on the Army's internal Taguba report,
  which had not been meant for public release.
