id: first-intifada-1987
title: First Intifada
summary: A Palestinian uprising against Israeli occupation that began on 9 December 1987 in the Jabalia refugee
  camp and lasted until 1991 or 1993. The source attributes at least 1,087 Palestinian deaths to the Israeli
  army, about 160 Israeli deaths, and an estimated 822 Palestinians killed as alleged collaborators.
