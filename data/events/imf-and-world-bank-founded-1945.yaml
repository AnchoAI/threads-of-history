id: imf-and-world-bank-founded-1945
title: IMF and World Bank come into existence
summary: The International Monetary Fund formally came into existence on 27 December 1945, when its first
  29 member countries ratified its Articles of Agreement; it and the World Bank had been created at the
  Bretton Woods Conference of July 1944. For its first three decades the IMF oversaw the Bretton Woods
  system of fixed exchange rates.
