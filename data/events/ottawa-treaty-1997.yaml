id: ottawa-treaty-1997
title: Ottawa Treaty banning anti-personnel landmines
summary: The Mine Ban Treaty, which bans the use of anti-personnel landmines, opened for signature in Ottawa on
  3 December 1997, when 122 countries signed it; it entered into force on 1 March 1999. China, the United States
  and Russia have not signed.
