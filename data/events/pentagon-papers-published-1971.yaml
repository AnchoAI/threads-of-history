id: pentagon-papers-published-1971
title: Pentagon Papers published
summary: The New York Times begins publishing the Pentagon Papers, a Defense Department history of US involvement
  in Vietnam leaked by Daniel Ellsberg, on 13 June 1971. On 30 June the Supreme Court ruled 6–3 against the government's
  attempt to stop publication.
