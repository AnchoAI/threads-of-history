id: second-sudanese-civil-war-1983
title: Second Sudanese Civil War
summary: A war from 1983 to 2005 between Sudan's central government and the Sudan People's Liberation Army, largely
  a continuation of the First Sudanese Civil War. About two million people died, four million in the south were
  displaced, and South Sudan became independent six years after it ended.
