id: soviet-congress-acknowledges-secret-protocol-1989
title: Soviet Congress acknowledges the secret protocol
summary: A commission led by Alexander Yakovlev at Mikhail Gorbachev's request concluded in December 1989
  that the secret protocol had existed. The Congress of People's Deputies then passed a declaration confirming
  and condemning it, and the Soviet Union declared the protocols invalid from the moment of signing on
  24 December 1989.
