id: iraq-war-2003
title: Iraq War
summary: An armed conflict in Iraq from 2003 to 2011. It began in March 2003 with an invasion by a US-led coalition
  that overthrew Saddam Hussein's Ba'athist government, continued as an insurgency against coalition forces and
  the new Iraqi government, and ended with the withdrawal of US forces in 2011.
