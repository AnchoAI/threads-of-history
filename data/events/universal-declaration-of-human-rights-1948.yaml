id: universal-declaration-of-human-rights-1948
title: Universal Declaration of Human Rights
summary: The UN General Assembly, meeting in Paris, adopts a declaration of the rights of all human beings,
  drafted by a committee chaired by Eleanor Roosevelt. 48 members vote in favour, none against, and eight
  abstain.
