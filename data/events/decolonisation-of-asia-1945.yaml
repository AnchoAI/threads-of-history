id: decolonisation-of-asia-1945
title: Decolonisation of Asia after 1945
summary: After the Second World War a wave of decolonisation spread through Asia, as colonies of the European powers,
  the United States and Japan became independent states. The process concluded with the independence of East Timor
  from Indonesia in 2002.
