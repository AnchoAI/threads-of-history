id: european-debt-crisis-2009
title: Eurozone debt crisis
summary: From late 2009, when Greece disclosed budget deficits far higher than previously thought, Greece,
  Portugal, Ireland and Cyprus could no longer repay or refinance their debts or rescue their banks without
  help from other eurozone states, the ECB and the IMF. The crisis lasted until 2018 and brought austerity,
  unemployment as high as 27 percent in Greece and Spain, and changes of government in many countries.
