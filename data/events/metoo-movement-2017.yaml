title: '#MeToo spreads on social media'
wikidata: Q42133786
summary: After the Weinstein reports, actress Alyssa Milano asks people who have been sexually harassed
  or assaulted to reply "me too" on Twitter, a phrase activist Tarana Burke had used since 2006. Millions
  use the hashtag within days, and allegations against powerful men follow in many industries and countries.
