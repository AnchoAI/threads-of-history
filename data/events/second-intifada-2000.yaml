id: second-intifada-2000
title: Second Intifada
summary: A Palestinian uprising and Israeli military response from September 2000 to the 2005 Sharm el-Sheikh
  summit, marked by suicide bombings and military operations. The source gives 2,739–3,168 Palestinians killed
  by Israeli troops and 644–773 Israeli civilians and 215–301 Israeli troops killed by Palestinians.
