id: yemeni-civil-war-2014
title: Yemeni civil war
summary: The war began in September 2014 when Houthi forces took over Sanaa; a Saudi-led coalition intervened
  in March 2015 on the side of the Hadi government. The UN estimated more than 377,000 direct and indirect
  deaths by 2021. The US and Saudi Arabia accuse Iran of arming the Houthis; the Houthis and Iran deny any
  military affiliation.
