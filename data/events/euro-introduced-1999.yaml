id: euro-introduced-1999
title: The euro is launched
summary: The euro was launched on 1 January 1999, first as an accounting currency for financial markets;
  euro notes and coins replaced national currencies such as the Deutsche Mark on 1 January 2002. Monetary
  policy for the euro is set by the European Central Bank.
