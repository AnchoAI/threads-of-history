id: european-theatre-of-world-war-i-1914
title: European theatre of World War I
summary: The main theatre of the First World War, where the war began and ended, fought by armies of unprecedented
  size equipped with new mechanized technologies. It is divided into the Western, Eastern, Italian and Balkans fronts.
  The conflict left tens of millions dead or wounded.
