id: washington-post-watergate-reporting-1972
title: Washington Post reporting on Watergate
summary: Shortly after the break-in, The Washington Post assigns Bob Woodward and Carl Bernstein to the story. Guided
  by an anonymous source known as "Deep Throat", their reporting helped expose a White House political espionage
  programme.
