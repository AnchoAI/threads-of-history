id: one-child-policy-1980
title: One-child policy
summary: A population-planning programme that restricted many Chinese families to a single child. A near-universal
  one-child limit was imposed in 1980 and written into the constitution in 1982, with many exceptions over
  time; it was replaced by a two-child policy on 1 January 2016.
