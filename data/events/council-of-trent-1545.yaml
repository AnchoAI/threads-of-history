title: Council of Trent
summary: The 19th ecumenical council of the Catholic Church met in 25 sessions between 13 December 1545
  and 4 December 1563. Prompted by the Protestant Reformation, it is described as the most characteristic
  embodiment of the Counter-Reformation.
