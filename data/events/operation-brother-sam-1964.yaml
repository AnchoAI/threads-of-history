id: operation-brother-sam-1964
title: Operation Brother Sam
summary: The United States readies a naval task force led by the carrier USS Forrestal, with tankers,
  to support the coup against Goulart. It was stood down before having any effect because the coup succeeded
  quickly, and came to light only with documents declassified in 1976–77.
