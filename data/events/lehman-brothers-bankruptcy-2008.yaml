id: lehman-brothers-bankruptcy-2008
title: Lehman Brothers goes bankrupt
summary: On 15 September 2008 Lehman Brothers, heavily exposed to subprime mortgages, filed the largest
  bankruptcy in US history after talks on rescuing it failed. The Dow fell 4.5 percent that day, money
  market funds faced mass withdrawals and interbank lending tightened, and the government and the Federal
  Reserve took emergency measures.
