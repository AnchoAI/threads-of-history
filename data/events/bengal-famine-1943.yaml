  notes:
  - Batch F. Summary and dates checked against the quoted sources; no person has reviewed them yet.
  - Churchill is listed as an actor because his War Cabinet rejected or reduced requests for food imports
    (same source, section 'Refusal of imports'). How far that caused deaths is part of the contested debate.
  - Death toll estimates vary widely; the source gives 800,000–3.8 million for Bengal alone. A scholarly
    source (e.g. Sen 1981, Ó Gráda 2009) should be added.
