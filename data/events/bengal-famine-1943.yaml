id: bengal-famine-1943
title: Bengal famine of 1943
summary: Famine in Bengal during the Second World War kills an estimated 800,000 to 3.8 million people.
  Historians disagree over how far crop shortfall, or wartime policy, inflation and hoarding, caused it.
