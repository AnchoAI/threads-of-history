id: truman-doctrine-1947
title: Truman Doctrine
summary: On 12 March 1947, after Britain said it would stop aiding the Greek government, Truman asked
  Congress to aid Greece and Turkey, saying US policy must be "to support free peoples who are resisting
  attempted subjugation by armed minorities or by outside pressures." Congress approved $400 million in
  May 1947. Historians often date the start of the Cold War from the speech.
