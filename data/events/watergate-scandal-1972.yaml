id: watergate-scandal-1972
title: Watergate scandal
summary: On 17 June 1972 operatives linked to Richard Nixon's re-election campaign are caught burglarising the Democratic
  National Committee headquarters at the Watergate complex. Nixon's administration tried to cover it up; facing
  impeachment, he resigned on 9 August 1974.
