id: ethiopian-famine-1983
title: 1983–1985 famine in Ethiopia
summary: A famine in Ethiopia from 1983 to 1985, under the Derg military government, affected 7.75 million people
  and left an estimated 300,000 to 1.2 million dead. Sources attribute it to drought, the civil war and the government's
  policies.
