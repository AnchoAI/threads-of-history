id: hiv-aids-epidemic-1981
title: HIV/AIDS epidemic
summary: The worldwide epidemic of HIV/AIDS, first recognised by the US CDC in 1981. The WHO estimates it has claimed
  44.2 million lives; about 41 million people were living with HIV at the end of 2025, and transmission continues
  in all countries. The disease has also been a source of discrimination against the people who have it.
