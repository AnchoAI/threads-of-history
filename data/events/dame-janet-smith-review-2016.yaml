id: dame-janet-smith-review-2016
title: Dame Janet Smith Review of the BBC and Savile
wikidata: Q23022221
summary: The review commissioned by the BBC from Dame Janet Smith finds that the BBC missed chances to
  stop abuse by Jimmy Savile and Stuart Hall because of a "culture of fear". It identifies 72 victims
  of Savile and 21 of Hall, and finds that some junior and middle-ranking staff knew of Savile's conduct
  but no evidence that the BBC as a corporate body did.
