id: gunnlaugsson-steps-down-2016
title: Iceland's prime minister steps aside over the Panama Papers
summary: On 5 April 2016, after protests over Panama Papers revelations that he and his wife had owned an offshore
  company, Wintris, which he had not disclosed, Sigmundur Davíð Gunnlaugsson announces he will step aside as prime
  minister of Iceland. Sigurður Ingi Jóhannsson replaced him on 7 April.
