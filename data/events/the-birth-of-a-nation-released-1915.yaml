id: the-birth-of-a-nation-released-1915
title: The Birth of a Nation released
summary: D. W. Griffith's silent film, adapted from Thomas Dixon Jr.'s novel The Clansman, opens in Los Angeles
  on 8 February 1915. It portrays the Ku Klux Klan as a heroic force, was popular with white audiences nationwide
  and was screened at the White House for President Woodrow Wilson.
occurred:
  start: '1915-02-08'
  precision: day
  note: Los Angeles opening; a first public showing, as The Clansman, was on 1–2 January 1915 in Riverside, California.
