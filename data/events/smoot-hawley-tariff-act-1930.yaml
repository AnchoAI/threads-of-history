id: smoot-hawley-tariff-act-1930
title: Smoot–Hawley Tariff Act
summary: US tariff law signed by President Herbert Hoover on 17 June 1930, raising tariffs on over 20,000
  imported goods as an early response to the Depression; Canada and other countries retaliated. Most historians
  and economists blame it for worsening the Depression, while monetarists such as Milton Friedman saw
  it as only a minor cause.
