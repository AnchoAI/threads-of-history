id: blockade-of-the-gaza-strip-2007
title: Blockade of the Gaza Strip
summary: After Hamas took over Gaza in 2007, Israel, with Egypt, imposed a blockade on the movement of goods
  and people. Israel cites security and isolating Hamas; human rights groups and others describe it as collective
  punishment.
