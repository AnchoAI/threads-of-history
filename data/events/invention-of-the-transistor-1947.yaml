id: invention-of-the-transistor-1947
title: Invention of the transistor
summary: John Bardeen and Walter Brattain, working with William Shockley at Bell Labs, demonstrate the
  first working transistor, which went on to replace the vacuum tube. The three shared the 1956 Nobel
  Prize in Physics.
