id: cierna-nad-tisou-talks-1968
title: Čierna nad Tisou talks
summary: 'From 29 July to 1 August 1968 almost the full Soviet Politburo met the Czechoslovak leadership at
  Čierna nad Tisou, near the Soviet border. Brezhnev decided on compromise: the Czechoslovak delegates reaffirmed
  loyalty to the Warsaw Pact and promised to curb "anti-socialist" tendencies and control the press, and the
  Soviets agreed to withdraw troops left in the country after the June manoeuvres.'
