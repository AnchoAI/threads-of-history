id: indian-independence-movement-1885
title: Indian independence movement
summary: A series of political efforts from the mid-1880s to 1947 to end British colonial rule in the Indian subcontinent.
  It grew from early reform demands into mass campaigns such as the Non-cooperation, Civil Disobedience and Quit
  India movements, and culminated in the Indian Independence Act 1947.
