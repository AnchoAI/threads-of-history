id: munich-agreement-1938
title: Munich Agreement
summary: Germany, Britain, France and Italy agreed at Munich, in the early hours of 30 September 1938,
  that Czechoslovakia would cede the Sudetenland to Germany; neither Czechoslovakia nor the Soviet Union
  took part. Hitler occupied the rest of the Czech lands in March 1939, and the agreement is now regarded
  as a failed act of appeasement.
