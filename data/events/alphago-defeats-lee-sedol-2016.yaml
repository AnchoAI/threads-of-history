title: AlphaGo defeats Lee Sedol
summary: In Seoul, DeepMind's AlphaGo program, which uses neural networks, beats the top Go player Lee
  Sedol 4–1. Before AlphaGo, some researchers had claimed computers would never beat top humans at Go.
