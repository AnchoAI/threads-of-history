id: assassination-of-franz-ferdinand-1914
title: Assassination of Archduke Franz Ferdinand
summary: On 28 June 1914 Gavrilo Princip, a Bosnian Serb, shot Archduke Franz Ferdinand, heir to the Austro-Hungarian
  throne, and his wife Sophie in Sarajevo. The assassins were helped by the Black Hand, a Serbian secret nationalist
  group.
