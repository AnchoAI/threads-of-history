id: ryan-white-care-act-1990
title: Ryan White CARE Act
summary: The US Congress passes the Ryan White Comprehensive AIDS Resources Emergency (CARE) Act, signed by President
  George H. W. Bush on 18 August 1990 and named after Ryan White. It became the largest federally funded US programme
  for people living with HIV/AIDS.
