id: plantation-of-ulster-1609
title: Plantation of Ulster
summary: From 1609 the English Crown colonised Ulster with English-speaking Protestant settlers, mostly
  from Scotland and England, on land confiscated from Gaelic chiefs. It created a lasting Ulster Protestant
  community and was also meant to spread the Protestant Reformation there.
