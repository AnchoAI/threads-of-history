id: turkish-war-of-independence-1919-1922
title: Turkish War of Independence
summary: The Turkish National Movement, governed from Ankara by the Grand National Assembly under Mustafa
  Kemal, fought Greece and other Allied powers after the Greek landing at Smyrna. Its victory ended the
  Ottoman sultanate and caliphate and led to the Republic of Turkey.
