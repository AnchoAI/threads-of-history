id: resignation-of-richard-nixon-1974
title: Richard Nixon resigns
summary: Facing impeachment over the Watergate scandal, Richard Nixon resigns on 9 August 1974, the first US president
  to do so. His successor, Gerald Ford, later pardoned him.
