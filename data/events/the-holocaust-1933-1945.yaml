id: the-holocaust-1933-1945
title: The Holocaust
summary: The systematic, state-sponsored persecution and murder of six million European Jews by the Nazi
  German regime and its allies and collaborators. The US Holocaust Memorial Museum dates it from Hitler's
  coming to power in January 1933 to Germany's defeat in May 1945; the mass murder itself was carried
  out between 1941 and 1945.
