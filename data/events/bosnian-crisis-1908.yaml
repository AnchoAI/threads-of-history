id: bosnian-crisis-1908
title: Bosnian Crisis
summary: Austria-Hungary announced the annexation of Bosnia and Herzegovina on 5 October 1908, provoking protests
  from the great powers, Serbia and Montenegro. The crisis ended in April 1909 when the Treaty of Berlin was amended.
