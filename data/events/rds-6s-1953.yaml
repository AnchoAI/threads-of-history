id: rds-6s-1953
title: Joe 4, the first Soviet test with fusion fuel
summary: On 12 August 1953 the Soviet Union tested RDS-6s ("Joe 4" to the CIA), a layered design combining
  fission and fusion fuel with a 400-kiloton yield, about 26 times less than Ivy Mike. Sources describe
  it as a boosted fission weapon or a single-stage thermonuclear design; the Soviet two-stage RDS-37 followed
  in 1955.
