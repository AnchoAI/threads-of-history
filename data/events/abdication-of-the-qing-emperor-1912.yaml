id: abdication-of-the-qing-emperor-1912
title: Abdication of the last Qing emperor
summary: Empress Dowager Longyu issues an edict on behalf of the six-year-old Xuantong Emperor (Puyi)
  transferring power to the Republic of China, ending imperial rule. Yuan Shikai, who negotiated it, is
  to become president.
