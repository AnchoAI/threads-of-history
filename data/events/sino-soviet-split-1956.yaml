id: sino-soviet-split-1956
title: Sino-Soviet split
summary: The gradual breakdown of relations between the People's Republic of China and the Soviet Union, beginning
  in 1956 after Khrushchev's denunciation of Stalin and driven by divergent readings of Marxism–Leninism. It
  turned the Cold War from a bipolar into a tripolar contest; Gorbachev normalised relations in 1989.
