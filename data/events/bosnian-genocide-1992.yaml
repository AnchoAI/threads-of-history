id: bosnian-genocide-1992
title: Bosnian genocide
summary: Genocide committed during the Bosnian War of 1992–1995, covering the Srebrenica massacre of July 1995,
  in which more than 8,000 Bosniak men and boys were killed, or more widely the crimes against humanity and ethnic
  cleansing carried out by the Army of Republika Srpska in the areas it controlled.
