id: eniac-1945
title: ENIAC, the first general-purpose electronic computer
summary: ENIAC, built in secret for the US Army to calculate artillery firing tables, is completed in
  1945; its first program studied the feasibility of a thermonuclear weapon. It was unveiled to the public
  in February 1946.
