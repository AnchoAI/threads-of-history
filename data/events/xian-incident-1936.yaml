id: xian-incident-1936
title: Xi'an Incident
summary: Generals Zhang Xueliang and Yang Hucheng seize Chiang Kai-shek in Xi'an and demand that he end
  the civil war and ally with the Communists against Japan. Chiang is released on 25 December; the crisis
  leads to the Second United Front.
