review:
  status: sourced
  notes:
  - Precision is month because the end is only given as six weeks after 13 December 1937 (the start day).
  - End date follows traditional historiography (six weeks from 13 December); the same source says atrocities
    in the Nanjing area ran from 4 December 1937 to 28 March 1938 on a wider definition.
  - Wikipedia is the only source; a scholarly source (e.g. a university or museum history) would strengthen
    the death-toll attributions.
