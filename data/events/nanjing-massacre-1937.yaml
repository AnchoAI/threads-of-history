id: nanjing-massacre-1937
title: Nanjing Massacre
summary: After capturing Nanjing, Japanese troops kill civilians and prisoners of war and commit mass
  rape. Death-toll estimates range from 40,000 to over 340,000 depending on scope; the Tokyo Tribunal
  estimated more than 200,000, newer estimates 100,000–200,000, and China officially cites 300,000. Japanese
  nationalists have denied or minimised it.
