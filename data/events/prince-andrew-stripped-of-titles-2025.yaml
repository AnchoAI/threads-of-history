title: King Charles III removes Andrew's titles
summary: King Charles III begins a formal process to remove the style, titles and honours of his brother, who is
  to be known as Andrew Mountbatten Windsor, and serves notice to surrender his Royal Lodge lease. Andrew has long
  denied any wrongdoing over his links to Epstein.
