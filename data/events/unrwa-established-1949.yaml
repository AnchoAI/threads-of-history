id: unrwa-established-1949
title: UNRWA established
summary: The UN General Assembly adopted Resolution 302 on 8 December 1949, creating UNRWA to provide relief
  to refugees of the 1948 conflict. Its mandate covers Palestinians who fled or were expelled in 1948 and later
  conflicts, and their descendants.
