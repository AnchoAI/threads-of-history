id: united-nations-founded-1945
title: United Nations founded
summary: Delegates of 50 countries draft the UN Charter at the San Francisco Conference (25 April to 26
  June 1945) and sign it on 26 June. The United Nations comes into existence on 24 October 1945, once
  the five permanent Security Council members and a majority of signatories have ratified it.
