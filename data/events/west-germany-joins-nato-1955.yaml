id: west-germany-joins-nato-1955
title: West Germany joins NATO
summary: West Germany joined NATO on 9 May 1955, promising to rearm, after the French parliament had rejected
  the European Defence Community in August 1954; its new army, the Bundeswehr, was founded the same year.
  Norway's foreign minister called it "a decisive turning point in the history of our continent".
