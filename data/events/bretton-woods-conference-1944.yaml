id: bretton-woods-conference-1944
title: Bretton Woods Conference
summary: Delegates from 44 Allied nations meet at Bretton Woods, New Hampshire, from 1 to 22 July 1944
  and create the International Monetary Fund and the World Bank. The fixed exchange-rate system centred
  on the US dollar and gold lasts until the early 1970s.
