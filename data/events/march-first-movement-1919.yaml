id: march-first-movement-1919
title: March First Movement
summary: Protests against Japanese rule begin in Seoul with readings of a Korean Declaration of Independence
  and spread across Korea. Japanese officials reported 553 killed by 11 April; a 1920 Korean estimate
  claimed 7,509 deaths.
