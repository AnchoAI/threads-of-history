id: burundian-civil-war-1993
title: Burundian Civil War
summary: A civil war in Burundi from 1993 to 2005, rooted in long-standing divisions between Hutu and Tutsi. It
  began after the country's first multi-party elections since independence and ended with the swearing-in of President
  Pierre Nkurunziza in August 2005. About 300,000 people died.
