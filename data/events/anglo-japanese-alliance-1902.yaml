id: anglo-japanese-alliance-1902
title: Anglo-Japanese Alliance
summary: Britain and Japan sign an alliance in London. It is renewed in 1905 and 1911 and ends with the
  Four-Power Treaty of 1921, terminating on its ratification in 1923.
