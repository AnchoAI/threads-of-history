id: polish-round-table-and-elections-1989
title: Polish Round Table and the June 1989 election
summary: Round Table talks between Poland's communist government and Solidarity begin on 6 February 1989
  and end on 4 April with an agreement legalising Solidarity and setting partly free elections. On 4 June
  Solidarity wins every Sejm seat it may contest and 99 of 100 Senate seats, and on 24 August Tadeusz
  Mazowiecki becomes the first non-communist prime minister since the early postwar years.
