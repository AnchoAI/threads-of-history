id: twenty-one-demands-1915
title: Twenty-One Demands
summary: During the First World War, Japan presents China's President Yuan Shikai with demands for wider
  control in China, first trying to keep the most far-reaching group secret. China accepts a reduced set
  after a Japanese ultimatum, and agreements are concluded on 25 May 1915.
