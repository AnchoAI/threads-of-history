id: guatemalan-coup-1954
title: Guatemalan coup d'état
summary: Guatemala's elected president Jacobo Árbenz, whose land reform had hit the United Fruit Company,
  resigns after an invasion by a CIA-armed and trained force under Carlos Castillo Armas, ending the Guatemalan
  Revolution. The coup was precipitated by the CIA's Operation PBSuccess, authorised by Eisenhower.
