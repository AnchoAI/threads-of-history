id: haber-bosch-process-1909
title: Haber–Bosch process developed
summary: Fritz Haber demonstrates the synthesis of ammonia from the air in 1909; BASF's Carl Bosch scales it up,
  and industrial production begins at Oppau in 1913. Synthetic nitrogen fertilizer made this way is estimated to
  support about half the world's population today.
