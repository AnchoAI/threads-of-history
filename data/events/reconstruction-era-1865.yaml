id: reconstruction-era-1865
title: Reconstruction era
summary: After the Civil War, the US reintegrates the former Confederate states and adds three constitutional amendments
  to give freed slaves citizenship and equal rights. It ends with the Compromise of 1877 and the withdrawal of federal
  troops from the South.
