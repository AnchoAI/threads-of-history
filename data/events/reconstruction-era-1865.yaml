  archive_url: https://web.archive.org/web/20261012060010/https://en.wikipedia.org/wiki/Reconstruction_era
  title: Reconstruction era
  publisher: Wikipedia
  quote: was a period in United States history that followed the American Civil War (1861–1865) and was dominated
    by the legal, social, and political challenges of the abolition of slavery and federal control over, and reintegration
    of, the former Confederate States into the United States. Three amendments were added to the United States Constitution
    to grant citizenship and equal civil rights to the newly freed slaves.
