id: jupiter-missiles-removed-from-turkey-and-italy-1963
title: US Jupiter missiles removed from Turkey and Italy
summary: Under Operation Pot Pie the United States removed its Jupiter missiles from Italy and Turkey
  between 1 and 24 April 1963, as Robert Kennedy had privately indicated to Dobrynin during the missile
  crisis.
