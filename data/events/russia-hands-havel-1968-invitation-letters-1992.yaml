id: russia-hands-havel-1968-invitation-letters-1992
title: Russia hands Havel the 1968 invitation letters
summary: On 16 July 1992 an envoy of Russian President Boris Yeltsin gave Czechoslovak President Václav Havel
  verified copies of seven documents from the Soviet Politburo archive, including two undated 1968 letters
  asking for Soviet intervention. A Czechoslovak forensic team that examined the originals in Moscow reported
  on 4 November 1992 that the signatures were genuine, though it could not prove the letters dated from 1968.
