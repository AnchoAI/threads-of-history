id: international-space-station-1998
title: 'International Space Station: first module launched'
summary: The first module of the International Space Station is launched. The station merged the US Space
  Station Freedom and the Soviet-planned Mir-2, combined after the Soviet collapse; it has been continuously
  inhabited since November 2000.
