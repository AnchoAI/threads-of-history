id: safavid-conversion-of-iran-1501
title: Safavids make Iran Shia
summary: From 1501 the Safavid shah Ismail I made Twelver Shia Islam the state religion and imposed forced conversion
  on Iran's largely Sunni population. As a result, Shia Islam remains dominant in Iran today.
occurred:
  start: '1501'
  precision: year
  note: The conversion campaign continued for much of the Safavid period; 1501 is Ismail I's proclamation.
