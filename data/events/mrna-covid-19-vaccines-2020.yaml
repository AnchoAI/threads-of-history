id: mrna-covid-19-vaccines-2020
title: First mRNA vaccines approved (COVID-19)
summary: Two mRNA vaccines against COVID-19, developed at record speed after the pandemic began, are approved
  in December 2020; the UK was the first country to authorise the Pfizer–BioNTech vaccine. They rested
  on Katalin Karikó and Drew Weissman's work on modified mRNA, which won the 2023 Nobel Prize.
