id: us-declaration-of-war-on-japan-1941
title: US declares war on Japan
summary: On 8 December 1941, the day after Pearl Harbor, President Roosevelt gives his 'Day of Infamy'
  speech to Congress, which declares war on Japan; the United States enters the Second World War. Germany
  and Italy declare war on the US on 11 December.
