id: rugby-world-cup-final-1995
title: 1995 Rugby World Cup final
summary: On 24 June 1995 South Africa beat New Zealand in Johannesburg in the first Rugby World Cup it was allowed
  to enter; President Nelson Mandela, wearing a Springbok shirt, presented the trophy. The moment was widely seen
  as a step in reconciliation between white and black South Africans.
