id: castle-bravo-1954
title: Castle Bravo test and fallout
summary: On 1 March 1954 the US Castle Bravo test at Bikini Atoll yielded 15 megatons, 2.5 times the predicted
  6, and its fallout fell on the inhabited Rongelap and Utirik atolls and on the crew of the Japanese
  fishing boat Lucky Dragon No. 5. The blast incited a strong international reaction against atmospheric
  thermonuclear testing.
