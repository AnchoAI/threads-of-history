id: moscow-conference-acknowledges-jupiter-deal-1989
title: Jupiter deal acknowledged at Moscow conference
summary: At a conference in Moscow in January 1989, Anatoly Dobrynin (Soviet ambassador in 1962) and Kennedy's
  speechwriter Theodore Sorensen officially acknowledged the secret 1962 understanding that US missiles
  would be withdrawn from Turkey and Italy, which had been known to only nine US officials at the time.
