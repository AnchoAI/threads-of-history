id: first-chechen-war-1994
title: First Chechen War
summary: Russian forces enter Chechnya on 11 December 1994 against the secessionist government of Dzhokhar
  Dudayev, which had taken control during the dissolution of the Soviet Union. Thousands of civilians
  are killed; the war ends with the Khasavyurt Accord of 31 August 1996, which provides for the withdrawal
  of all federal forces.
