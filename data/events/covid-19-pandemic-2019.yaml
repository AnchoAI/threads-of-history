id: covid-19-pandemic-2019
title: COVID-19 pandemic
summary: A pandemic caused by the SARS-CoV-2 coronavirus begins with an outbreak in Wuhan, China, in December 2019.
  WHO declares it a pandemic on 11 March 2020 and ends the public health emergency in May 2023; estimated deaths
  range from 18.5 to 35.2 million.
