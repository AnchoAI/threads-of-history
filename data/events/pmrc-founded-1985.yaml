id: pmrc-founded-1985
title: Parents Music Resource Center founded
summary: Tipper Gore, Susan Baker, Pam Howar and Sally Nevius, the "Washington Wives", found the Parents Music
  Resource Center in May 1985 to press for warning labels on music with violent, drug-related or sexual themes.
  Gore said she acted after hearing her 11-year-old daughter play Prince's "Darling Nikki".
