id: gulf-of-tonkin-resolution-1964
title: Gulf of Tonkin Resolution
summary: On 7 August 1964, after the reported attacks, Congress passed a resolution authorising President Johnson
  to take any measures he believed necessary in South-East Asia. It became the legal basis for the Johnson
  and Nixon administrations' prosecution of the Vietnam War.
