id: jenners-smallpox-vaccination-1796
title: Jenner's first smallpox vaccination
summary: Edward Jenner inoculates eight-year-old James Phipps with pus from cowpox blisters, then shows that exposure
  to smallpox material does not make him ill. It was the first vaccine, the start of the process that ended with
  smallpox's eradication.
