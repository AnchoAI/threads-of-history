id: second-saudi-state-1824
title: Second Saudi state (Emirate of Nejd)
summary: Turki bin Abdullah, a grandson of Muhammad bin Saud, retook Riyadh in 1824 and restored Saudi rule in Najd.
  The state lasted until its defeat at the Battle of Mulayda in 1891.
