id: marco-polo-bridge-incident-1937
title: Marco Polo Bridge Incident
summary: Chinese and Japanese troops clash near the Marco Polo (Lugou) Bridge outside Beijing after Japan
  demands to search Wanping for a soldier who had in fact returned. The exact cause remains unknown; the
  clash is generally regarded as the start of the Second Sino-Japanese War.
