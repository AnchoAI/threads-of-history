id: operation-anadyr-1962
title: 'Operation Anadyr: Soviet missiles sent secretly to Cuba'
summary: The Soviet Union's secret 1962 operation to deploy ballistic missiles, medium-range bombers and
  a mechanized infantry division to Cuba, after a July 1962 agreement between Khrushchev and Castro. Khrushchev
  gave final approval to the deployment plan in early July. Its discovery by the United States set off
  the Cuban Missile Crisis.
