id: south-africa-excluded-from-the-olympics-1964
title: South Africa excluded from the Olympic Games
summary: As part of the sporting boycott of apartheid South Africa, the country did not compete at the Olympic Games
  from 1964 to 1988; the IOC expelled its national Olympic committee in 1970.
