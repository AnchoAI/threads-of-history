id: hezbollah-founded-1982
title: Hezbollah founded
summary: Lebanese Shia clerics founded Hezbollah in 1982 in close cooperation with Iran, primarily to fight
  the Israeli invasion of Lebanon. Its formation was shaped by the Iranian Revolution and Khomeini's model
  of Islamic government, and it was formally announced in 1985.
