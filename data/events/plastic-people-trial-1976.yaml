id: plastic-people-trial-1976
title: Trial of the Plastic People of the Universe
summary: Czechoslovak authorities arrest members of the rock band the Plastic People of the Universe and others
  from the underground scene and put them on trial; they are convicted of "organized disturbance of the peace"
  and sentenced to eight to eighteen months in prison.
