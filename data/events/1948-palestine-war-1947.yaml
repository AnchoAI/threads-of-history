id: 1948-palestine-war-1947
title: 1948 Palestine war
summary: A war fought from 30 November 1947 to 10 March 1949 in what had been British-ruled Mandatory Palestine,
  known in Palestine as the Nakba and in Israel as the War of Independence. It began as a civil war between Arab
  and Jewish communities after the UN Partition Plan and became an international war once Israel declared independence
  and neighbouring Arab states sent in their armies.
