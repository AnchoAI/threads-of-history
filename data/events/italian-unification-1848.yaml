id: italian-unification-1848
title: Unification of Italy (Risorgimento)
summary: The movement that joined the states of the Italian peninsula to the Kingdom of Sardinia, creating
  the Kingdom of Italy in 1861; it was completed in 1871 when Rome became the capital.
