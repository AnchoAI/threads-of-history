id: u-2-incident-1960
title: U-2 incident
summary: On 1 May 1960 a CIA U-2 spy plane flown by Francis Gary Powers was shot down over Sverdlovsk.
  The US first claimed a NASA weather aircraft had gone missing, but had to admit the spying mission after
  Khrushchev revealed on 7 May that Powers was alive and captured; the Paris summit two weeks later collapsed.
  Powers was exchanged for Soviet intelligence officer Rudolf Abel in February 1962.
