id: haitian-revolution-1791
title: Haitian Revolution
summary: Enslaved Africans in the French colony of Saint-Domingue revolt in August 1791; the revolution ends with
  independence on 1 January 1804, making Haiti the only nation whose independence was gained through a successful
  slave rebellion.
