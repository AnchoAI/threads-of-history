id: ryan-report-2009
title: Ryan Report on abuse in Irish residential institutions
wikidata: Q1129619
summary: Ireland's Commission to Inquire into Child Abuse, chaired by Justice Sean Ryan, publishes its
  report on reformatory and industrial schools run by Catholic orders. It found that some religious officials
  shielded their orders amid a "culture of self-serving secrecy" and that government inspectors failed
  to stop the abuses.
