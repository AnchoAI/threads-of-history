id: berlin-crisis-1961
title: Berlin Crisis of 1961
summary: From June to November 1961 Khrushchev renewed his demands on Berlin, pressing the newly inaugurated
  President Kennedy at the Vienna summit. When talks failed, East Germany closed the border and built
  a wall around West Berlin in August, and in October American and Soviet tanks faced each other at Checkpoint
  Charlie until both sides agreed to withdraw them.
