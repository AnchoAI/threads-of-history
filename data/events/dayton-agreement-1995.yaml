id: dayton-agreement-1995
title: Dayton Agreement
summary: Negotiated at Wright-Patterson Air Force Base in Dayton, Ohio, with Serbian president Slobodan
  Milošević among the main participants, the agreement ending the Bosnian War is initialled on 21 November
  1995 and signed in Paris on 14 December 1995.
