id: egypt-israel-peace-treaty-1979
title: Egypt–Israel peace treaty
summary: Signed in Washington on 26 March 1979, the treaty ended the state of war, provided for mutual recognition
  and Israel's withdrawal from Sinai, and made Egypt the first Arab state to recognise Israel. Egypt was suspended
  from the Arab League from 1979 to 1989.
