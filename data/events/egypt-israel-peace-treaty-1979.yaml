  title: Egypt–Israel peace treaty
  publisher: Wikipedia
  quote: The main features of the treaty were mutual recognition, cessation of the state of war that had existed
    since the 1948 Arab–Israeli War, normalization of relations and the withdrawal by Israel of its armed forces
    and civilians from the Sinai Peninsula, which Israel had captured during the Six-Day War in 1967.
  type: reference
