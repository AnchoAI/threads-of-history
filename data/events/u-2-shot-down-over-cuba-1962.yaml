id: u-2-shot-down-over-cuba-1962
title: U-2 shot down over Cuba
summary: On 27 October 1962 a US U-2 flown by Major Rudolf Anderson was shot down over Banes, Cuba, by
  a Soviet SA-2 missile, and Anderson was killed. According to Wikipedia's account, two Soviet generals
  in Havana ordered the launch after failing to reach their commander.
