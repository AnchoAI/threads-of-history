id: eastern-front-1941
title: Eastern Front (World War II)
summary: The theatre of the Second World War fought between the European Axis powers and the Allies, including the
  Soviet Union and Poland, from 22 June 1941 to 9 May 1945. About 30 million of the war's estimated 70–85 million
  deaths occurred there.
