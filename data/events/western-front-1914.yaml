id: western-front-1914
title: Western Front (World War I)
summary: One of the main theatres of the First World War. Germany opened it in August 1914 by invading Luxembourg
  and Belgium; after its advance was halted at the Marne, both sides dug in along a line of trenches from the North
  Sea to the Swiss border that changed little until 1917 and 1918.
