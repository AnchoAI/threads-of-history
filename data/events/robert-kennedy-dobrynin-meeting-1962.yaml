id: robert-kennedy-dobrynin-meeting-1962
title: Robert Kennedy meets Dobrynin; secret Jupiter assurance
summary: On the evening of 27 October 1962 Robert Kennedy told Soviet Ambassador Anatoly Dobrynin that
  the missile bases had to be removed at once. The Office of the Historian says he indicated the US would
  soon remove its Jupiter missiles from Turkey but not as part of any public deal; his own memorandum
  says "no quid pro quo", with a crossed-out sentence mentioning "four or five months". The arrangement
  was first officially acknowledged in January 1989.
