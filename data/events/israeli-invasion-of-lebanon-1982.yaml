id: israeli-invasion-of-lebanon-1982
title: 1982 Lebanon War
summary: Israel invaded southern Lebanon on 6 June 1982 after an attempt on its ambassador in London by the
  Abu Nidal Organization, reached Beirut and forced the PLO out to Tunis. The Phalangist massacre at Sabra
  and Shatila, in an area under Israeli control, caused outrage.
