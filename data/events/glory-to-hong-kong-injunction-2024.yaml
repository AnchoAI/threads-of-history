id: glory-to-hong-kong-injunction-2024
title: Hong Kong court bans "Glory to Hong Kong"
summary: On 8 May 2024 Hong Kong's Court of Appeal grants the government an injunction banning criminal acts
  involving "Glory to Hong Kong", which the government had sought since June 2023 citing the national security
  law; YouTube then blocks 32 videos of the song in Hong Kong.
