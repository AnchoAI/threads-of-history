id: remilitarisation-of-the-rhineland-1936
title: Remilitarisation of the Rhineland
summary: On 7 March 1936 German troops entered the demilitarised Rhineland, contravening the Treaty of
  Versailles and the Locarno Treaties. France and Britain, unwilling to risk war, did not enforce the
  treaties.
