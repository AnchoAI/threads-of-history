id: cold-war-1985
title: Cold War (1985–1991)
summary: The final years of the Cold War, from Mikhail Gorbachev's rise to lead the Soviet Communist Party in 1985
  to the dissolution of the Soviet Union in 1991, marked by reform inside the Soviet Union, easing tensions between
  the blocs and the collapse of Soviet influence in Eastern Europe.
