id: kronstadt-rebellion-1921
title: Kronstadt rebellion
summary: Sailors at the Kronstadt naval fortress rose against the Soviet government they had helped install,
  demanding free elections to the soviets and free speech. The Bolsheviks suppressed the revolt on 18
  March.
