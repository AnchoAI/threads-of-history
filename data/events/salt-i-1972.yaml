id: salt-i-1972
title: SALT I and the ABM Treaty signed
summary: Nixon and Brezhnev sign the Anti-Ballistic Missile Treaty and the SALT I Interim Agreement in
  Moscow on 26 May 1972, after talks that began in Helsinki in November 1969. SALT I froze the number
  of strategic ballistic missile launchers at existing levels.
