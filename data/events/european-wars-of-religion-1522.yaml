title: European wars of religion
summary: Wars fought in Europe in the 16th, 17th and early 18th centuries after the Protestant Reformation began
  in 1517. Revolt, territorial ambitions and great-power rivalry also drove them. They were largely ended by the
  Peace of Westphalia in 1648.
