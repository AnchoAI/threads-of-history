id: crispr-cas9-genome-editing-2012
title: CRISPR/Cas9 genome editing discovered
summary: Emmanuelle Charpentier and Jennifer Doudna show that the bacterial CRISPR/Cas9 system can be
  reprogrammed to cut any DNA at a chosen site, making precise gene editing fast and cheap. They won the
  2020 Nobel Prize in Chemistry.
