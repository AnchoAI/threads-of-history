id: kosovo-war-1998
title: Kosovo War
summary: War in Kosovo from 28 February 1998 to 11 June 1999 between Yugoslav forces and the Kosovo Liberation
  Army. NATO began bombing on 24 March 1999 on humanitarian grounds without UN Security Council approval,
  and Yugoslav forces agreed to withdraw under the Kumanovo Agreement of 9 June 1999.
