id: second-world-war-1939-1945
title: Second World War
summary: A global conflict between the Allies and the Axis powers, generally dated from Germany's invasion
  of Poland on 1 September 1939 to Japan's formal surrender on 2 September 1945. It was the deadliest
  conflict in history, with 60 to 75 million deaths, most of them civilians.
