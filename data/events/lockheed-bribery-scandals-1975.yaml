id: lockheed-bribery-scandals-1975
title: Lockheed bribery scandals
summary: In 1975–76 a US Senate subcommittee led by Frank Church concluded that Lockheed had paid officials of friendly
  governments to win aircraft contracts; it was revealed in 1976 that Lockheed had paid $22 million in bribes to
  foreign officials. Its chairman and president resigned in February 1976, and the scandal caused political controversy
  in West Germany, Italy, the Netherlands and Japan.
