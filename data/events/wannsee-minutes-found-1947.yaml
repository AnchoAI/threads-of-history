id: wannsee-minutes-found-1947
title: Wannsee Conference minutes found
summary: In March 1947 Robert Kempner, a US prosecutor at Nuremberg, finds the only surviving copy of
  the Wannsee Conference minutes (copy 16 of 30) among seized German Foreign Office files. They are used
  as evidence at the subsequent Nuremberg trials.
