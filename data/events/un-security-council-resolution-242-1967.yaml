id: un-security-council-resolution-242-1967
title: UN Security Council Resolution 242
summary: Adopted unanimously on 22 November 1967 after the Six-Day War, it called for Israel's withdrawal from
  territories occupied in the conflict in exchange for peace and recognised boundaries ('land for peace').
  Israelis and Arabs interpreted it differently, notably whether it meant all of the territories, but it became
  the basis for later negotiations.
