id: wahhabi-sack-of-karbala-1802
title: Wahhabi sack of Karbala
summary: About 12,000 Wahhabi fighters of the first Saudi state attacked the Shia holy city of Karbala in Ottoman
  Iraq, killing between 2,000 and 5,000 people and plundering the shrine of Husayn. Some historians date the attack
  to 1801.
