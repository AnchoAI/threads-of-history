id: u-2-finds-sam-sites-in-cuba-1962
title: U-2 finds Soviet surface-to-air missile sites in Cuba
summary: A U-2 reconnaissance flight over Cuba on 29 August 1962 showed surface-to-air missile sites under
  construction. The CIA told the White House on 31 August, and President Kennedy mentioned the anti-aircraft
  missiles publicly on 4 September.
