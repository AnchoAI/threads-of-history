id: moscow-third-rome-1523
title: Moscow proclaimed the "Third Rome"
summary: The idea that Moscow is the successor to Rome and Constantinople as the centre of Orthodox Christianity
  emerged after 1453 and was given its classic form in the epistles of the monk Philotheus of Pskov (c.
  1523–1524). In the 21st century the concept was revived in Russian state and church discourse alongside
  the "Russian world".
