id: aftermath-of-the-iranian-revolution-1979
title: Aftermath of the Iranian Revolution
summary: The period after the Shah's overthrow in February 1979, when Iran was in a "revolutionary crisis mode"
  until 1982 or 1983, as forces loyal to Ayatollah Khomeini consolidated power. The economy and the government apparatus
  collapsed, and rebellions broke out in Khuzistan, Kurdistan and Gonbad-e Qabus.
