id: ireland-closes-embassy-to-the-holy-see-2011
title: Ireland closes its embassy to the Holy See
wikidata: none
summary: Irish foreign minister Eamon Gilmore announces that Ireland will close its embassy to the Holy
  See, along with its embassy in Tehran and an office in East Timor, with the ambassador to reside in
  Ireland. The government cited costs; others linked the move to the dispute over the Vatican's handling
  of abuse cases.
