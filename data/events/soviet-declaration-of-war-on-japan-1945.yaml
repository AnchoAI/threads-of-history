id: soviet-declaration-of-war-on-japan-1945
title: Soviet Union declares war on Japan
summary: Late on 8 August 1945, in line with the Yalta agreements but in breach of the Soviet–Japanese
  Neutrality Pact, the Soviet Union declares war on Japan and invades Manchuria soon after midnight. The
  campaign lasts until 2 September.
