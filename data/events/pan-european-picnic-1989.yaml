id: pan-european-picnic-1989
title: Pan-European Picnic
summary: At a demonstration near Sopron on 19 August 1989, a gate in the Iron Curtain between Hungary
  and Austria is opened, allowing the largest escape movement from East Germany since the Berlin Wall
  was built in 1961. Tens of thousands more East Germans then set off for Hungary.
