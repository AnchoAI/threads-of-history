id: founding-of-west-germany-1949
title: Federal Republic of Germany founded
summary: The Basic Law, adopted in Bonn on 8 May 1949 and approved by the Western Allies on 12 May, came
  into effect on 23 May 1949, founding the Federal Republic of Germany (West Germany) from twelve states
  in the American, British and French zones. Its first Chancellor, Konrad Adenauer, worked for alignment
  with NATO rather than neutrality.
