id: freddie-mercury-tribute-concert-1992
title: Freddie Mercury Tribute Concert for AIDS Awareness
summary: A benefit concert by Queen and other artists at Wembley Stadium, London, on 20 April 1992 in tribute to
  Freddie Mercury. Broadcast live worldwide to an estimated one billion viewers, it raised £20 million, used to
  launch the Mercury Phoenix Trust.
