id: surrender-of-japan-1945
title: Surrender of Japan
summary: Emperor Hirohito announces Japan's surrender in a radio broadcast on 15 August 1945, and the
  surrender is formally signed aboard USS Missouri on 2 September, ending the Second World War. The role
  of the atomic bombings in the decision is debated.
