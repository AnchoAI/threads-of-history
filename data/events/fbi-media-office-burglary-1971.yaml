id: fbi-media-office-burglary-1971
title: Burglary of the FBI office in Media, Pennsylvania
summary: On 8 March 1971 an activist group calling itself the Citizens' Commission to Investigate the FBI broke
  into the FBI field office in Media, Pennsylvania, took over 1,000 classified documents and mailed some to newspapers.
  The documents revealed the FBI's secret COINTELPRO operation.
