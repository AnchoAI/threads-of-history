id: warsaw-pact-1955
title: Warsaw Pact founded
summary: On 14 May 1955 the Soviet Union and seven Eastern Bloc states signed the Warsaw Pact, a collective
  defence treaty, in Warsaw. Dominated by the Soviet Union, it was set up as a counterweight to NATO after
  West Germany was rearmed inside NATO, and lasted until 1991.
