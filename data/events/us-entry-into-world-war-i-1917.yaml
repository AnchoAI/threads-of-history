id: us-entry-into-world-war-i-1917
title: United States enters the First World War
summary: After President Wilson asked Congress for a declaration of war on 2 April 1917, the United States declared
  war on Germany on 6 April 1917. Wilson cited Germany's unrestricted submarine warfare and its attempt to ally
  with Mexico.
