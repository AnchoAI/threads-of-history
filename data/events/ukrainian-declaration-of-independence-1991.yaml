id: ukrainian-declaration-of-independence-1991
title: Ukraine declares independence
summary: Ukraine's parliament adopts the Act of Declaration of Independence on 24 August 1991, in the
  aftermath of the failed Moscow coup. In a referendum on 1 December more than 90% vote in favour, which
  ended any realistic chance of keeping the Soviet Union together.
