id: smallpox-eradicated-1980
title: Smallpox declared eradicated
summary: The World Health Organization certifies the global eradication of smallpox, after an intensified campaign
  begun in 1967; the last naturally occurring case was in Somalia in 1977. It is the only human disease to have
  been eradicated.
occurred:
  start: '1980-05'
  precision: month
  note: An independent Global Commission certified eradication in December 1979; WHO declared it in May 1980.
