id: potsdam-conference-1945
title: Potsdam Conference
summary: Stalin, Churchill (replaced by Attlee on 26 July) and Truman meet at Potsdam from 17 July to
  2 August 1945. They agree on a disarmed Germany under four occupation zones, and Truman tells Stalin
  on 24 July that the US has tested an atomic bomb.
