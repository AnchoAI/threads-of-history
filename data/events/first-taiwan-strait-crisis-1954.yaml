- url: https://en.wikipedia.org/wiki/First_Taiwan_Strait_Crisis
  title: First Taiwan Strait Crisis
  publisher: Wikipedia
  quote: The First Taiwan Strait Crisis (also known as the Formosa Crisis, the 1954–1955 Taiwan Strait Crisis,
    the Offshore Islands Crisis, the Quemoy-Matsu Crisis, and the 1955 Taiwan Strait Crisis) was a brief armed
    conflict between the People's Republic of China (PRC) and the Republic of China (ROC) focused on several
    ROC-held islands a few miles from the Chinese mainland in the Taiwan Strait.
  type: reference
  accessed: '2026-10-15'
- url: https://en.wikipedia.org/wiki/First_Taiwan_Strait_Crisis
  title: First Taiwan Strait Crisis
  publisher: Wikipedia
  quote: The crisis began when the PRC initiated heavy bombardment of Kinmen (Quemoy) island in September 1954.
    Shelling was subsequently extended to the Matsu and Tachen (Dachen) islands. In response, the United States
    and the ROC agreed to the Sino-American Mutual Defense Treaty in December 1954.
  type: reference
  accessed: '2026-10-15'
- url: https://en.wikipedia.org/wiki/First_Taiwan_Strait_Crisis
  title: First Taiwan Strait Crisis
  publisher: Wikipedia
  quote: in May 1955 the People's Liberation Army ceased shelling Kinmen and Matsu.
  type: reference
  accessed: '2026-10-15'
- url: https://en.wikipedia.org/wiki/Cross-Strait_relations
  archive_url: https://web.archive.org/web/20261009122724/https://en.wikipedia.org/wiki/Cross-strait_relations
  title: Cross-Strait relations
  publisher: Wikipedia
  quote: On 3 September 1954, the First Taiwan Strait Crisis began when the PLA started shelling Kinmen and
    threatened to take the Dachen Islands.
  type: reference
