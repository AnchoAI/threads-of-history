id: first-taiwan-strait-crisis-1954
title: First Taiwan Strait Crisis
summary: A brief armed conflict between the People's Republic of China and the Republic of China over ROC-held
  islands near the mainland, begun by PRC shelling of Kinmen in September 1954. The US and the ROC signed a
  Mutual Defense Treaty in December 1954, and the shelling stopped in May 1955.
