id: chernobyl-disaster-1986
title: Chernobyl disaster
summary: Reactor 4 of the Chernobyl Nuclear Power Plant in the Ukrainian SSR explodes on 26 April 1986
  during a safety test, and the fire spreads radioactive material across the Soviet Union and Europe.
  When Sweden detected the radiation on 28 April, Soviet authorities at first denied an accident, then
  announced it on the evening television news.
