id: doj-opr-report-on-epstein-plea-deal-2020
title: Justice Department finds "poor judgment" in Epstein plea deal
summary: The Justice Department's Office of Professional Responsibility finds that Alexander Acosta and other prosecutors
  used "poor judgment" in the Epstein non-prosecution agreement but committed no professional misconduct, finds
  no evidence that the decision was based on corruption or on Epstein's wealth or associations, and says victims
  were left "feeling confused and ill-treated by the government."
