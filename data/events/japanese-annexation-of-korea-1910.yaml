id: japanese-annexation-of-korea-1910
title: Japan annexes Korea
summary: Japan formally annexes the Korean Empire by a treaty signed on 22 August 1910 and proclaimed
  on 29 August. South Korea holds that the treaty was void from the start, which Japan has contested.
