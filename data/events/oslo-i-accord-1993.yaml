id: oslo-i-accord-1993
title: Oslo I Accord
summary: Negotiated secretly in Oslo and signed in Washington on 13 September 1993, the Declaration of Principles
  set up a Palestinian interim self-government for five years, with Jerusalem, refugees, settlements and borders
  left to permanent-status talks. In accompanying letters the PLO recognised Israel and renounced violence,
  and Israel recognised the PLO.
