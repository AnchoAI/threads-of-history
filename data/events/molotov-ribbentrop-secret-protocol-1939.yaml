id: molotov-ribbentrop-secret-protocol-1939
title: Secret protocol of the Molotov–Ribbentrop Pact
summary: A secret additional protocol signed with the pact divided Eastern Europe into German and Soviet
  spheres of influence, including a line through Poland along the Narew, Vistula and San rivers. Its text
  became public after the war, but the Soviet Union officially denied that it existed until 1989.
