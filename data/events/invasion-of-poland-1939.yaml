id: invasion-of-poland-1939
title: Invasion of Poland
summary: Germany invades Poland on 1 September 1939, and the Soviet Union invades from the east on 17
  September. By 6 October the two powers control the whole country and divide it under a secret protocol
  of their non-aggression pact.
