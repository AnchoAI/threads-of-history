  title: Invasion of Poland
  publisher: Wikipedia
  quote: The invasion of Poland, also known as the September Campaign, Polish Campaign, and Polish Defensive
    War of 1939 (1 September – 6 October 1939), was a joint attack on the Republic of Poland by Nazi Germany,
    the Slovak Republic, and the Soviet Union, which marked the beginning of World War II.
