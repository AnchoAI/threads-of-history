id: doj-inspector-general-report-on-epstein-custody-2023
title: Inspector General reports on jail's handling of Jeffrey Epstein
summary: The Justice Department's Inspector General, Michael Horowitz, reports numerous and serious failures by
  Metropolitan Correctional Center staff that left Epstein unmonitored and alone in his cell before his death, including
  falsified count slips and round sheets, and finds no evidence contradicting the FBI's determination that no crime
  was involved.
