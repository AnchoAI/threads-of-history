id: estonian-night-song-festivals-1988
title: Night song festivals in Tallinn
summary: On 10–11 June 1988, after the official part of the Old Town Festival, crowds move to the Tallinn Song
  Festival Grounds and spontaneously sing patriotic songs; an activist, Heinz Valk, names the movement the
  "Singing Revolution" a week later.
