id: good-friday-agreement-1998
title: Good Friday Agreement
summary: A pair of agreements signed on 10 April 1998 that ended most of the violence of the Troubles
  and set up power-sharing government in Northern Ireland. Voters across Ireland approved it in two referendums
  on 22 May 1998.
