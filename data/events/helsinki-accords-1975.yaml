id: helsinki-accords-1975
title: Helsinki Final Act
summary: Thirty-five states, including the United States, Canada and every European country except Andorra
  and Albania, sign the Helsinki Final Act at the close of a conference held from 30 July to 1 August
  1975. Its clauses on the inviolability of frontiers were seen as a diplomatic gain for the Soviet Union,
  while its human-rights provisions became the basis for monitoring groups such as Helsinki Watch.
