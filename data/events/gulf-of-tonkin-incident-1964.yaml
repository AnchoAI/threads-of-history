id: gulf-of-tonkin-incident-1964
title: Gulf of Tonkin incident
summary: On 2 August 1964 the US destroyer Maddox, on a signals-intelligence patrol off North Vietnam, clashed
  with three North Vietnamese torpedo boats. On 4 August two US destroyers reported a second attack, which
  later evidence showed never happened; the reports led to the Gulf of Tonkin Resolution and deeper US involvement
  in the war.
