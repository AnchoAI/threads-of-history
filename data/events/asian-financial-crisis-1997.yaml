id: asian-financial-crisis-1997
title: Asian financial crisis
summary: Beginning in Thailand on 2 July 1997, when the government was forced to float the baht, a financial
  crisis spread across East and South-East Asia, hitting South Korea, Indonesia and Thailand hardest;
  the IMF led a $40 billion programme to stabilise their currencies. Its causes are disputed; the IMF
  pointed to macroeconomic imbalances and weak financial and corporate systems.
