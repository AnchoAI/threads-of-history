id: assassination-of-patrice-lumumba-1961
title: Assassination of Patrice Lumumba
summary: Patrice Lumumba, the Congo's first prime minister, deposed and detained by Mobutu's forces, is
  handed to Katanga and shot by a Katangan firing squad led by Belgian contract officers. Katanga announced
  his death on 13 February, claiming he had escaped and been killed by villagers. Belgium and the United
  States had earlier sought his removal; Eisenhower authorised a CIA plan to poison him that was dropped.
