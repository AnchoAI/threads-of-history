id: xinhai-revolution-1911
title: 1911 Revolution
summary: A revolution, sparked by the Wuchang Uprising, ends China's last imperial dynasty. The Republic
  of China is declared on 1 January 1912 with Sun Yat-sen as president, and the emperor abdicates on 12
  February 1912.
