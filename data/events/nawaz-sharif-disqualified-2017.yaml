id: nawaz-sharif-disqualified-2017
title: Pakistan's Supreme Court disqualifies Nawaz Sharif
summary: On 28 July 2017 the Supreme Court of Pakistan unanimously disqualifies Prime Minister Nawaz Sharif, finding
  that he had been dishonest, and refers the case to the anti-corruption authority to investigate his family's offshore
  assets revealed by the Panama Papers. Sharif stood down and denied wrongdoing.
