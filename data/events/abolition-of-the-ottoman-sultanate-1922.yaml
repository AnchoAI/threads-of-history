id: abolition-of-the-ottoman-sultanate-1922
title: Abolition of the Ottoman sultanate
summary: In the late stages of the War of Independence, the Grand National Assembly in Ankara separated
  the caliphate from the sultanate and abolished the monarchy, ending the Ottoman Empire. The last sultan,
  Mehmed VI, left Constantinople on 17 November.
