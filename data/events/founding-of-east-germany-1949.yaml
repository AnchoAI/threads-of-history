id: founding-of-east-germany-1949
title: German Democratic Republic founded
summary: The German Democratic Republic (East Germany) was declared on 7 October 1949 in the Soviet occupation
  zone, under a constitution that came into force that day, and the Socialist Unity Party (SED) dominated
  it. The Soviets kept considerable control until 1955; the emergence of the two German states solidified
  the 1945 division of Germany.
