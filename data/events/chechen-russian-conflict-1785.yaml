id: chechen-russian-conflict-1785
title: Chechen–Russian conflict
summary: A centuries-long ethnic and political conflict, often armed, between Russian, Soviet and Imperial Russian
  governments and Chechen forces. Formal hostilities date back to 1785. Its recent phase began after the Soviet
  Union dissolved in 1991 and ended in 2017 with the crushing of the separatist movement in Chechnya.
