id: justice-department-releases-epstein-files-2025
title: Justice Department releases the Epstein files
summary: Under the Transparency Act, the Justice Department publishes Epstein files in waves from 19 December 2025
  to 30 January 2026, more than 3.5 million pages in all. The first release misses the legal deadline, drawing bipartisan
  criticism; some sought-after material is redacted, while NPR finds some victims' names left unredacted.
