id: european-theatre-of-world-war-ii-1939
title: European theatre of World War II
summary: One of the two main theatres of the Second World War, from September 1939 to May 1945, in which the Allies
  fought the Axis powers on Western, Eastern, Scandinavian and Mediterranean fronts. The fighting caused at least
  39 million deaths, and Germany carried out the Holocaust in the territories it occupied.
