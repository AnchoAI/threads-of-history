id: hamoodur-rahman-commission-report-1974
title: Hamoodur Rahman Commission report
summary: A Pakistani judicial commission, set up by Zulfikar Ali Bhutto in December 1971 to inquire into
  the 1971 war, the atrocities and the surrender in the east, submits its final report. The government
  did not allow publication; parts leaked to the press in 2000.
