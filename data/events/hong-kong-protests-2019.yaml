id: hong-kong-protests-2019
title: 2019–2020 Hong Kong protests
summary: Protests against a bill that would have allowed extradition to mainland China began in March
  2019 and grew into mass demonstrations from June, the largest series of demonstrations in Hong Kong's
  history. They subsided in early 2020 with the COVID-19 outbreak.
