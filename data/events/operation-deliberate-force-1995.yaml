id: operation-deliberate-force-1995
title: Operation Deliberate Force
summary: NATO conducts an air campaign against the Bosnian Serb army from 30 August to 20 September 1995,
  after the Srebrenica and Markale massacres. The campaign proved key in ending the Bosnian War.
