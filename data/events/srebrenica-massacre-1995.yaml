id: srebrenica-massacre-1995
title: Srebrenica massacre
summary: In July 1995 Bosnian Serb forces under Ratko Mladić kill more than 8,000 Bosniak men and boys
  in and around Srebrenica, an enclave the UN had declared a 'safe area'. The ICTY (2004) and the International
  Court of Justice (2007) ruled that it was genocide.
