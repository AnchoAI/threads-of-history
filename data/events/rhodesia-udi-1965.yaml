id: rhodesia-udi-1965
title: Rhodesia's Unilateral Declaration of Independence
summary: Ian Smith's cabinet, drawn from Rhodesia's white minority of about 5%, declares the self-governing
  British colony independent after Britain refused independence before majority rule. No country recognised
  it.
