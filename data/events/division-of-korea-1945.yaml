id: division-of-korea-1945
title: Division of Korea
summary: 'At the end of the Second World War Korea was split along the 38th parallel into a Soviet occupation
  zone in the north and a US zone in the south. The zones became separate states in 1948: the Republic of Korea
  on 15 August and the Democratic People''s Republic of Korea on 9 September.'
