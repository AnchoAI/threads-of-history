id: bandung-conference-1955
title: Bandung Conference
summary: Twenty-nine Asian and African states, most newly independent, meet in Bandung, Indonesia, to
  promote Afro-Asian cooperation and oppose colonialism. Sukarno and Nehru were key organisers; the conference
  was a step towards the Non-Aligned Movement.
