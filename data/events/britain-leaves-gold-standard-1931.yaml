id: britain-leaves-gold-standard-1931
title: Britain leaves the gold standard
summary: Facing speculative attacks on the pound and falling gold reserves, the Bank of England stopped
  exchanging pound notes for gold on 19 September 1931, and the pound floated; Parliament passed the Gold
  Standard (Amendment) Act on 21 September. Later analysis finds that countries which left the gold standard
  early, as Britain did, recovered sooner.
