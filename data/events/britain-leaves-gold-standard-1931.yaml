review:
  status: sourced
  notes:
  - 'The sources disagree on order: the Great Depression article says the UK was the first major currency
    to leave gold, while the 1931 banking crisis and gold standard articles say Germany suspended convertibility
    or imposed exchange controls in July 1931. The summary avoids saying ''first''.'
