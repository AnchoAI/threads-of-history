id: paris-peace-conference-1919
title: Paris Peace Conference
summary: The victorious Allied powers met in Paris from January 1919 to January 1920 to set the terms
  of peace after the First World War. Its main decisions were the creation of the League of Nations and
  five peace treaties with the defeated states, including reparations imposed on Germany and new national
  borders.
