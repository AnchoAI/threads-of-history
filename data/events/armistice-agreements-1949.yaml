id: armistice-agreements-1949
title: 1949 Armistice Agreements
summary: Israel signed armistice agreements with Egypt, Lebanon, Transjordan and Syria between February and
  July 1949. They formally ended the hostilities of the 1948 war and drew the Green Line, which separated Israel
  from the Jordanian-held West Bank and the Egyptian-held Gaza Strip until 1967.
