id: winter-war-1939-1940
title: Winter War
summary: The Soviet Union invades Finland on 30 November 1939 and is expelled from the League of Nations.
  The war ends on 13 March 1940 with the Moscow Peace Treaty, under which Finland cedes 9% of its territory.
