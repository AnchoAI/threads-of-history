id: august-coup-1991
title: August 1991 coup attempt
summary: On 19 August 1991 senior Soviet officials opposed to Gorbachev's reforms act to stop the new
  union treaty, placing Gorbachev under house arrest in Crimea. Resistance led by Boris Yeltsin defeats
  the coup by 21 August; afterwards Yeltsin became the dominant leader and Gorbachev lost much of his
  influence.
