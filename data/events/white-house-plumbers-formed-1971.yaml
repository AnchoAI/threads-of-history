id: white-house-plumbers-formed-1971
title: White House "Plumbers" unit formed
summary: Within a week of the Pentagon Papers' publication in June 1971, the Nixon White House sets up a covert
  Special Investigations Unit, the "Plumbers", to stop leaks of classified information to the press.
