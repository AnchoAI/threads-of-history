id: porn-rock-senate-hearing-1985
title: Senate hearing on rock lyrics
summary: On 19 September 1985 the US Senate Commerce, Science and Transportation Committee holds a hearing
  on the content of sound recordings and proposed warning labels. PMRC representatives testify for labels;
  the musicians Frank Zappa, Dee Snider and John Denver testify against, Zappa and Denver calling the proposals
  censorship or an infringement of civil liberties.
