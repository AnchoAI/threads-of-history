id: yugoslav-wars-1991
title: Yugoslav Wars
summary: A series of ethnic conflicts, wars of independence and insurgencies from 1991 to 2001 accompanies
  the breakup of Yugoslavia into six countries. Often described as among Europe's deadliest conflicts
  since the Second World War, they included genocide, ethnic cleansing and mass wartime rape.
