id: nebraska-legislature-franklin-committee-1988
title: Nebraska Legislature's Franklin Committee
summary: The Nebraska Legislature sets up the Franklin Committee, chaired by state senator Loran Schmit with Ernie
  Chambers as vice-chair, to examine the credit union's collapse and the abuse allegations. Its private investigator,
  Gary Caradori, dies with his son in a plane crash in July 1990; foul play suspected by his brother and by Schmit
  was not proven by investigators.
