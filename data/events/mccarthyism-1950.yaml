id: mccarthyism-1950
title: McCarthyism
summary: A campaign of accusations and investigations of alleged communist and Soviet influence in US
  institutions in the late 1940s and 1950s, named after Senator Joseph McCarthy, whose role began publicly
  with a speech in Wheeling, West Virginia, on 9 February 1950. Congress held 109 investigations between
  1949 and 1954; McCarthy lost popularity after several accusations were found false and was censured
  by the Senate.
