id: diriyah-pact-1744
title: Pact between Muhammad ibn Abd al-Wahhab and Muhammad bin Saud
summary: The emir of Diriyah, Muhammad bin Saud, and the cleric Muhammad ibn Abd al-Wahhab agreed that the Al Saud
  would lead in political and military matters and Ibn Abd al-Wahhab in religious ones. Most sources date the pact
  to 1744; some give 1745.
