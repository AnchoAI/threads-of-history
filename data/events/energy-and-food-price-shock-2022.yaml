id: energy-and-food-price-shock-2022
title: Energy and food price shock after Russia invades Ukraine
summary: From March 2022, Russia's invasion of Ukraine pushed up food and energy prices around the world,
  as Ukrainian wheat and corn could not reach world markets and oil prices jumped. Moody's economist Mark
  Zandi estimated that by May 2022 the invasion accounted for 3.5 points of US inflation of 8.6 percent.
