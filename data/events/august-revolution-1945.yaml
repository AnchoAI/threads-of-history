id: august-revolution-1945
title: August Revolution and Vietnamese declaration of independence
summary: As Japan surrenders, the Viet Minh leads an uprising that takes power in Vietnam; Emperor Bảo
  Đại abdicates, and on 2 September Ho Chi Minh declares the Democratic Republic of Vietnam in Hanoi.
