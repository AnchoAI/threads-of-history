id: bangladesh-liberation-war-1971
title: Bangladesh Liberation War
summary: Pakistan's military launches Operation Searchlight against East Pakistan, beginning what Bangladesh
  calls a genocide; estimates of civilian deaths range from 300,000 to 3 million. Bengali guerrillas fight
  back, India enters the war in December, and Pakistan surrenders in Dhaka, leading to Bangladesh's independence.
