id: mukden-incident-1931
title: Mukden Incident
summary: A Japanese officer sets off a small charge by a Japanese-owned railway near Mukden. The army
  blames Chinese dissidents and invades Manchuria. Some suspected a Japanese plot at the time; the Tokyo
  Tribunal later held that it was planned and executed by the Japanese.
