id: ghana-independence-1957
title: Ghana becomes independent
summary: The Gold Coast becomes independent from Britain as the Dominion of Ghana, with Kwame Nkrumah
  as prime minister. It was the first sub-Saharan African country to gain independence from European colonisation.
