id: doj-fbi-epstein-memo-2025
title: Justice Department and FBI memo finds no Epstein "client list"
summary: The Justice Department and FBI release a memo concluding that they found no incriminating "client list",
  no credible evidence that Epstein blackmailed prominent people and no evidence that would justify investigating
  uncharged third parties, and reaffirming that his death was a suicide; they say no further files will be released.
  The position draws criticism from across the political spectrum.
