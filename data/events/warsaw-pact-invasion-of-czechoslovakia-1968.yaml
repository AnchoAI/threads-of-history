id: warsaw-pact-invasion-of-czechoslovakia-1968
title: Warsaw Pact invasion of Czechoslovakia
summary: On the night of 20–21 August 1968, armies of the Soviet Union, Bulgaria, Poland and Hungary invade
  Czechoslovakia to end the Prague Spring; the Soviet claim of a right to use force in its satellite states
  became known as the Brezhnev Doctrine. In April 1969 Gustáv Husák replaced Dubček and reversed almost
  all of the reforms, a period called normalization.
