      note: The White House learned of the invasion from Moscow itself; Ambassador Dobrynin read the Soviet
        message to President Johnson at a meeting that began at 8:15 p.m. Washington time on 20 August. The
        invasion began at about 11 p.m. on 20 August local time. Rusk told the emergency NSC meeting that
        night "This surprises me." The CIA's later history says Helms told Johnson earlier that day that an
        emergency Politburo meeting pointed to an invasion (PDF source; quote not checkable here).
