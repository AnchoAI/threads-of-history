id: berlin-ultimatum-1958
title: Khrushchev's Berlin ultimatum
summary: In November 1958 Khrushchev gave the Western Allies six months to settle the status of Germany,
  threatening otherwise to sign a separate peace with East Germany and make Berlin a free city with East
  Germany controlling all access to it. The ultimatum failed, and he renewed his demands in 1961.
