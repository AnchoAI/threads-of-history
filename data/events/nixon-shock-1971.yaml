id: nixon-shock-1971
title: 'Nixon shock: the dollar''s gold convertibility suspended'
summary: On 15 August 1971 President Richard Nixon closed the 'gold window', so that foreign governments
  could no longer exchange dollars for gold, and announced a 90-day wage and price freeze and a 10 percent
  import surcharge. The move, meant to counter inflation and a looming run on US gold, marked the beginning
  of the end of the Bretton Woods system.
