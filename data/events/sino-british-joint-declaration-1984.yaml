id: sino-british-joint-declaration-1984
title: Sino-British Joint Declaration
summary: Signed by Margaret Thatcher and Zhao Ziyang on 19 December 1984, the treaty set the terms for
  transferring Hong Kong to China in 1997, under which China pledged to keep "one country, two systems"
  for 50 years.
