id: columbian-exchange-1492
title: Columbian exchange begins
summary: After Columbus's 1492 voyage, plants, animals and diseases move between the Americas and Afro-Eurasia.
  Old World diseases cut the Indigenous population of the Americas by 80–95%, while American crops such as maize
  and potatoes raised food production and population in the Old World.
occurred:
  start: '1492'
  precision: year
  note: The exchange began with Columbus's first voyage and continued over the following centuries.
