id: saudi-arabia-proclaimed-1932
title: Kingdom of Saudi Arabia proclaimed
summary: After campaigns that began with his recapture of Riyadh in 1902, Ibn Saud (Abdulaziz) united most of the
  Arabian Peninsula and by royal decree named the state the Kingdom of Saudi Arabia, the third Saudi state.
