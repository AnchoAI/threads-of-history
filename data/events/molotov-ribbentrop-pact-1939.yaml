id: molotov-ribbentrop-pact-1939
title: Molotov–Ribbentrop Pact
summary: Non-aggression pact between Nazi Germany and the Soviet Union, signed in Moscow by Vyacheslav
  Molotov and Joachim von Ribbentrop on 24 August 1939 and backdated to 23 August. Its public terms were
  published the next day; a secret protocol divided Eastern Europe into spheres of influence. A week later
  Germany invaded Poland.
