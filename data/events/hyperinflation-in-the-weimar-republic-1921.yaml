id: hyperinflation-in-the-weimar-republic-1921
title: Hyperinflation in the Weimar Republic
summary: The German paper mark collapsed between 1921 and 1923, mainly in 1923; by November 1923 one US
  dollar was worth about 4.2 trillion marks. Historians and economists disagree on how far reparations
  caused it.
