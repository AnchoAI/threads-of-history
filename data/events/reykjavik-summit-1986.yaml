id: reykjavik-summit-1986
title: Reykjavík Summit
summary: Reagan and Gorbachev meet in Reykjavík on 11–12 October 1986. Gorbachev proposes eliminating
  all nuclear weapons within a decade on condition that research on the US Strategic Defense Initiative
  stays in laboratories, which Reagan refuses; the talks collapse at the last minute, but the progress
  made eventually resulted in the 1987 INF Treaty.
