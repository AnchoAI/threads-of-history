id: berlin-blockade-1948
title: Berlin Blockade
summary: From 24 June 1948 to 12 May 1949 the Soviet Union blocked rail, road and canal access to the
  Western-held sectors of Berlin, offering to lift the blockade if the Western Allies withdrew the new
  Deutsche Mark from West Berlin. One of the first major crises of the Cold War, it was met by the Berlin
  Airlift.
