  quote: The 2018 Moscow–Constantinople schism is an ongoing schism between the Russian Orthodox Church
    (ROC, also known as the Moscow Patriarchate) and the Ecumenical Patriarchate of Constantinople, which
    began on 15 October 2018 when the former unilaterally severed full communion with the latter.
