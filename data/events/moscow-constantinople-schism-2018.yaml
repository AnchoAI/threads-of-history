id: moscow-constantinople-schism-2018
title: Moscow breaks communion with Constantinople
summary: On 15 October 2018 the Russian Orthodox Church unilaterally severed full communion with the Ecumenical
  Patriarchate of Constantinople, in response to Constantinople's decision to grant autocephaly to a Ukrainian
  church. The schism is ongoing.
