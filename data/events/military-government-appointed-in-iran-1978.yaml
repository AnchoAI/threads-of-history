id: military-government-appointed-in-iran-1978
title: The Shah appoints a military government
summary: On 6 November 1978 the Shah dismissed Prime Minister Sharif-Emami and appointed a military government under
  General Gholam-Reza Azhari, a step CIA analysts said he had been trying to avoid.
