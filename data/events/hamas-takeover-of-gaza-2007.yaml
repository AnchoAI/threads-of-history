id: hamas-takeover-of-gaza-2007
title: Hamas takes over Gaza (Battle of Gaza)
summary: After Hamas won the January 2006 Palestinian legislative election and a unity government with Fatah
  collapsed, the two fought a brief civil war in Gaza from 7 to 15 June 2007. Hamas took control of the Gaza
  Strip, which it has governed since.
