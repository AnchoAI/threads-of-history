  quote: Saigon, the capital of South Vietnam, was captured by North Vietnam on 30 April 1975. This caused
    the evacuation of thousands of civilians and U.S. personnel, and ended the Vietnam War. The aftermath ushered
    in a transition period under the Provisional Revolutionary Government of the Republic of South Vietnam
    until the formal reunification in 1976.
