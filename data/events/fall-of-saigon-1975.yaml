id: fall-of-saigon-1975
title: Fall of Saigon
summary: North Vietnamese forces captured Saigon, the capital of South Vietnam, on 30 April 1975, after the
  evacuation of most US personnel and tens of thousands of South Vietnamese. It ended the Vietnam War; Vietnam
  was formally reunified in 1976.
