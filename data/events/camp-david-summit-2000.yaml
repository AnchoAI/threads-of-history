id: camp-david-summit-2000
title: 2000 Camp David Summit
summary: Bill Clinton, Ehud Barak and Yasser Arafat met at Camp David from 11 to 25 July 2000 to try to end
  the conflict; the summit ended without agreement, largely over Jerusalem. Clinton blamed Arafat; other participants
  and observers, such as US negotiator Robert Malley, spread the blame more widely.
