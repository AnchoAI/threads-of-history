id: succession-to-muhammad-0632
title: Succession crisis after Muhammad's death
summary: After Muhammad died in 632, a gathering at the Saqifa in Medina chose Abu Bakr as the first caliph. Sunni
  Islam holds that this election was legitimate; Shia Islam holds that Muhammad had designated his cousin Ali as
  successor.
