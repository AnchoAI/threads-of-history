id: hong-kong-national-security-law-2020
title: Hong Kong national security law
summary: On 30 June 2020 the Standing Committee of China's National People's Congress passed a national
  security law for Hong Kong, which came into force the same day. The United Kingdom and 26 other countries
  condemned it, and the UK called it a breach of the 1984 Joint Declaration.
