id: second-united-front-1937
title: Second United Front formed
summary: The Kuomintang and the Chinese Communist Party ally to resist Japan. The CCP's declaration of
  cooperation is published on 22 September 1937 and the Red Army is reorganised under the National Revolutionary
  Army. Substantive cooperation effectively ends after the New Fourth Army Incident of January 1941.
