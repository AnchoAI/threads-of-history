  notes:
  - Precision is month because the end is only known to the month; the declaration was published on 22
    September 1937.
  - Start date is the publication of the CCP declaration; the alliance had no single founding date. Wikidata
    describes it as lasting 1937–1945; the end month here follows the source's statement that substantive
    cooperation ended after January 1941.
