id: first-moroccan-crisis-1905
title: First Moroccan Crisis
summary: Germany challenged France's growing control over Morocco, beginning with Kaiser Wilhelm II's visit to Tangier
  on 31 March 1905. The Algeciras Conference ended the crisis in April 1906 by affirming French control.
