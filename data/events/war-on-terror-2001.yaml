title: War on terror
summary: A global military campaign launched by the United States in response to the September 11 attacks, first
  aimed at al-Qaeda, with its main theatre in Afghanistan and Pakistan. Its main phase is dated 14 September 2001
  to 30 August 2021; smaller operations continue.
