id: charter-77-1977
title: Charter 77
summary: Czechoslovak dissidents, among them Václav Havel, publish Charter 77 on 6 January 1977, criticising
  the government for failing to implement human-rights commitments it had signed, including the Helsinki
  Final Act. Signatories faced harassment and arrest; after the 1989 Velvet Revolution many of them took
  important political roles.
