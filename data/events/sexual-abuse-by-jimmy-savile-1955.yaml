review:
  status: sourced
  notes:
  - 'Batch S2 (abuse in institutions and #MeToo). Summary and dates checked against the quoted sources;
    no person has reviewed them yet.'
  - The 1955–2009 span is the range of allegations recorded in Giving Victims a Voice (BBC report of it),
    not a court finding; Savile was never tried. The Smith review is an inquiry finding.
  - The Smith review found certain junior and middle-ranking BBC staff aware of his conduct but no evidence
    the BBC as a corporate body knew (BBC News, 2016); no date is given, so no known.by entry was added
    for the BBC.
