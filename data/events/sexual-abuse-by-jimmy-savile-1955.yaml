id: sexual-abuse-by-jimmy-savile-1955
title: Sexual abuse by Jimmy Savile
wikidata: Q6201222
summary: Police and the NSPCC recorded 214 crimes by the television presenter Jimmy Savile from 1955 to
  2009, 34 of them rape or penetration, at places including 13 hospitals and BBC premises. The BBC's Dame
  Janet Smith review found 72 victims in connection with his BBC work. Savile died in 2011 without being
  prosecuted.
