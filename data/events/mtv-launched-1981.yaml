id: mtv-launched-1981
title: MTV launches
summary: The cable channel MTV launches on 1 August 1981, airing music videos introduced by video jockeys.
  In its first years it features very few Black artists, and Michael Jackson's "Billie Jean" is later described
  as the video that broke that barrier.
