id: larry-nassar-pleads-guilty-and-is-sentenced-2017
title: Larry Nassar pleads guilty and is sentenced
wikidata: none
summary: Larry Nassar pleads guilty to federal child pornography charges (July 2017) and to sexual assault
  of minors in Ingham and Eaton counties, Michigan (November 2017). He is sentenced to 60 years in federal
  prison and, on 24 January 2018, after more than 150 women gave impact statements, to 40 to 175 years
  by Judge Rosemarie Aquilina.
