id: operation-ryan-1981
title: Soviet intelligence launches Operation RYaN
summary: At a closed meeting in May 1981, Leonid Brezhnev and KGB chairman Yuri Andropov tell senior KGB
  officers that the United States is preparing a secret nuclear attack, and the KGB and GRU begin Operation
  RYaN to detect one. It became the largest peacetime intelligence-gathering operation in Soviet history.
