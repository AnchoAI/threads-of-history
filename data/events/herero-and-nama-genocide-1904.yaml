id: herero-and-nama-genocide-1904
title: Herero and Nama genocide
summary: German colonial forces in German South West Africa (now Namibia) kill tens of thousands of Herero
  and Nama people after uprisings against German rule. Germany acknowledged it as a genocide in 2015.
