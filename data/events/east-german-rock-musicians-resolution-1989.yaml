id: east-german-rock-musicians-resolution-1989
title: East German rock musicians' resolution
summary: On 18 September 1989 more than 50 East German rock musicians and singer-songwriters meet in East Berlin
  and sign a resolution calling for political reform. They read it out at concerts, and the state responds
  by banning or cancelling their performances.
