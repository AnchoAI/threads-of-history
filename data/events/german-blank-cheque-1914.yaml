id: german-blank-cheque-1914
title: Germany's "blank cheque" to Austria-Hungary
summary: On 5–6 July 1914 Kaiser Wilhelm II and Chancellor Bethmann Hollweg assured Austria-Hungary of Germany's
  full support against Serbia, even at the risk of "grave European complications".
