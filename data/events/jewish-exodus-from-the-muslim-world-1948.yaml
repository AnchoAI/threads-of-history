id: jewish-exodus-from-the-muslim-world-1948
title: Jewish exodus from Arab and Muslim countries
summary: About 900,000 Jews migrated, fled or were expelled from Muslim-majority countries in the 20th century,
  mostly between 1948 and the early 1970s, after Israel was established. The source lists both pull factors
  (Zionism, economic prospects, Israeli recruitment) and push factors (antisemitic violence, instability, expulsion);
  whether those who left were refugees is disputed.
