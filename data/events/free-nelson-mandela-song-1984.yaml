id: free-nelson-mandela-song-1984
title: '"Free Nelson Mandela" released'
summary: The Special AKA release "Nelson Mandela", also known as "Free Nelson Mandela", written by Jerry Dammers
  about the imprisoned ANC leader. It reaches number nine in the UK; banned in South Africa, it is played there
  at football matches and ANC rallies.
