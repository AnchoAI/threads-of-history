id: kennedy-nixon-debates-1960
title: Kennedy–Nixon televised debates
summary: John F. Kennedy and Richard Nixon hold the first televised US presidential debates, from 26 September to
  21 October 1960. An estimated 70 million Americans, about two-thirds of the electorate, watched the first debate.
