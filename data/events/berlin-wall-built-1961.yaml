id: berlin-wall-built-1961
title: Berlin Wall built
summary: On 13 August 1961 East Germany began building the Berlin Wall around West Berlin, mainly to stop
  its citizens fleeing to the West; about 3.5 million East Germans, some 20% of the population, had left
  before it went up. Estimates of those killed at the Wall until 1989 range from 136 to more than 200.
