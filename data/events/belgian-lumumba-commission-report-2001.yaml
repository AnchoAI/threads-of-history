id: belgian-lumumba-commission-report-2001
title: Belgian parliamentary inquiry into Lumumba's death
summary: A Belgian parliamentary commission, set up in 2000, reports in November 2001 that the Belgian
  government lied to the public and bore a "moral responsibility" for Lumumba's killing, though it found
  no written order to kill him. Belgium formally apologised in February 2002.
