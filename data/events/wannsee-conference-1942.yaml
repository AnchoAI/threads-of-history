id: wannsee-conference-1942
title: Wannsee Conference
summary: On 20 January 1942, 15 senior Nazi Party and German government officials meet in the Berlin suburb
  of Wannsee to coordinate the 'Final Solution', the plan to murder Europe's Jews. Reinhard Heydrich chairs;
  none of those present objects. The minutes were found only in 1947.
occurred:
  start: '1942-01-20'
  precision: day
known:
  public:
    start: 1947-03
    precision: month
    note: A copy of the minutes was found by US prosecutor Robert Kempner in March 1947 in seized German
      Foreign Office files.
