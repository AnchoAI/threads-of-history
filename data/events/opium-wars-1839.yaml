id: opium-wars-1839
title: Opium Wars
summary: Two wars between the Qing dynasty and Western powers in the mid-19th century. Britain fought China from
  1839 to 1842, after the Qing government moved to enforce its ban on opium; Britain and France fought China again
  from 1856 to 1860.
