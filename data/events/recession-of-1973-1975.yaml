id: recession-of-1973-1975
title: 1973–1975 recession and stagflation
summary: A recession across much of the Western world, lasting in the US from November 1973 to March 1975,
  unusual for combining high unemployment with high inflation (stagflation). Its causes included the 1973
  oil crisis, Vietnam War deficits and the fall of the Bretton Woods system; how much weight the oil shock
  deserves, as against US monetary policy, is debated.
