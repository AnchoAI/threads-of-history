id: assassination-of-yitzhak-rabin-1995
title: Assassination of Yitzhak Rabin
summary: Israeli Prime Minister Yitzhak Rabin was shot dead on 4 November 1995 at the end of a Tel Aviv rally
  supporting the Oslo Accords. The assassin, Yigal Amir, was a far-right Israeli ultranationalist who opposed
  the accords.
