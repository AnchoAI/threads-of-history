id: russian-financial-crisis-1998
title: Russian financial crisis of 1998
summary: On 17 August 1998 Russia devalues the rouble, defaults on its domestic debt and declares a moratorium
  on repaying foreign debt. Causes cited include a chronic fiscal deficit, the cost of the first Chechen
  war, and the Asian financial crisis and falling oil prices.
