id: radio-free-europe-first-broadcast-1950
title: Radio Free Europe begins broadcasting
summary: Radio Free Europe, a US-funded station, makes its first broadcast to Czechoslovakia on 4 July 1950 from
  Lampertheim, West Germany. It publicised anti-Soviet protests and nationalist movements, and Soviet authorities
  jammed its signals.
