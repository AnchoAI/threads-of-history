id: u-2-photographs-soviet-missile-sites-in-cuba-1962
title: U-2 photographs Soviet missile sites in Cuba
summary: On 14 October 1962 a U-2 flown by Major Richard Heyser photographed western Cuba; analysts found
  three medium-range ballistic missile sites under construction near San Cristobal, the first verified
  evidence of Soviet offensive missiles in Cuba. Kennedy was told on the morning of 16 October and announced
  the discovery on 22 October.
