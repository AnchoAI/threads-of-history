id: great-depression-1929
title: Great Depression
summary: 'A severe worldwide economic downturn from 1929 to 1939, marked by mass unemployment, falling
  prices, bank failures and a collapse in international trade; world GDP fell by an estimated 15% between
  1929 and 1932. Its causes are disputed: some point to the Wall Street crash or wider economic trends,
  others to failures of monetary policy, with the gold standard spreading the downturn between countries.'
