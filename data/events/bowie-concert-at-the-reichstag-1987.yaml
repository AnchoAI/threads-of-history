id: bowie-concert-at-the-reichstag-1987
title: Bowie concert by the Berlin Wall and East Berlin riots
summary: David Bowie plays a concert at the Reichstag in West Berlin on 6 June 1987, close to the Berlin Wall.
  Thousands of East Germans listen from across the Wall, and violent rioting in East Berlin follows.
