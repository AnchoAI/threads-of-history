id: unfccc-adopted-1992
title: UN Framework Convention on Climate Change adopted
summary: The UN Framework Convention on Climate Change, a treaty to combat 'dangerous human interference with the
  climate system', is adopted on 9 May 1992 and opened for signature at the Rio Earth Summit, where 154 nations
  signed it.
