id: albert-fall-convicted-1929
title: Albert B. Fall found guilty of bribery
summary: A jury finds former Interior Secretary Albert B. Fall guilty of bribery and conspiracy in October 1929
  over $385,000 paid to him by Edward L. Doheny. He was jailed for one year, the first former cabinet officer sentenced
  to prison for misconduct in office.
