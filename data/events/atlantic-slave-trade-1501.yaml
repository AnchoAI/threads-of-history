id: atlantic-slave-trade-1501
title: Atlantic slave trade
summary: European and American slave ships carry enslaved Africans across the Atlantic to the Americas from the
  16th century until well into the 19th. The Trans-Atlantic Slave Trade Database project estimates that about 12.5
  million captives were embarked in Africa and 10.7 million landed in the Americas.
