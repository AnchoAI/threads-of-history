id: philippine-american-war-1899
title: Philippine–American War
summary: Fighting breaks out between Philippine nationalists and the United States, which had annexed
  the islands from Spain. The US declared the war over on 4 July 1902; at least 200,000 Filipino civilians
  died, mostly from famine and disease.
