id: world-wide-web-1989
title: Tim Berners-Lee proposes the World Wide Web
summary: At CERN, Tim Berners-Lee proposes a linked information system that becomes the World Wide Web.
  The Web opened to the public in 1991, and in April 1993 CERN put its software in the public domain.
