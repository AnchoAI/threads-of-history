id: draghi-whatever-it-takes-2012
title: 'Draghi: the ECB will do "whatever it takes"'
summary: In a speech in London on 26 July 2012 ECB president Mario Draghi said that, within its mandate,
  the bank was ready "to do whatever it takes to preserve the euro". On 6 September 2012 the ECB set out
  Outright Monetary Transactions, bond purchases with no preset limit for countries under a eurozone rescue
  programme, which calmed financial markets.
