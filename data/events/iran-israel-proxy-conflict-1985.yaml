id: iran-israel-proxy-conflict-1985
title: Iran–Israel proxy conflict
summary: A proxy conflict between Iran and Israel since 1985. Iran has backed Hezbollah in Lebanon and Palestinian
  groups such as Hamas; Israel has backed Iranian rebels, struck Iran's allies in Syria and assassinated Iranian
  nuclear scientists. It escalated into direct confrontations in 2024 and a 12-day war in June 2025.
