id: nato-assurance-documents-published-2017
title: Declassified records of 1990 NATO assurances published
summary: On 12 December 2017 the National Security Archive publishes declassified US, Soviet, German,
  British and French documents showing that Baker's assurance was part of a series of assurances about
  Soviet security given by Western leaders to Gorbachev and other Soviet officials in 1990 and into 1991.
