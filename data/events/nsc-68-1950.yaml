id: nsc-68-1950
title: NSC 68
summary: NSC 68, a top-secret policy paper drafted under Paul Nitze and presented to Truman on 7 April
  1950, argued that the Soviet Union was driven "to impose its absolute authority over the rest of the
  world" and called for a massive US military build-up, roughly tripling defence spending. It took on
  new importance once the Korean War began, and was declassified in 1975.
