id: marshall-plan-1948
title: Marshall Plan
summary: Proposed by Secretary of State George Marshall at Harvard on 5 June 1947 and signed into law
  by Truman on 3 April 1948, the European Recovery Program transferred about $13.3 billion to 17 European
  countries over four years. The same aid was offered to the Soviet Union and its allies, who refused
  it under Soviet pressure.
occurred:
  start: '1948-04-03'
  precision: day
  note: Operated for four years from this date; largely replaced by the Mutual Security Act in 1951.
