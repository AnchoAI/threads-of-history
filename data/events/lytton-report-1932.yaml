id: lytton-report-1932
title: Lytton Report
summary: A League of Nations commission under the Earl of Lytton reports that Japan's operations after
  the Mukden Incident were not legitimate self-defence and refuses to recognise Manchukuo. It does not
  say who set off the explosion.
