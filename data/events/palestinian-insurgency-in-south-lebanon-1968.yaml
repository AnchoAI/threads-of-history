id: palestinian-insurgency-in-south-lebanon-1968
title: Palestinian insurgency in South Lebanon
summary: An insurgency led by the Palestine Liberation Organization from Lebanon against Israel from 1968, and against
  Lebanese Christian militias from the mid-1970s. It ended when Israel invaded Lebanon in 1982 and expelled the
  PLO.
