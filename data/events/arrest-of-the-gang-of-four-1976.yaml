id: arrest-of-the-gang-of-four-1976
title: Arrest of the Gang of Four
summary: On 6 October 1976, shortly after Mao's death, Hua Guofeng had the Gang of Four (Jiang Qing, Zhang
  Chunqiao, Yao Wenyuan and Wang Hongwen) arrested in a bloodless coup. The event is usually taken to mark
  the end of the Cultural Revolution.
