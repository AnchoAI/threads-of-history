id: rock-hudson-announces-aids-diagnosis-1985
title: Rock Hudson's AIDS diagnosis made public
summary: On 25 July 1985 the publicist of the actor Rock Hudson confirms that he has AIDS; HIV.gov calls him the
  first major US public figure to do so. He dies of AIDS-related complications on 2 October 1985.
