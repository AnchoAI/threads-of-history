id: deng-xiaoping-southern-tour-1992
title: Deng Xiaoping's southern tour
summary: From 18 January to 21 February 1992 Deng Xiaoping, holding no formal office, toured Shenzhen, Zhuhai,
  Guangzhou and Shanghai. His remarks revived reform and opening up, which had stalled after the 1989 crackdown.
