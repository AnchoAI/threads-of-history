id: killing-of-victor-jara-1973
title: Killing of Víctor Jara
summary: Days after the 11 September 1973 coup, the Chilean military detains the singer-songwriter Víctor Jara,
  a prominent supporter of Allende, at Estadio Chile in Santiago, where he is tortured and, on 16 September,
  shot dead.
