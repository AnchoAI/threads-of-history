id: slavery-abolition-act-1833
title: Britain abolishes slavery in its empire
summary: 'The Slavery Abolition Act 1833 abolishes slavery in the British Empire by compensated emancipation: the
  government pays slave owners £20 million. It excluded territories such as British India.'
