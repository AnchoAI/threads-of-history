id: nsa-releases-gulf-of-tonkin-documents-2005
title: NSA declassifies Gulf of Tonkin documents
summary: On 30 November–1 December 2005 the US National Security Agency declassified over 140 documents on
  the Gulf of Tonkin incident, including a study by its historian Robert J. Hanyok, first published internally
  in 2001. The study concluded that the 4 August 1964 attack did not occur and that intelligence passed to
  policymakers had been skewed.
