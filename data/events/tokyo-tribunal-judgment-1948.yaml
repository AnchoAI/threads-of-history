id: tokyo-tribunal-judgment-1948
title: Tokyo Tribunal judgment
summary: The International Military Tribunal for the Far East reads its judgment. It holds that the Mukden
  Incident of 1931 was planned and executed by the Japanese and treats the war against China as having
  begun that night.
