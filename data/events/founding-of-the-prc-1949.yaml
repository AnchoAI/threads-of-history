id: founding-of-the-prc-1949
title: Proclamation of the People's Republic of China
summary: On 1 October 1949 Mao Zedong proclaimed the People's Republic of China from Tiananmen Gate in
  Beijing, after the Communists gained control of mainland China in the civil war. The Republic of China
  government retreated to Taiwan in December.
