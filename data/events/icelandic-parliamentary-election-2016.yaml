id: icelandic-parliamentary-election-2016
title: 2016 Icelandic parliamentary election
summary: Iceland holds an early parliamentary election on 29 October 2016, called after the protests that followed
  the Panama Papers revelations about Prime Minister Gunnlaugsson. Gunnlaugsson's Progressive Party loses more than
  half its seats.
