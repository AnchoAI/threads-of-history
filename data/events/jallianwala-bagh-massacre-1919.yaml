id: jallianwala-bagh-massacre-1919
title: Jallianwala Bagh (Amritsar) massacre
summary: In Amritsar, troops under Brigadier-General Reginald Dyer fire on a crowd gathered in the Jallianwala
  Bagh, partly to protest the Rowlatt Act. Estimates of the dead range from 379 to 1,500 or more.
