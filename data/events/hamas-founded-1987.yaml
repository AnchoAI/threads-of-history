id: hamas-founded-1987
title: Hamas founded
summary: Hamas was founded by Ahmed Yassin in December 1987, after the First Intifada broke out, out of a Muslim
  Brotherhood-affiliated network in Gaza. Its 1988 charter called for an Islamist state in all of Mandatory
  Palestine.
