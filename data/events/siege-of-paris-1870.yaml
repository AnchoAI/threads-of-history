id: siege-of-paris-1870
title: Siege of Paris (1870–1871)
summary: The siege of Paris from 19 September 1870 to 28 January 1871, which ended with the city's capture by forces
  of the North German Confederation led by Prussia. It was the culmination of the Franco-Prussian War.
