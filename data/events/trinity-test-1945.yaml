id: trinity-test-1945
title: Trinity test
summary: The first detonation of a nuclear weapon, an implosion-design plutonium bomb, by the US Army
  in New Mexico at 5:29 a.m. on 16 July 1945, as part of the Manhattan Project. A cover story described
  it as an ammunition magazine explosion; it was made public shortly after the Hiroshima bombing.
