id: archives-of-terror-found-1992
title: Paraguay's 'Archives of Terror' found
summary: Lawyer Martín Almada finds the records of Alfredo Stroessner's secret police in Paraguay. The
  documents proved the existence of Operation Condor and described the fates of thousands of people kidnapped,
  tortured and killed.
