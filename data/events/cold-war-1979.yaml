id: cold-war-1979
title: Cold War (1979–1985)
summary: A late phase of the Cold War marked by a sharp rise in hostility between the Soviet Union and the West,
  which arose from condemnation of the Soviet invasion of Afghanistan in December 1979. Thatcher and Reagan rejected
  détente, and the threat of nuclear war reached heights not seen since the Cuban Missile Crisis.
