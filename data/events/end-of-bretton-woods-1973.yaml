id: end-of-bretton-woods-1973
title: Bretton Woods system collapses; major currencies float
summary: After speculation forced a second devaluation of the dollar on 12 February 1973, nearly all major
  currencies were floating against the dollar within a month. In March 1973 six European Community members
  jointly floated their currencies, which effectively ended the Bretton Woods fixed-exchange-rate system.
