title: Dissolution of the Constituent Assembly
summary: The elected Constituent Assembly, in which the Socialist Revolutionaries outpolled the Bolsheviks,
  met for 13 hours in Petrograd and was then dissolved by the Bolshevik-led Central Executive Committee.
