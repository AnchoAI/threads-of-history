id: battle-of-britain-1940
title: Battle of Britain
summary: The first major military campaign fought entirely by air forces, officially dated 10 July to
  31 October 1940. The Luftwaffe fails to destroy Britain's air defences, and Hitler postpones and then
  cancels the planned invasion, Operation Sea Lion.
