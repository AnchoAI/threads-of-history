id: maji-maji-rebellion-1905
title: Maji Maji Rebellion
summary: Africans in German East Africa (now Tanzania) rise against German colonial rule, set off by policies
  forcing them to grow cotton for export. Between 75,000 and 300,000 people died, most from famine.
