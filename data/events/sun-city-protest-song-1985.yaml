id: sun-city-protest-song-1985
title: '"Sun City" protest song'
summary: Artists United Against Apartheid, a group of musicians gathered by Steven Van Zandt, release "Sun
  City" in 1985, pledging not to play the Sun City resort in South Africa in support of the cultural boycott;
  about half of US radio stations play it, some objecting to its criticism of Reagan's "constructive engagement"
  policy.
