id: berlin-conference-1884
title: Berlin Conference
summary: Fourteen countries, convened by Otto von Bismarck at the request of Leopold II of Belgium, agree the General
  Act of Berlin regulating European colonisation and trade in Africa. No African rulers were invited. How far it
  drew Africa's borders is debated.
