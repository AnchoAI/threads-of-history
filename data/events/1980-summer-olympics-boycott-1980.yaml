id: 1980-summer-olympics-boycott-1980
title: Boycott of the 1980 Moscow Olympics
summary: The United States led a boycott of the 1980 Summer Olympics in Moscow in protest against the Soviet invasion
  of Afghanistan; President Carter announced it in January 1980 and more than 60 countries joined to varying degrees.
