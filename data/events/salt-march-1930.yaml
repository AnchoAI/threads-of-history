id: salt-march-1930
title: Salt March
summary: Gandhi and 78 followers march 385 km from Sabarmati Ashram to Dandi to break the British salt
  monopoly, in a campaign of tax resistance and nonviolent protest. Civil disobedience continued until
  early 1931.
