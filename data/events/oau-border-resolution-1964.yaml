id: oau-border-resolution-1964
title: African states pledge to keep colonial borders
summary: Meeting in Cairo in July 1964, the heads of state of the Organisation of African Unity pledge to respect
  the borders existing at independence, calling border problems "a grave and permanent factor of dissention".
