id: black-friday-iran-1978
title: 'Black Friday: troops fire on protesters in Tehran'
summary: On 8 September 1978, after martial law was imposed in Tehran and other cities, the army fired on protesters
  in Jaleh Square, killing at least 64. CIA's 1979 review called the events of late August and early September a
  major turning point.
