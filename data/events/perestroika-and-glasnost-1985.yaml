id: perestroika-and-glasnost-1985
title: Perestroika and glasnost
summary: Mikhail Gorbachev, who came to power in 1985, launches a policy of openness (glasnost) in 1986
  and presses for economic restructuring (perestroika); by 1989 the Soviet Union held its first multi-candidate
  elections. The perestroika era lasted until 1991 and is often argued to be a significant cause of the
  collapse of the Eastern Bloc and the Soviet Union.
