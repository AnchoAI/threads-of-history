  notes:
  - Ported from the prototype; sources and quotes added in the P3 (Iran 1978–79) batch. The month is the
    revolution's culmination (11 February 1979); Wikipedia dates the revolution from 7 January 1978, so the
    1978 events in this batch are linked with led_to rather than part_of. A reviewer may want a start date
    in 1978.
  - The Islamic Republic itself was approved by referendum in March 1979 (Wikipedia), after this event's month.
