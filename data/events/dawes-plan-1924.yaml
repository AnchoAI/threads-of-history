id: dawes-plan-1924
title: Dawes Plan
summary: A plan drawn up by an international committee of experts headed by Charles G. Dawes, presented
  in April 1924 and in force from 1 September 1924. It set a staggered schedule of German reparations
  payments, provided a large loan to stabilise the currency and ended the Ruhr occupation; it brought
  a brief recovery but left Germany heavily reliant on short-term foreign loans.
