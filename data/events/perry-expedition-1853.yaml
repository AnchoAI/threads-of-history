id: perry-expedition-1853
title: Perry Expedition opens Japan
summary: US Commodore Matthew Perry led warships into Tokyo Bay on 8 July 1853 to force Japan to end its
  isolation and open its ports to American trade. The Tokugawa shogunate signed the Treaty of Kanagawa
  on 31 March 1854.
