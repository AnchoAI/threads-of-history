id: murder-of-the-romanov-family-1918
title: Murder of the Romanov family
summary: Bolshevik jailers shot the former Tsar Nicholas II and his family in the Ipatiev House in Yekaterinburg
  as the Czechoslovak Legion approached. Some Western historians attribute the order to Lenin and Sverdlov;
  a 2011 investigation found no document proving it.
