id: plo-founded-1964
title: Palestine Liberation Organization founded
summary: At the Arab League's initiative, the Palestinian National Council met in Jerusalem and founded the
  PLO on 2 June 1964. It initially sought an Arab state over all of former Mandatory Palestine, advocating
  the elimination of Israel.
