id: cuban-missile-crisis-1962
title: Cuban Missile Crisis
wikidata: Q128160
summary: Soviet missiles are found in Cuba, 90 miles from Florida. Thirteen days later they are withdrawn;
  the US quietly agrees to pull its Jupiter missiles from Turkey.
