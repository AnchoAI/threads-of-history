    as its own item with a known date.
  - 'Batch P1 added quoted sources (Office of the Historian, FRUS, Wikipedia) and refined known.by to
    the hour from FRUS. Still unquoted: "90 miles from Florida". Kept unverified until a person rewrites
    the summary or a quote is added.'
