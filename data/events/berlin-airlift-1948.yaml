id: berlin-airlift-1948
title: Berlin Airlift
summary: 'From 26 June 1948 to 30 September 1949 the Western Allies supplied West Berlin by air: American
  and British aircraft landed more than 200,000 times and delivered about 2.3 million tons of supplies,
  nearly two-thirds of it coal. At its height a plane reached the city every thirty seconds.'
