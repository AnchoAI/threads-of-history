id: civil-rights-movement-1954
title: Civil rights movement
summary: A US social movement, usually dated 1954 to 1968, that used nonviolent protest and civil disobedience to
  end legalised racial segregation, discrimination and disenfranchisement, which mostly affected African Americans.
  Its conventional start is the Supreme Court's Brown v. Board of Education ruling of 17 May 1954.
