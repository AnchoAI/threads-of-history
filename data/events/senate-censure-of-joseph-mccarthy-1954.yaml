id: senate-censure-of-joseph-mccarthy-1954
title: Senate censures Joseph McCarthy
summary: On 2 December 1954 the US Senate votes 67–22 to censure Senator Joseph McCarthy, ending his influence though
  not expelling him. His career as a major public figure was ruined.
