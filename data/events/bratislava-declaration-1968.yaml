id: bratislava-declaration-1968
title: Bratislava Declaration
summary: On 3 August 1968 the communist parties of Bulgaria, Hungary, East Germany, Poland, the USSR and Czechoslovakia
  met in Bratislava and signed a declaration of loyalty to Marxism–Leninism and struggle against "anti-socialist"
  forces. The US Embassy in Prague read its clause on the common duty to defend socialist achievements as a
  possible future justification for intervention.
