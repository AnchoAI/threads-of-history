id: khrushchev-announces-withdrawal-of-missiles-from-cuba-1962
title: Khrushchev announces the missiles will be withdrawn
summary: On the morning of 28 October 1962 Khrushchev said in a message broadcast on Radio Moscow that
  the Soviet government had ordered the weapons Kennedy called offensive to be dismantled, crated and
  returned to the Soviet Union.
