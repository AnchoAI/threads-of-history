id: rise-of-rock-and-roll-1950
title: Rise of rock and roll
summary: Rock and roll, a genre that evolved in the United States in the late 1940s and early 1950s from African-American
  rhythm and blues and other styles, takes its name in 1954 and wins a wide audience among both Black and white
  American teenagers.
