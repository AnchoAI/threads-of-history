id: treaty-of-zuhab-1639
title: Treaty of Zuhab
summary: The treaty ended the Ottoman–Safavid war of 1623–1639 and ceded Mesopotamia, including Baghdad, to the
  Ottomans. It roughly outlined today's Iran–Iraq frontier but never fixed a precise southern boundary, which stayed
  in dispute.
