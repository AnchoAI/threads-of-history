title: NATO intervention in Bosnia and Herzegovina
summary: A series of NATO actions with the stated aim of bringing lasting peace during and after the Bosnian War.
  It began as largely political and symbolic and grew into large-scale air operations and the deployment of about
  60,000 soldiers in the Implementation Force.
