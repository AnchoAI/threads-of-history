id: he-jiankui-gene-edited-babies-2018
title: He Jiankui announces gene-edited babies
summary: Chinese scientist He Jiankui secretly uses CRISPR/Cas9 to edit human embryos, aiming to make
  the children resistant to HIV, and announces the birth of twin girls. The work drew wide condemnation;
  a Chinese court sentenced him to three years in prison in 2019.
