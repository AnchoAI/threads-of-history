id: inflation-surge-2021
title: 2021–2023 inflation surge
summary: After the COVID-19 pandemic, inflation surged worldwide from mid-2021 to mid-2022, reaching the
  highest US rate since 1981 and the eurozone's highest since records began in 1997. It has been attributed
  to pandemic disruption and supply-chain problems, fiscal and monetary stimulus, price gouging and, from
  2022, the energy and food price rises caused by Russia's invasion of Ukraine; central banks responded
  by raising interest rates sharply.
