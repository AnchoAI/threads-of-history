id: panama-papers-published-2016
title: Panama Papers published
summary: From 3 April 2016 news outlets working with the International Consortium of Investigative Journalists publish
  stories based on 11.5 million documents leaked from the Panamanian law firm Mossack Fonseca to Süddeutsche Zeitung.
  Reporters found that some of the firm's shell companies were used for fraud, tax evasion and evading sanctions.
