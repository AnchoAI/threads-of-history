id: resignation-of-bernard-law-2002
title: Cardinal Bernard Law resigns as Archbishop of Boston
wikidata: none
summary: Pope John Paul II accepts the resignation of Cardinal Bernard Law as Archbishop of Boston. Church
  documents had shown that Law knew of abuse by dozens of priests and moved them between parishes instead
  of reporting them; 58 priests had signed a letter urging him to resign.
