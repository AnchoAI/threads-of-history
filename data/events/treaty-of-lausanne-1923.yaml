id: treaty-of-lausanne-1923
title: Treaty of Lausanne
summary: After eight months of negotiation, Turkey and the Allies signed a peace that replaced the unratified
  Treaty of Sèvres, set the borders of the Turkish state and provided for a Greek–Turkish population exchange.
