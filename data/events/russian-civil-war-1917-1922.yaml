id: russian-civil-war-1917-1922
title: Russian Civil War
summary: A multi-party war in the former Russian Empire after the October Revolution, with foreign interventions.
  It ended in Bolshevik victory and the formation of the Soviet Union, with an estimated 7 to 12 million
  casualties, mostly civilians.
