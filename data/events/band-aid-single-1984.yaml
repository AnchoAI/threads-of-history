id: band-aid-single-1984
title: Band Aid releases "Do They Know It's Christmas?"
summary: After seeing a BBC report on the Ethiopian famine, Bob Geldof organised the charity supergroup Band Aid,
  whose single "Do They Know It's Christmas?", released on 3 December 1984, raised £8 million for famine relief
  within a year.
