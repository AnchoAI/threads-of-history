title: Protests of 1968
summary: 'A worldwide wave of protest: students and workers in France in May, opposition to the Vietnam
  War, the US civil rights movement, the Prague Spring and protests across Eastern Europe, and movements
  in Mexico, Brazil, Japan and Pakistan.'
