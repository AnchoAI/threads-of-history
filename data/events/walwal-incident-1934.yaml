id: walwal-incident-1934
title: Walwal incident
summary: Fighting breaks out between Ethiopian troops and the Italian garrison at Walwal, a fort in a
  disputed border strip in the Ogaden. Accounts differ over who was at fault; Italy used it as a pretext
  for war.
