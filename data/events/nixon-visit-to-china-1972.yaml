id: nixon-visit-to-china-1972
title: Nixon's visit to China
summary: From 21 to 28 February 1972 Richard Nixon became the first US president to visit mainland China, meeting
  Mao Zedong and Zhou Enlai. The two governments issued the Shanghai Communiqué, in which the US acknowledged
  that Chinese on both sides of the Taiwan Strait maintain there is one China.
