id: riaa-parental-advisory-agreement-1985
title: Record industry agrees to Parental Advisory labels
summary: On 1 November 1985 the Recording Industry Association of America agrees with the PMRC that records
  with explicit lyrics will carry "Parental Advisory" labels, applied at each label's discretion; the PMRC
  agrees to stop public attacks on the industry for a year. Some stores, including Wal-Mart, then refuse to
  sell labelled albums.
