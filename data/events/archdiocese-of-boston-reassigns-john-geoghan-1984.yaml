id: archdiocese-of-boston-reassigns-john-geoghan-1984
title: Cardinal Law reassigns John Geoghan to a parish in Weston
wikidata: none
summary: Cardinal Bernard Law, Archbishop of Boston, assigns the priest John Geoghan to St. Julia's parish
  in Weston two months after removing him from a Dorchester parish over complaints that he had abused
  children. Bishop John D'Arcy wrote to Law objecting to the assignment because of Geoghan's history with
  young boys.
