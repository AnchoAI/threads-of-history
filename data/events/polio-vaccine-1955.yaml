id: polio-vaccine-1955
title: Salk polio vaccine declared effective
summary: The results of the Francis Field Trial of Jonas Salk's inactivated polio vaccine, involving 1.8
  million children, are announced; the vaccine was licensed the same year. US polio cases fell from 35,000
  in 1953 to 161 in 1961.
