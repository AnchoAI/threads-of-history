id: gatt-signed-1947
title: General Agreement on Tariffs and Trade signed
summary: Twenty-three nations signed the General Agreement on Tariffs and Trade in Geneva on 30 October
  1947 to cut tariffs and other trade barriers. Meant as an interim code until an International Trade
  Organization was set up, it instead governed postwar trade for almost fifty years, until the World Trade
  Organization replaced it in 1995.
