id: charles-graner-sentenced-2005
title: Charles Graner sentenced for Abu Ghraib abuse
summary: On 15 January 2005 a court-martial sentences Specialist Charles Graner to 10 years in military prison for
  abusing detainees at Abu Ghraib, after convicting him of assault, battery, conspiracy, maltreatment of detainees,
  indecent acts and dereliction of duty. Private Lynndie England was later convicted and sentenced to three years.
