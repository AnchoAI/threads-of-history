id: ibm-personal-computer-1981
title: IBM Personal Computer released
summary: IBM releases its Personal Computer, built from off-the-shelf parts around an Intel 8088 processor.
  Its open design became the basis of the "IBM PC compatible" standard followed by most later personal
  computers.
