id: purple-rain-released-1984
title: Prince releases Purple Rain
summary: Prince releases the album Purple Rain on 25 June 1984. Complaints about the lyrics of its track "Darling
  Nikki" from Tipper Gore and the Parents Music Resource Center contribute to the introduction of Parental
  Advisory stickers.
