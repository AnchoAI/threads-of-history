id: frus-guatemala-volume-2003
title: State Department publishes the CIA's Guatemala operation
summary: The State Department's historians publish a documentary volume on the 1954 Guatemala operation.
  Its 1983 volume had left out the CIA's role, which was denied in declassification; CIA directors acknowledged
  the operation in the early 1990s.
