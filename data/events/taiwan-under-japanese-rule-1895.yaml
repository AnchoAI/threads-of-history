id: taiwan-under-japanese-rule-1895
title: Taiwan under Japanese rule
summary: Taiwan and the Penghu Islands were ruled by Japan from 1895, when the Treaty of Shimonoseki ceded
  them, until 1945; after Japan surrendered, the territory was placed under the control of the Republic
  of China.
