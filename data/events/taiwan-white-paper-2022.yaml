id: taiwan-white-paper-2022
title: China's white paper on Taiwan and reunification
summary: On 10 August 2022 China's Taiwan Affairs Office and State Council Information Office published
  "The Taiwan Question and China's Reunification in the New Era". It presents Japan's 50-year rule of
  Taiwan, after the 1895 cession, as part of China's national humiliation.
