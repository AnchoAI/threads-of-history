id: hungarian-revolution-1956
title: Hungarian Revolution of 1956
summary: On 23 October 1956 a student protest in Budapest grew into a nationwide revolt against Hungary's
  Soviet-dominated government. Imre Nagy's new government disbanded the secret police and on 1 November
  declared Hungary's withdrawal from the Warsaw Pact; Soviet forces crushed the revolt from 4 November.
  About 2,500 Hungarians and 700 Soviet soldiers were killed, some 200,000 Hungarians fled abroad, and
  Nagy was executed after a secret trial in 1958.
