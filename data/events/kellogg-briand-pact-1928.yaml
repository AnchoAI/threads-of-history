id: kellogg-briand-pact-1928
title: Kellogg–Briand Pact
summary: International agreement signed in Paris on 27 August 1928 by Germany, France, the United States
  and others, in which the parties renounced war as an instrument of national policy. It had no enforcement
  mechanism and did not prevent the Second World War, but was later a basis for the trials of German wartime
  leaders.
