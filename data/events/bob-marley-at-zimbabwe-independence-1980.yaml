id: bob-marley-at-zimbabwe-independence-1980
title: Bob Marley plays Zimbabwe's independence celebrations
summary: Bob Marley and the Wailers perform at Rufaro Stadium in Harare at the April 1980 celebrations of Zimbabwe's
  independence; police fire tear gas at the crowd, and Marley stays on stage.
