id: first-congo-war-1996
title: First Congo War
summary: Rwanda invades eastern Zaire to attack rebel groups sheltering there, joined by other neighbouring
  states and Congolese rebels. Mobutu's regime collapses and Laurent-Désiré Kabila takes power, setting
  the stage for the Second Congo War.
