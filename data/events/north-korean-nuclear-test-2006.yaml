id: north-korean-nuclear-test-2006
title: North Korea's first nuclear test
summary: On 9 October 2006 North Korea tested a plutonium-based device underground, its first nuclear test;
  the yield is generally estimated at under one kiloton. It made North Korea the eighth country to test nuclear
  weapons openly.
