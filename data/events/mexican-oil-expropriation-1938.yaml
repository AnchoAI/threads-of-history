id: mexican-oil-expropriation-1938
title: Mexican oil expropriation
summary: President Lázaro Cárdenas nationalises Mexico's petroleum reserves and foreign oil companies
  under Article 27 of the 1917 constitution, creating the state company PEMEX. An international boycott
  of Mexican products followed.
