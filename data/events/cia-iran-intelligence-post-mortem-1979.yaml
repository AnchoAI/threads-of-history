id: cia-iran-intelligence-post-mortem-1979
title: CIA post-mortem on its Iran analysis (Devlin–Jervis report)
summary: A June 1979 internal review by John Devlin and Robert Jervis for CIA's National Foreign Assessment Center
  found that NFAC failed to anticipate events in Iran from late 1977 to late 1978 and produced no paper focused
  on whether the regime could be overthrown. It stayed classified until 2010.
