id: bosnian-war-1992
title: Bosnian War
summary: War in Bosnia and Herzegovina from 6 April 1992 to 21 November 1995 between the Bosnian government
  and the breakaway Bosnian Serb and Bosnian Croat entities, which were led and supplied by Serbia and
  Croatia. Over 100,000 people were killed and over 2.2 million displaced.
