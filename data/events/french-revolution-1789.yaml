id: french-revolution-1789
title: French Revolution
summary: A decade of political and social upheaval in France, from the Estates General of May 1789 to
  Napoleon's coup of November 1799. It ended feudalism in France, and many of its ideas are considered
  founding principles of liberal democracy.
