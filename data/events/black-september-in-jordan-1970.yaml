id: black-september-in-jordan-1970
title: Black September in Jordan
summary: Jordan's army attacked Palestinian fedayeen groups whose presence had grown after 1967; the main fighting
  was 16–27 September 1970 and the conflict lasted until July 1971. Jordan let the fighters relocate to Lebanon
  via Syria.
