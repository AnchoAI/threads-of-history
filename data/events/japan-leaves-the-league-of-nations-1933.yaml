id: japan-leaves-the-league-of-nations-1933
title: Japan leaves the League of Nations
summary: After the League's Assembly adopts the Lytton Report's findings and the Japanese delegation under
  Yosuke Matsuoka walks out, Japan gives formal notice of withdrawal from the League.
