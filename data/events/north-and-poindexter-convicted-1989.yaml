id: north-and-poindexter-convicted-1989
title: Oliver North and John Poindexter convicted
summary: A jury convicts Oliver North in May 1989 of altering and destroying documents, accepting an illegal gratuity
  and aiding the obstruction of Congress, and John Poindexter in April 1990 of conspiracy, false statements, destroying
  records and obstructing Congress. Both convictions were reversed on appeal because of their immunized testimony
  to Congress.
