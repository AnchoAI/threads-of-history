id: patriotic-education-campaign-1991
title: Patriotic Education Campaign
summary: A Chinese Communist Party campaign initiated in 1991 and carried out in full from 1994. It reframed
  the teaching of modern Chinese history around the national humiliations of the modern era and credited
  the party with ending them.
