id: treaty-of-nanking-1842
title: Treaty of Nanking
summary: The treaty that ended the First Opium War, signed on 29 August 1842, required China to pay an
  indemnity, cede Hong Kong Island to Britain and open five treaty ports. Chinese nationalists later called
  it and similar settlements "unequal treaties".
