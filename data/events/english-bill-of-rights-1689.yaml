id: english-bill-of-rights-1689
title: English Bill of Rights
summary: An Act of the English Parliament, given royal assent in December 1689, that limits the monarch's
  powers, sets out the rights of Parliament such as free elections, and lists individual rights including
  the ban on cruel and unusual punishment.
