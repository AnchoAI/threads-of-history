id: ivy-mike-1952
title: Ivy Mike, the first hydrogen bomb test
summary: On 1 November 1952 the United States detonated Ivy Mike on Elugelab in Enewetak Atoll, the first
  full-yield test of a multi-stage thermonuclear device (the Teller–Ulam design). Its yield of 10.4 megatons
  dwarfed the largest earlier test.
