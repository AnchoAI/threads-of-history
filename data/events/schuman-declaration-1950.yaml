id: schuman-declaration-1950
title: Schuman Declaration
summary: On 9 May 1950 French foreign minister Robert Schuman proposed placing French and West German
  coal and steel production under a single authority, saying the pooling would make war between the two
  countries "not only unthinkable but materially impossible". The plan became the European Coal and Steel
  Community.
