id: giovanni-leone-resigns-1978
title: Italian President Giovanni Leone resigns
summary: On 15 June 1978, after months of controversy over Lockheed bribery allegations, Giovanni Leone resigns
  as President of Italy, the first Italian president to resign because of a scandal.
