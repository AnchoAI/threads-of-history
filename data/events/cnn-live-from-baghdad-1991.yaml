id: cnn-live-from-baghdad-1991
title: CNN reports live from Baghdad
summary: When coalition air strikes on Iraq begin on 16 January 1991, CNN reports live from a Baghdad hotel; its
  correspondents stayed after other Western journalists were expelled. The coverage made CNN, the first 24-hour
  news channel (founded 1980), a household name.
