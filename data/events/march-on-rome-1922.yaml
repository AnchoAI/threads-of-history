id: march-on-rome-1922
title: March on Rome
summary: Fascist Blackshirts converged on Rome in late October 1922. King Victor Emmanuel III refused
  to sign a state-of-siege order and on 30 October appointed Benito Mussolini prime minister, a transfer
  of power within the constitutional framework rather than the seizure of power Fascism later celebrated.
