id: third-taiwan-strait-crisis-1995
title: Third Taiwan Strait Crisis
summary: A series of PRC missile tests in the waters around Taiwan from July 1995 to March 1996, begun after
  President Lee Teng-hui spoke at Cornell University and continued before Taiwan's 1996 presidential election.
  The United States sent two aircraft-carrier groups to the area.
