id: currency-reform-1948
title: Western German currency reform
summary: On 20–21 June 1948 the Western Allies replaced the Reichsmark with the Deutsche Mark in the three
  western occupation zones of Germany, a step that let those zones receive Marshall Plan aid. The Soviets
  treated it as a unilateral decision, introduced their own currency and cut land links to West Berlin.
