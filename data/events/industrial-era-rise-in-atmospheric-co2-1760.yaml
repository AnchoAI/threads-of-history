id: industrial-era-rise-in-atmospheric-co2-1760
title: Industrial-era rise in atmospheric CO₂
summary: Since the mid-18th century, burning fossil fuels (coal, oil and gas) has raised atmospheric carbon dioxide
  from about 280 ppm to over 420 ppm, causing global warming. The IPCC states that the rise in greenhouse gases
  since about 1750 is unequivocally caused by human activities.
