id: second-italo-ethiopian-war-1935
title: Italian invasion of Ethiopia
summary: Italy invaded Ethiopia without a declaration of war on 3 October 1935 and won by May 1936, using
  mustard gas in violation of the 1925 Geneva Protocol. The League of Nations imposed economic sanctions
  in November 1935, but they did not cover oil and were lifted in July 1936; the League's failure discredited
  it.
