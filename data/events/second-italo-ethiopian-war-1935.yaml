id: second-italo-ethiopian-war-1935
title: Second Italo-Ethiopian War
summary: Italy invades Ethiopia without a declaration of war and defeats it by May 1936, using mustard
  gas in violation of the Geneva Protocol. The League of Nations' failure to prevent the invasion discredited
  it.
