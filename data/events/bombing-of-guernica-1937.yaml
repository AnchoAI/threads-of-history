id: bombing-of-guernica-1937
title: Bombing of Guernica
summary: On 26 April 1937 the German Condor Legion and the Italian Aviazione Legionaria bombed the Basque
  town of Guernica at the behest of Franco's Nationalists. Estimates of the dead range from about 150
  to 1,654; some historians call it a war crime and others argue it was a legitimate attack.
