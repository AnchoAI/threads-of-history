id: plaza-accord-1985
title: Plaza Accord
summary: On 22 September 1985 France, West Germany, Japan, the United Kingdom and the United States agreed
  at New York's Plaza Hotel to drive down the US dollar, which had risen about 50 percent against their
  currencies since 1980, by intervening in currency markets. The dollar fell sharply until the 1987 Louvre
  Accord; some commentators believe the accord contributed to Japan's asset price bubble.
