id: ping-pong-diplomacy-1971
title: Ping-pong diplomacy
summary: After players met at the 1971 World Table Tennis Championships in Japan, China invited the US table tennis
  team, which on 10 April 1971 became the first official American delegation in Beijing since 1949; a Chinese team
  visited the US in April 1972. The US State Department says the exchange gave a public face to more serious diplomatic
  negotiations.
