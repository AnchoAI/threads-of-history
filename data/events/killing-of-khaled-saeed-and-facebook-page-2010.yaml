id: killing-of-khaled-saeed-and-facebook-page-2010
title: Killing of Khaled Saeed and the "We are all Khaled Said" page
summary: Khaled Saeed dies in police custody in Alexandria on 6 June 2010; photos of his body spread online. Within
  five days Wael Ghonim creates the Facebook page "We are all Khaled Said", which became Egypt's biggest dissident
  Facebook page.
