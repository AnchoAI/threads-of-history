id: meiji-restoration-1868
title: Meiji Restoration
summary: On 3 January 1868 Emperor Meiji declared political power restored to the imperial house, ending
  the rule of the Tokugawa shogunate. The new government modernised Japan and laid the foundations of
  the Empire of Japan, which went on to pursue colonial interests against its neighbours.
