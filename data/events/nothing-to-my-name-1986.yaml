id: nothing-to-my-name-1986
title: Cui Jian's "Nothing to My Name"
summary: Cui Jian first performs "Nothing to My Name", often called the first Chinese rock song, on a televised
  music competition on 9 May 1986. It becomes a hit with urban youth and, by 1989, an anthem of the student
  protest movement; Cui performs it at the Tiananmen Square protests.
