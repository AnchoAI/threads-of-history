id: diana-visits-angolan-minefield-1997
title: Diana visits an Angolan minefield
summary: In January 1997 Diana, Princess of Wales, as patron of the HALO Trust, walked near a minefield being cleared
  in Huambo, Angola; pictures of the visit were seen worldwide. A British defence official called her a 'loose cannon'.
