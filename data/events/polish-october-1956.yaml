id: polish-october-1956
title: Polish October
summary: In October 1956 Władysław Gomułka was appointed First Secretary of Poland's ruling party, ending
  Stalinism in Poland, after the Secret Speech, the death of Bolesław Bierut and the Poznań protests had
  weakened the Stalinist faction. After brief, tense negotiations the Soviets let Gomułka stay in power
  and gave Poland greater autonomy in exchange for its loyalty.
