id: cloyne-report-2011
title: Cloyne Report and Enda Kenny's Dáil speech
wikidata: none
summary: A commission led by Judge Yvonne Murphy reports on how the Diocese of Cloyne handled abuse complaints
  against 19 priests from 1996. A week later Taoiseach Enda Kenny tells the Dáil that the report exposed
  "the dysfunction, disconnection and elitism" of the Vatican and that relations between church and state
  "could not be the same again".
