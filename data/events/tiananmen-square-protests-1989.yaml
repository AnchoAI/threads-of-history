id: tiananmen-square-protests-1989
title: Tiananmen Square protests and massacre
summary: Student- and worker-led protests in Beijing, set off by the death of the reformist Hu Yaobang on 15
  April 1989, were ended when the government declared martial law and sent troops into the city on the night
  of 3–4 June. Estimates of the death toll range from several hundred to the low thousands.
