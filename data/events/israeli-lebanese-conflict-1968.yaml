id: israeli-lebanese-conflict-1968
title: Israeli–Lebanese conflict
summary: A long-running conflict involving Israel, Lebanon-based armed groups and sometimes Syria. Israel invaded
  Lebanon in 1978 and 1982 in response to Palestinian attacks and occupied the south until 2000; Hezbollah attacks
  then sparked the 2006 Lebanon War, and a new period of conflict began in 2023.
