id: iran-nuclear-deal-2015
title: Iran nuclear deal (JCPOA)
summary: 'Iran and the P5+1 finalised the Joint Comprehensive Plan of Action in Vienna on 14 July 2015: Iran
  accepted limits on enrichment and stockpiles and more intrusive IAEA monitoring in return for relief from
  nuclear-related sanctions. Israel, Saudi Arabia, Iranian principlists and the US Republican Party opposed
  it.'
