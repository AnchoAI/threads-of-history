id: live-aid-1985
title: Live Aid
summary: A benefit concert held on 13 July 1985 at Wembley Stadium in London and John F. Kennedy Stadium in Philadelphia,
  organised by Bob Geldof and Midge Ure to raise funds for relief of the Ethiopian famine; it raised £145 million.
