id: kennedy-warns-against-offensive-weapons-in-cuba-1962
title: Kennedy warns against offensive weapons in Cuba
summary: 'A White House statement on 4 September 1962 said there was no evidence of Soviet combat forces,
  bases or offensive weapons such as ground-to-ground missiles in Cuba, and warned: "Were it to be otherwise,
  the gravest issues would arise."'
