id: czechoslovak-coup-1948
title: Communist coup in Czechoslovakia
summary: 'In February 1948 the Communist Party of Czechoslovakia, with Soviet backing, took undisputed
  control of the government: after non-Communist ministers resigned, President Beneš, fearing civil war
  and Soviet intervention, accepted a Communist-dominated government on 25 February. The coup alarmed
  Western countries and began four decades of Communist rule.'
