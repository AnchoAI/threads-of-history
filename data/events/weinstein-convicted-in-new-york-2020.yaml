title: Harvey Weinstein convicted in New York
wikidata: none
summary: A Manhattan jury convicts Harvey Weinstein of a first-degree criminal sexual act and third-degree
  rape, on the complaints of a former production assistant and a former actress, and acquits him of predatory
  sexual assault. He is sentenced to 23 years in prison on 11 March 2020.
