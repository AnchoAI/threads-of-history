id: second-sino-japanese-war-1937
title: Second Sino-Japanese War
summary: Full-scale war between the Republic of China and Japan, after localised conflict in Manchuria
  from 1931. It becomes intertwined with the Second World War after Pearl Harbor and ends with Japan's
  surrender on 2 September 1945. China's government has dated it from 1931 since 2017.
