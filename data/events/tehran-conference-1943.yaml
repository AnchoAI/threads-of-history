id: tehran-conference-1943
title: Tehran Conference
summary: Roosevelt, Churchill and Stalin meet in Tehran from 28 November to 1 December 1943. The British
  and Americans commit to invading northern France by May 1944, and Stalin agrees in principle to declare
  war on Japan after Germany's defeat.
