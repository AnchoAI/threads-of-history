id: arab-cold-war-1952
title: Arab Cold War
summary: A political rivalry in the Arab world, part of the wider Cold War, between new revolutionary republics
  inspired by Nasser's Egypt and conservative monarchies influenced by Saudi Arabia. It is generally dated from
  the Egyptian Revolution of 1952; its end is put in the late 1970s or the early 1990s.
