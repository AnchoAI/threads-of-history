id: cronkite-report-from-vietnam-1968
title: Walter Cronkite's "Report from Vietnam"
summary: After visiting Vietnam following the Tet Offensive, CBS anchor Walter Cronkite closes a special report
  on 27 February 1968 by saying the war seemed "mired in stalemate" and that the only rational way out would be
  to negotiate.
