id: see-it-now-report-on-mccarthy-1954
title: 'See It Now: "A Report on Senator Joseph R. McCarthy"'
summary: On 9 March 1954 Edward R. Murrow's CBS programme See It Now airs an episode criticising Senator Joseph
  McCarthy, using footage of his own speeches. It provoked tens of thousands of letters and calls to CBS, running
  15 to 1 in favour.
