id: detente-1969
title: Détente
summary: A period of eased tension between the United States and the Soviet Union that began in 1969 under
  President Richard Nixon and produced arms-control treaties such as the ABM Treaty and pacts such as
  the Helsinki Accords. It is considered to have ended after the Soviet intervention in Afghanistan in
  1979.
