id: iran-hostage-crisis-1979
title: Iran hostage crisis
summary: On 4 November 1979 students backed by Khomeini seized the US embassy in Tehran, holding 52 Americans
  until 20 January 1981. They demanded the extradition of the Shah; supporters said they feared another US-backed
  coup like 1953.
