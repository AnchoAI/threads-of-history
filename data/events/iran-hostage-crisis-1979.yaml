  title: Iran hostage crisis
  publisher: Wikipedia
  quote: 'The Iran hostage crisis (Persian: بحران گروگانگیری سفارت آمریکا) began on November 4, 1979, when
    66 Americans, including diplomats and other civilian personnel, were taken hostage at the Embassy of the
    United States in Tehran, with 52 of them being held until January 20, 1981.'
