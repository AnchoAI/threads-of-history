id: teapot-dome-scandal-1922
title: Teapot Dome scandal
summary: In 1922 Interior Secretary Albert B. Fall leased the naval oil reserves at Teapot Dome, Wyoming, and Elk
  Hills, California, to oilmen Harry F. Sinclair and Edward L. Doheny without competitive bidding. A Senate inquiry
  led by Thomas J. Walsh found that Fall had received a $100,000 interest-free loan from Doheny; Fall was convicted
  of accepting bribes in 1929, and Doheny was acquitted of paying them in 1930.
