id: balkan-wars-1912
title: Balkan Wars
summary: Two wars in 1912 and 1913. In the first, Greece, Serbia, Montenegro and Bulgaria defeated the Ottoman Empire,
  which lost most of its European territory; in the second, Bulgaria fought its former allies and Romania.
