id: league-of-nations-founded-1920
title: League of Nations founded
summary: The League of Nations, the first worldwide intergovernmental organisation whose main mission
  was to keep the peace, came into being on 10 January 1920, when its Covenant, Part I of the Treaty of
  Versailles, took effect. The United States never joined.
