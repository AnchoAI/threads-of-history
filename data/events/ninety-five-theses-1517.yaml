id: ninety-five-theses-1517
title: Luther's Ninety-five Theses
summary: On 31 October 1517 Martin Luther sent his Ninety-five Theses, a set of propositions criticising
  the sale of indulgences, to the Archbishop of Mainz. They are retrospectively considered to have launched
  the Protestant Reformation.
