id: jim-crow-laws-1870
title: Jim Crow laws
summary: Southern US states pass laws enforcing racial segregation in public facilities and excluding most African
  Americans from voting, from the 1870s until the mid-1960s. The Supreme Court upheld them in Plessy v. Ferguson
  (1896).
