id: us-naval-quarantine-of-cuba-1962
title: US naval quarantine of Cuba
summary: On 22 October 1962 Kennedy ordered a naval "quarantine" of Cuba to stop further offensive weapons
  reaching the island, and announced it with the discovery of the missiles in a televised address that
  evening. Some Soviet ships turned back on 24–25 October; the United States ended the quarantine on 20
  November 1962.
