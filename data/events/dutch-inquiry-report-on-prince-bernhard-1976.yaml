id: dutch-inquiry-report-on-prince-bernhard-1976
title: Dutch inquiry reports on Prince Bernhard and Lockheed
summary: On 26 August 1976 the Dutch government releases the report of the inquiry Prime Minister Joop den Uyl ordered
  into Prince Bernhard's dealings with Lockheed, which had been reported to have paid him a $1.1 million bribe.
  Bernhard resigned as Inspector-General of the armed forces and from other posts; in interviews published after
  his death in 2004 he admitted taking the money.
