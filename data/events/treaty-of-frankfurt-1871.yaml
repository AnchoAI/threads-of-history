title: 'Treaty of Frankfurt: Germany annexes Alsace-Lorraine'
summary: The treaty ending the Franco-Prussian War gives Germany a large war indemnity and most of Alsace
  and part of Lorraine. The loss bred a French desire for revenge, known as revanchism.
