id: european-coal-and-steel-community-1951
title: Treaty of Paris creates the European Coal and Steel Community
summary: Belgium, France, Italy, Luxembourg, the Netherlands and West Germany signed the Treaty of Paris
  on 18 April 1951, creating a common market for coal and steel under a supranational High Authority.
  It is generally seen as the first step in European integration after the Second World War.
