title: Safe Sport Authorization Act signed
wikidata: none
summary: The Protecting Young Victims from Sexual Abuse and Safe Sport Authorization Act becomes law,
  requiring the prompt reporting of sexual abuse of minors and amateur athletes to law enforcement and
  setting up an independent body for athletes to report abuse.
