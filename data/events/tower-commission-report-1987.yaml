id: tower-commission-report-1987
title: Tower Commission report
summary: On 26 February 1987 President Reagan receives the report of the Special Review Board he had appointed on
  1 December 1986 in response to the Iran–Contra affair, made up of John Tower, Edmund Muskie and Brent Scowcroft.
  The report held Reagan accountable for a lax managerial style and aloofness from policy detail.
