id: gramm-leach-bliley-act-1999
title: Gramm–Leach–Bliley Act repeals part of Glass–Steagall
summary: Signed by President Bill Clinton on 12 November 1999, the act repealed part of the 1933 Glass–Steagall
  Act, allowing commercial banks, investment banks, securities firms and insurers to combine. Whether
  this contributed to the 2008 financial crisis is disputed.
