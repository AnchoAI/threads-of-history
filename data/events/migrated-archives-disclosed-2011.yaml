id: migrated-archives-disclosed-2011
title: Britain discloses the 'migrated archives'
summary: During the Mau Mau veterans' lawsuit, the Foreign Office admits it holds files removed from former
  colonies at independence, later put at about 20,000 files from 41 territories, and on 5 May 2011 Foreign
  Secretary William Hague says they will be released. The Kenya files detailed British abuses during the
  Mau Mau rebellion.
