id: glory-to-hong-kong-2019
title: '"Glory to Hong Kong"'
summary: A musician using the pseudonym "Thomas dgx yhl", working with users of the LIHKG forum, writes "Glory
  to Hong Kong" during the 2019 protests; first posted on 26 August 2019, it becomes the protesters' main anthem.
