id: armistice-of-11-november-1918
title: Armistice of 11 November 1918
summary: The armistice signed in a railway carriage near Compiègne ended the fighting between the Allies and Germany.
  It came into force at 11:00 Paris time on 11 November 1918; it was a defeat for Germany though not formally a
  surrender.
