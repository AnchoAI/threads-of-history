id: peace-of-westphalia-1648
title: Peace of Westphalia
summary: Two peace treaties signed in October 1648 in Osnabrück and Münster ended the Thirty Years' War.
  Some international relations scholars trace modern state sovereignty to them; many historians call that
  a myth.
