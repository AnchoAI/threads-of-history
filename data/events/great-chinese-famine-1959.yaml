id: great-chinese-famine-1959
title: Great Chinese Famine
summary: 'A famine in the People''s Republic of China from 1959 to 1961, to which the policies of the Great
  Leap Forward were the main contributor. Death toll estimates range from about 15 to 55 million: for example
  about 30 million (Ashton et al.; Banister), 36 million (Yang Jisheng), 43–46 million (Chen Yizi) and at least
  45 million (Frank Dikötter).'
