title: Death of Jeffrey Epstein
summary: Jeffrey Epstein is found dead in his cell at the Metropolitan Correctional Center in Manhattan while awaiting
  trial. On 16 August New York City's chief medical examiner rules the death a suicide by hanging, and the federal
  charges against him are dismissed.
