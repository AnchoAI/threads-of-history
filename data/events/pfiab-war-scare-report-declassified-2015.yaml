id: pfiab-war-scare-report-declassified-2015
title: PFIAB 'Soviet War Scare' report declassified
summary: On 24 October 2015 the National Security Archive publishes the President's Foreign Intelligence
  Advisory Board's 1990 report on the 1983 war scare, released after a 12-year effort. The board wrote
  that the United States 'may have inadvertently placed our relations with the Soviet Union on a hair
  trigger' during Able Archer 83.
