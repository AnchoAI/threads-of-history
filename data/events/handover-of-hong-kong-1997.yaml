id: handover-of-hong-kong-1997
title: Handover of Hong Kong
summary: At midnight on 30 June 1997 Hong Kong passed from British to Chinese sovereignty, ending 156
  years of British rule that dated back to the First Opium War. It became China's first special administrative
  region.
