id: muhammad-ali-refuses-induction-1967
title: Muhammad Ali refuses induction into the US Army
summary: On 28 April 1967 the heavyweight champion Muhammad Ali refused to be inducted into the US armed forces,
  citing his religious beliefs and opposition to the Vietnam War. He was convicted of draft evasion and stripped
  of his titles; the Supreme Court overturned the conviction in 1971.
