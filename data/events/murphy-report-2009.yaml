id: murphy-report-2009
title: Murphy Report on the Archdiocese of Dublin
wikidata: Q1375112
summary: An Irish commission of investigation led by Judge Yvonne Murphy reports that, at least until
  the mid-1990s, the Archdiocese of Dublin's priorities in handling child sexual abuse cases were secrecy,
  avoiding scandal and protecting the Church's reputation and assets, and that archbishops and bishops
  did not report complaints to the Gardaí before 1996.
