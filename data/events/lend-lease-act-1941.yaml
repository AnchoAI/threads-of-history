id: lend-lease-act-1941
title: Lend-Lease Act
summary: The US Lend-Lease Act, signed on 11 March 1941, lets the United States supply the United Kingdom,
  and later the Soviet Union, China and other Allies, with food, oil and materiel while deferring payment.
  Aid runs until 20 September 1945.
