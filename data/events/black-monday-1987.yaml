id: black-monday-1987
title: Black Monday stock market crash
summary: On 19 October 1987 stock markets around the world crashed and the Dow Jones Industrial Average
  fell 22.6 percent, the largest one-day decline in its history. The Federal Reserve's promise to supply
  liquidity set a precedent for using liquidity to stem financial crises, and no recession or banking
  crisis followed.
