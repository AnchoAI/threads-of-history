id: no-missile-gap-found-1961
title: Satellite photos show there is no missile gap
summary: In January 1961 the new Defense Secretary Robert McNamara and his deputy examined Corona satellite
  photographs and found no large Soviet ICBM deployment; in February McNamara said there was no evidence
  of a large-scale Soviet ICBM effort. A September 1961 National Intelligence Estimate concluded that
  the USSR had no more than 25 ICBMs.
