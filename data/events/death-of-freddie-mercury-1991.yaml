id: death-of-freddie-mercury-1991
title: Death of Freddie Mercury
summary: Freddie Mercury, lead vocalist of the rock band Queen, dies at his home in Kensington on 24 November 1991
  of bronchial pneumonia resulting from AIDS, about a day after publicly confirming that he had the disease.
