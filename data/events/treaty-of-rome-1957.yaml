id: treaty-of-rome-1957
title: Treaty of Rome founds the European Economic Community
summary: Signed on 25 March 1957 by the six ECSC members, the Treaty of Rome created the European Economic
  Community, aiming at a customs union and a common market for goods, labour, services and capital. It
  came into force on 1 January 1958.
