id: smithsonian-agreement-1971
title: Smithsonian Agreement
summary: In December 1971 the Group of Ten agreed, at the Smithsonian Institution in Washington, on a
  new set of fixed exchange rates around a devalued dollar, pegged at $38 an ounce of gold. It did little
  to restore confidence, and the Bretton Woods system collapsed within fifteen months.
