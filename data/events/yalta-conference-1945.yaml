id: yalta-conference-1945
title: Yalta Conference
summary: Roosevelt, Churchill and Stalin meet at Yalta in Crimea on 4–11 February 1945. The Soviet Union
  agrees to enter the war against Japan in exchange for a sphere of influence in Manchuria, and the leaders
  settle Security Council voting for the planned United Nations.
