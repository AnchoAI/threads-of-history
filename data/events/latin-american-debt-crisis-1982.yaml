id: latin-american-debt-crisis-1982
title: Latin American debt crisis
summary: In August 1982 Mexico told the Federal Reserve, the US Treasury and the IMF that it could no
  longer service its $80 billion foreign debt; other countries followed, and sixteen Latin American countries
  rescheduled their debts. The 'lost decade' that followed brought high unemployment and falling incomes,
  until the Brady plan from 1989 cut debt principal.
