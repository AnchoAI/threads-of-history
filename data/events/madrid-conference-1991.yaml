id: madrid-conference-1991
title: Madrid Conference
summary: A peace conference held in Madrid from 30 October to 1 November 1991, co-sponsored by the United States
  and the Soviet Union, bringing Israel together with a joint Jordanian–Palestinian delegation, Lebanon, Syria
  and Egypt. It opened bilateral and multilateral negotiation tracks.
