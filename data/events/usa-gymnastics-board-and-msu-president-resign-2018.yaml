title: USA Gymnastics board and Michigan State president resign
wikidata: none
summary: After Nassar's sentencing, the US Olympic Committee calls on the remaining USA Gymnastics board
  members to resign or face decertification, and all do so by 31 January 2018. Michigan State president
  Lou Anna Simon resigns on 24 January after the Michigan House calls for her removal.
