id: revolutions-of-1989
title: Revolutions of 1989
summary: A wave of movements, beginning in Poland and spreading to Hungary, East Germany, Bulgaria, Czechoslovakia
  and Romania, brings down most of the communist governments of the Eastern Bloc, some of them violently.
  They were a key factor in the dissolution of the Soviet Union and marked the end of the Cold War.
