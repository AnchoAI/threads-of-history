id: battle-of-midway-1942
title: Battle of Midway
summary: A naval battle in the Pacific on 4–7 June 1942 in which US forces, forewarned by code breakers,
  sink all four Japanese fleet carriers present. It is widely considered, with Guadalcanal, a turning
  point in the Pacific War.
