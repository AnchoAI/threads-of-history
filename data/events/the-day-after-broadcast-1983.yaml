id: the-day-after-broadcast-1983
title: The Day After broadcast
summary: ABC airs The Day After, a television film about a nuclear war between the United States and the Soviet
  Union, on 20 November 1983. More than 100 million people watched. President Reagan, who saw it in October, wrote
  in his diary that it left him "greatly depressed".
