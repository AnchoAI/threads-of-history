id: long-march-1934
title: Long March
summary: After defeat in Chiang Kai-shek's Fifth Encirclement Campaign, the Communist Red Army abandons
  the Jiangxi Soviet and retreats about 10,000 km to Shaanxi. About 8,000 of some 100,000 troops survive;
  Mao Zedong becomes de facto leader on the way.
