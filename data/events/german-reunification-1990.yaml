id: german-reunification-1990
title: German reunification
summary: After the fall of the Berlin Wall, East Germany's parliament votes on 23 August 1990 to accede
  to the Federal Republic, and on 3 October 1990 the German Democratic Republic ceases to exist. The Two
  Plus Four Treaty, signed on 12 September 1990, restored full sovereignty to Germany, and the united
  country remained in NATO.
