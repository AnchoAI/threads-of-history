id: tet-offensive-1968
title: Tet Offensive
summary: A surprise offensive by North Vietnamese and Viet Cong forces against South Vietnamese and US forces
  across South Vietnam, launched on 30–31 January 1968. It was a tactical defeat for its attackers but contributed
  to growing American opposition to the war.
