title: 2011 Tōhoku earthquake and tsunami
summary: A magnitude 9.0–9.1 undersea earthquake off the Tōhoku region of Japan on 11 March 2011, the most powerful
  ever recorded in Japan, which lasted about six minutes and caused a tsunami.
