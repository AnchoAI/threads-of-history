id: battle-of-stalingrad-1942-1943
title: Battle of Stalingrad
summary: German forces fight for Stalingrad from 17 July 1942; a Soviet counteroffensive from 19 November
  encircles the German 6th Army, which surrenders on 2 February 1943. The Soviet victory is generally
  regarded as the turning point of the European theatre.
