id: lebanese-civil-war-1975
title: Lebanese Civil War
summary: A multi-sided war fought in Lebanon from 1975 to 1990, estimated to have killed about 120,000 people.
  The source traces it to sectarian tensions within Lebanon's confessional system, compounded by demographic
  change, the presence of Palestinian armed groups and regional rivalries; the 1989 Taif Agreement laid the
  basis for ending it.
