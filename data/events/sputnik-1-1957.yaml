id: sputnik-1-1957
title: Sputnik 1, the first artificial satellite
summary: The Soviet Union launches Sputnik 1, the first artificial Earth satellite, on an R-7 rocket designed
  as an intercontinental ballistic missile. The launch shocked the United States and set off the "Sputnik
  crisis".
