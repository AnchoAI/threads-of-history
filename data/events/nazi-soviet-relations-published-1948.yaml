id: nazi-soviet-relations-published-1948
title: US publishes captured Nazi–Soviet documents
summary: On 21 January 1948 the US State Department published Nazi–Soviet Relations 1939–1941, a collection
  of captured German Foreign Office documents that included the 1939 pact and its secret protocol. The
  documents made headlines worldwide, and Stalin answered with the book Falsifiers of History.
