id: springsteen-concert-in-east-berlin-1988
title: Bruce Springsteen plays East Berlin
summary: Bruce Springsteen plays a concert at the Radrennbahn Weissensee in East Berlin on 19 July 1988, organised
  by the ruling party's youth wing, the FDJ. Crowd estimates range from 200,000 to 500,000; in a short speech
  in German he says he hopes "all the barriers will be torn down".
