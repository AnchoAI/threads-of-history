id: autocephaly-of-the-orthodox-church-of-ukraine-2018
title: Constantinople grants autocephaly to the Orthodox Church of Ukraine
summary: On 11 October 2018 the Ecumenical Patriarchate decided to grant autocephaly (independence) to
  a Ukrainian church and revoked the 1686 letter that had let Moscow ordain the metropolitan of Kyiv.
  A unification council founded the Orthodox Church of Ukraine on 15 December 2018, and it received its
  tomos of autocephaly on 5–6 January 2019. Russia's church and government oppose it.
