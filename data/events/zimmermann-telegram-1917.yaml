id: zimmermann-telegram-1917
title: Zimmermann Telegram
summary: In January 1917 the German Foreign Office sent a secret telegram proposing an alliance with Mexico if the
  United States entered the war. British intelligence intercepted it; it was shown to the US government on 24 February
  and published in the US press on 1 March 1917.
