id: japan-korea-treaty-of-1905-1905
title: Japan–Korea Treaty of 1905
summary: After Japanese troops surround the Korean palace, a treaty is concluded that strips Korea of
  its diplomatic sovereignty and makes it a Japanese protectorate. Its legality at the time of signing
  remains disputed; the 1965 Japan–South Korea treaty calls it "already null and void".
