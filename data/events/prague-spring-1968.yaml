id: prague-spring-1968
title: Prague Spring
summary: A period of political liberalisation in Czechoslovakia under the reformist party leader Alexander
  Dubček, including looser restrictions on the media, speech and travel. It ended when the Soviet Union
  and four other Warsaw Pact states invaded to suppress the reforms.
