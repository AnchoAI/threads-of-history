id: african-boycott-of-the-1976-olympics-1976
title: African boycott of the 1976 Montreal Olympics
summary: Twenty-nine countries, mostly African, boycotted the Montreal Olympics in July 1976 after the IOC refused
  to ban New Zealand, whose national rugby team had toured South Africa that year despite UN calls for a sporting
  embargo over apartheid.
