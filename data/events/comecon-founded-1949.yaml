id: comecon-founded-1949
title: Comecon founded
summary: In January 1949 the Soviet Union, Bulgaria, Czechoslovakia, Hungary, Poland and Romania founded
  the Council for Mutual Economic Assistance (Comecon), an economic organisation of the Eastern Bloc under
  Soviet leadership that lasted until 1991. It was the Eastern Bloc's response to the Marshall Plan.
