id: vietnam-war-1955
title: Vietnam War
summary: A war from about 1955 to 30 April 1975 between North Vietnam, backed by the Soviet Union and China,
  and South Vietnam, backed by the United States, fought in Vietnam, Laos and Cambodia. Estimates of Vietnamese
  soldiers and civilians killed range from 970,000 to 3 million; 58,220 US service members died.
