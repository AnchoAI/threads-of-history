  title: Vietnam War
  publisher: Wikipedia
  quote: 'The war exacted an enormous cost: estimates of Vietnamese soldiers and civilians killed range from
    970,000 to 3 million. Some 275,000–310,000 Cambodians, 20,000–62,000 Laotians, and 58,220 US service members
    died.'
