  quote: The Vietnam War (c. 1955 – 30 April 1975) was an armed conflict in Vietnam, Laos, and Cambodia fought
    between North Vietnam (Democratic Republic of Vietnam) and South Vietnam (Republic of Vietnam) and their
    allies. North Vietnam was supported by the Soviet Union and China, while South Vietnam was supported by
    the United States and other anti-communist nations.
  type: reference
