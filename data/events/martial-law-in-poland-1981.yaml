id: martial-law-in-poland-1981
title: Martial law in Poland
summary: General Wojciech Jaruzelski declares martial law on 13 December 1981 to counter the opposition,
  above all Solidarity, suspending the union and imprisoning its leaders. Martial law lasted until 22
  July 1983 and left Solidarity largely on the sidelines until the late 1980s.
