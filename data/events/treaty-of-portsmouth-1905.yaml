id: treaty-of-portsmouth-1905
title: Treaty of Portsmouth
summary: The treaty, brokered in part by US President Theodore Roosevelt, ends the Russo-Japanese War.
  It affirms Japan's position in south Manchuria and Korea and cedes southern Sakhalin to Japan.
