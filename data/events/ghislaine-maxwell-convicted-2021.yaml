id: ghislaine-maxwell-convicted-2021
title: Ghislaine Maxwell convicted of sex trafficking
summary: A federal jury in New York convicts Ghislaine Maxwell on five counts, including sex trafficking of a minor,
  for her part in the sex-trafficking ring of young teenagers she helped Jeffrey Epstein run; on 28 June 2022 Judge
  Alison J. Nathan sentences her to 20 years in prison.
