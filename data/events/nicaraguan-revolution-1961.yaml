id: nicaraguan-revolution-1961
title: Nicaraguan Revolution
summary: Opposition to the Somoza dictatorship, led from 1961 by the Sandinista National Liberation Front,
  overthrows the regime in 1978–79; the Sandinista government then fights the US-backed Contras until
  the Sandinistas lose the 1990 election. It made Nicaragua a major Cold War proxy battleground.
