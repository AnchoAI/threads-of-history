id: khartoum-resolution-1967
title: Khartoum Resolution
summary: 'After the Six-Day War, an Arab League summit in Khartoum issued a resolution on 1 September 1967
  known for its ''Three Noes'': no peace with Israel, no recognition of Israel and no negotiations with it.'
