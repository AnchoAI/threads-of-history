id: may-fourth-movement-1919
title: May Fourth Movement
summary: Students protest in Beijing against the Paris Peace Conference decision to let Japan keep the
  former German territories in Shandong. Under pressure, China's delegation refuses to sign the Treaty
  of Versailles.
