title: '1918–1920 influenza pandemic (''Spanish flu'')'
summary: An H1N1 influenza pandemic, first documented in Kansas in March 1918, infects about 500 million people,
  nearly a third of the world's population. Estimates of deaths range from 17 to 50 million, possibly up to 100
  million.
