id: wars-in-the-caucasus-1988
title: Wars in the Caucasus
summary: A series of interrelated ethnic and political conflicts in the Caucasus shortly before and after the dissolution
  of the Soviet Union, as former Soviet republics sought independence. They produced several de facto independent
  states, violent changes of government and the displacement of 1.5–2 million people.
