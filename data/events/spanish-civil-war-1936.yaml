id: spanish-civil-war-1936
title: Spanish Civil War
summary: War between Republicans loyal to the Second Spanish Republic and Nationalist rebels, begun by
  an army coup on 17 July 1936. Fascist Italy and Nazi Germany aided Francisco Franco's Nationalists and
  the Soviet Union aided the Republic; the Nationalists won in 1939.
