id: benedict-xvi-pastoral-letter-to-irish-catholics-2010
title: Benedict XVI's pastoral letter to the Catholics of Ireland
wikidata: none
summary: Pope Benedict XVI writes to Irish Catholics about the abuse of children by clergy. He tells victims
  "I am truly sorry", tells abusers they must answer "before properly constituted tribunals", and announces
  an Apostolic Visitation of Irish dioceses, seminaries and religious congregations.
