id: japanese-economic-miracle-1955
title: Japanese economic miracle
summary: A period of rapid economic growth in postwar Japan, generally dated from 1955 to the 1973 oil crisis,
  during which Japan completed its industrialisation; nominal GDP rose from about $91 billion in 1965 to $1.065
  trillion in 1980.
