id: lebanon-war-2006
title: 2006 Lebanon War
summary: After Hezbollah fighters killed three Israeli soldiers and captured two on the border on 12 July 2006,
  Israel and Hezbollah fought until a UN-brokered ceasefire on 14 August under Resolution 1701. The source
  says it killed 1,191–1,300 Lebanese and 165 Israelis.
