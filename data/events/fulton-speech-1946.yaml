id: fulton-speech-1946
title: Churchill's "Iron Curtain" speech
summary: On 5 March 1946 at Westminster College in Fulton, Missouri, Winston Churchill, then Leader of
  the Opposition, said that an "iron curtain" had descended across Europe, leaving the capitals of Central
  and Eastern Europe in what he called the Soviet sphere. Some consider the speech the start of the Cold
  War; Stalin answered in Pravda, accusing Churchill of warmongering.
