id: epstein-files-transparency-act-2025
title: Epstein Files Transparency Act signed into law
summary: After the House votes 427–1 and the Senate passes it by unanimous consent, President Donald Trump signs
  the Epstein Files Transparency Act, requiring the Justice Department to publish its unclassified Epstein files
  within 30 days, with exceptions for victims' identities, abuse material, classified information and active investigations.
