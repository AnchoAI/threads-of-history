id: agadir-crisis-1911
title: Agadir Crisis
summary: 'France sent troops into the interior of Morocco and Germany sent the gunboat SMS Panther to Agadir, arriving
  on 1 July 1911. Negotiations ended the crisis on 4 November 1911: France took Morocco as a protectorate and Germany
  received territory in the French Congo.'
