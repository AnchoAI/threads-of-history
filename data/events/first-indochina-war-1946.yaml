id: first-indochina-war-1946
title: First Indochina War
summary: A war in French Indochina between the French Union and the Viet Minh from 19 December 1946 to 11 August
  1954. After defeat at Dien Bien Phu, France agreed at Geneva to a division of Vietnam at the 17th parallel.
