id: angolan-civil-war-1975
title: Angolan Civil War
summary: A civil war in Angola that began in November 1975, right after independence from Portugal, and continued
  with interludes until 2002. It was a power struggle between two former anti-colonial movements, the communist
  MPLA and the anti-communist UNITA.
