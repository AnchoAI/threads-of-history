id: mongol-sack-of-baghdad-1258
title: Mongol sack of Baghdad
summary: A Mongol army under Hulegu took and sacked Baghdad, capital of the Abbasid Caliphate, and killed the caliph
  al-Musta'sim. The city's fall ended the 500-year-old Abbasid Caliphate in Baghdad; a puppet line of Abbasid caliphs
  continued in Mamluk Cairo.
