id: israeli-disengagement-from-gaza-2005
title: Israeli disengagement from Gaza
summary: In August–September 2005 Israel unilaterally withdrew its forces and over 8,000 settlers from the
  Gaza Strip and dismantled its 21 settlements there, under a plan proposed by Ariel Sharon. Because of the
  later blockade, the UN, the ICJ and many others still regard Gaza as occupied.
