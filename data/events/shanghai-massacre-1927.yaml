title: Shanghai massacre
summary: 'Forces supporting Chiang Kai-shek violently suppress Communist Party organisations and leftists
  in Shanghai. Estimates vary: some sources give about 300 executed and over 5,000 missing, others 5,000
  to 10,000 killed in the following weeks.'
