title: Civil Rights Act of 1964
summary: The US outlaws discrimination based on race, color, religion, sex and national origin, including segregation
  in schools and public accommodations. President Lyndon B. Johnson signs it on 2 July 1964 after a 72-day Senate
  filibuster.
