id: singing-revolution-1987
title: Singing Revolution
summary: From 1987 to 1991, mass demonstrations in Estonia, Latvia and Lithuania, at which tens of thousands
  sang national and folk songs, lead to the restoration of the three Baltic states' independence from the Soviet
  Union.
