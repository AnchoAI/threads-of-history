id: century-of-humiliation-1839
title: Century of humiliation
summary: A Chinese historiographical term for the period from the First Opium War to the founding of the
  People's Republic in 1949, when foreign powers forced China to cede territory and sovereignty. Both
  the Kuomintang and the Communist Party popularised it, and it remains central to Chinese nationalism.
