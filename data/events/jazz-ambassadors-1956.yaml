id: jazz-ambassadors-1956
title: US State Department jazz ambassadors
summary: From 1956 the US State Department sponsored tours abroad by jazz musicians such as Louis Armstrong, Dizzy
  Gillespie, Dave Brubeck, Benny Goodman and Duke Ellington, partly to improve the US image in the face of Soviet
  criticism of American racial inequality.
