id: mexican-constitution-1917
title: Mexican Constitution of 1917
summary: A constituent congress in Querétaro approves Mexico's new constitution. Its Article 27 gave the
  state power to expropriate foreign-owned resources and enabled land reform, and Article 123 protected
  organised labour.
