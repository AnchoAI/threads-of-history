id: long-telegram-1946
title: Kennan's "Long Telegram"
summary: On 22 February 1946 George F. Kennan, a US diplomat in Moscow, sent Washington a classified analysis
  of Soviet conduct of a little over 5,000 words; it circulated widely, reaching President Truman. Kennan's
  ideas reached the public anonymously in the July 1947 "X Article" in Foreign Affairs, which brought
  the term "containment" into wide use.
