id: second-chechen-war-1999
title: Second Chechen War
summary: After Chechnya-based Islamist fighters move into Dagestan in August 1999 and the September apartment
  bombings, Russia begins bombing Grozny on 23 September 1999, takes the city after a winter siege and
  imposes direct rule in May 2000. An insurgency phase lasted until 16 April 2009.
