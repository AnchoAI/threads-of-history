id: sunni-shia-split-0632
title: Sunni–Shia split
summary: In Islam's first century, disputes over who should lead the Muslim community after Muhammad divided Muslims
  into branches, chief among them Sunni and Shia. The killing of Husayn at Karbala in 680 gave the Shia a distinct
  religious identity.
occurred:
  start: '0632'
  precision: century
  note: The split took shape over the first century of Islam; 632 is the death of Muhammad.
