id: first-opium-war-1839
title: First Opium War
summary: Britain fought Qing China from 1839 to 1842 after Chinese officials seized opium stocks from
  mainly British merchants at Canton. Twentieth-century Chinese nationalists treated 1839 as the start
  of a "century of humiliation", and many historians date modern Chinese history from it.
