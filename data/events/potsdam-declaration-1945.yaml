id: potsdam-declaration-1945
title: Potsdam Declaration
summary: On 26 July 1945 the United States, Britain and China call on Japan to surrender unconditionally,
  warning that 'the alternative for Japan is prompt and utter destruction'. The Soviet Union does not
  sign, as it is not yet at war with Japan.
