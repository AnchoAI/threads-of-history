id: deep-throat-identity-revealed-2005
title: '"Deep Throat" revealed as Mark Felt'
summary: On 31 May 2005 Vanity Fair reveals that Mark Felt, deputy director of the FBI during Watergate, was "Deep
  Throat", the anonymous source for Woodward and Bernstein. Woodward quickly confirmed it.
