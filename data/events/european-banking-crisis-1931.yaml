id: european-banking-crisis-1931
title: European banking crisis of 1931
summary: A wave of bank failures in Austria and Germany that began with Vienna's Creditanstalt on 11 May
  1931 and peaked with the Danat-Bank in July. It triggered Germany's exit from the gold standard in July
  1931 and Britain's in September; recent historians question how far the Creditanstalt collapse caused
  the German crisis.
