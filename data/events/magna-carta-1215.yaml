id: magna-carta-1215
title: Magna Carta sealed
summary: King John of England seals a charter at Runnymede to make peace with rebel barons, promising
  them protection from illegal imprisonment, swift justice and limits on feudal payments. Later centuries
  recast it as a charter of universal rights, a reading most historians now call a myth.
