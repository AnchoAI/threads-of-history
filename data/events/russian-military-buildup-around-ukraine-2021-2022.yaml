title: Russian military buildup around Ukraine, 2021–2022
summary: Russian deployments near Ukraine in spring 2021 and the renewed buildup preceded the full-scale
  invasion. This parent groups the buildup and the associated diplomatic crisis through the invasion’s
  opening day.
