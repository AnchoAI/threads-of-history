id: occupation-of-the-ruhr-1923
title: Occupation of the Ruhr
summary: French and Belgian troops occupied Germany's Ruhr industrial district from January 1923 to August
  1925 after Germany defaulted on reparations deliveries. The German government backed passive resistance
  and paid idled workers largely by printing money, which made the hyperinflation worse.
