id: green-revolution-1940
title: The Green Revolution
summary: Starting in Mexico in the 1940s and spreading to Asia in the 1960s, high-yielding cereal varieties,
  synthetic fertilizers, pesticides and irrigation sharply raise crop yields. It is credited with helping
  to avoid widespread famine; its leading figure, Norman Borlaug, received the 1970 Nobel Peace Prize.
