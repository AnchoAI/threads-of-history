id: iea-founded-1974
title: International Energy Agency founded
summary: Set up within the OECD framework on 18 November 1974 in the aftermath of the 1973 oil crisis,
  the International Energy Agency responds to disruptions in oil supply and coordinates the oil reserves
  its members must hold. US Secretary of State Henry Kissinger had proposed it.
