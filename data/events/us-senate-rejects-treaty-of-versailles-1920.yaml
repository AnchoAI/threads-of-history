id: us-senate-rejects-treaty-of-versailles-1920
title: US Senate rejects the Treaty of Versailles
summary: 'The US Senate failed to ratify the Treaty of Versailles and the League Covenant: on 19 March
  1920 the vote was 49–35, short of the two-thirds majority needed. Senator Henry Cabot Lodge led the
  opposition, and the United States never joined the League.'
