id: canton-system-1757
title: Canton System confines Western trade to Guangzhou
summary: From 1757 the Qing dynasty restricted Western maritime trade to Canton (Guangzhou), where only
  licensed Chinese merchants could trade with foreigners. The 1842 Treaty of Nanking abolished the system.
