id: congo-crisis-1960
title: Congo Crisis
summary: Days after the Congo's independence from Belgium on 30 June 1960, an army mutiny and the Belgian-backed
  secessions of Katanga and South Kasai begin five years of civil wars that were also a Cold War proxy
  conflict. Around 100,000 people are believed to have died; the crisis ended with Joseph-Désiré Mobutu
  ruling the whole country.
