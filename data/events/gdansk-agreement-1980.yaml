id: gdansk-agreement-1980
title: Gdańsk Agreement and the birth of Solidarity
summary: A strike at the Lenin Shipyard in Gdańsk that began on 14 August 1980 ends with an agreement
  on 31 August between the Polish government and strike leader Lech Wałęsa. It led to the creation of
  Solidarity, the first independent trade union in the Eastern Bloc, which came to claim over 10 million
  members.
