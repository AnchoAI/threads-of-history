id: first-us-embassy-seizure-in-tehran-1979
title: Militants briefly seize the US embassy in Tehran
summary: On 14 February 1979 revolutionary militants stormed the US embassy in Tehran and held its staff for several
  hours, which led some officials in Washington to reconsider hosting the Shah.
