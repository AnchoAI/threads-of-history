id: indian-rebellion-of-1857
title: Indian Rebellion of 1857
summary: A mutiny of sepoys at Meerut on 10 May 1857 grows into a wider uprising against East India Company rule
  in northern and central India, suppressed by 1858. It led to the end of Company rule.
