id: al-askari-mosque-bombing-2006
title: Bombing of the al-Askari Shrine
summary: A bombing badly damaged the al-Askari Shrine in Samarra, one of the holiest sites in Shia Islam. No group
  claimed it; President Bush blamed al-Qaeda in Iraq, which denied it. Retaliatory sectarian violence killed well
  over 1,000 people within days.
