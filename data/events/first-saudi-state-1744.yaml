id: first-saudi-state-1744
title: First Saudi state (Emirate of Diriyah)
summary: The Al Saud and their Wahhabi allies expanded from Diriyah over most of present-day Saudi Arabia, sacking
  Karbala in 1802 and taking Mecca in 1803, until the Ottoman viceroy of Egypt destroyed the state in 1818.
