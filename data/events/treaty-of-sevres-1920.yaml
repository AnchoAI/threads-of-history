id: treaty-of-sevres-1920
title: Treaty of Sèvres
summary: The Allied peace treaty with the Ottoman Empire began its partition and imposed harsh terms.
  It was never ratified, was rejected by the Turkish nationalists in Ankara and was replaced by the Treaty
  of Lausanne.
