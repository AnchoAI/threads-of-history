id: abu-ghraib-prisoner-abuse-2003
title: Abu Ghraib prisoner abuse
summary: Between October and December 2003 US soldiers of the 372nd Military Police Company and members of the US
  intelligence community abuse detainees at Abu Ghraib prison in Iraq, according to an Army investigation by Major
  General Antonio Taguba, which found 'numerous instances of sadistic, blatant, and wanton criminal abuses'.
