id: kennedy-chooses-quarantine-over-air-strike-1962
title: Kennedy chooses a blockade over an air strike
summary: At the National Security Council meeting of 20 October 1962, after advisers split between McNamara's
  "blockade route" and an air strike backed by Bundy and the Joint Chiefs, Kennedy said he was ready to
  go ahead with the blockade while preparing an air strike on the missile sites. The Office of the Historian
  describes this as a middle course between an air strike followed by invasion and warnings alone.
