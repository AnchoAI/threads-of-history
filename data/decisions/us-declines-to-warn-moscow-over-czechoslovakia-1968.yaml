id: us-declines-to-warn-moscow-over-czechoslovakia-1968
title: Washington declines to warn Moscow over Czechoslovakia
summary: After Soviet troop manoeuvres near the Czechoslovak border in early May 1968, Under Secretary Eugene
  Rostow urged a private deterrent signal to the Soviets and NATO military preparations. Under Secretary Katzenbach
  and Secretary Rusk disagreed, and the State Department told its NATO mission to avoid anything with the "appearance
  of unusual concern".
