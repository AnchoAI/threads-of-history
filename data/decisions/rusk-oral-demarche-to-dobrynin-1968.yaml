id: rusk-oral-demarche-to-dobrynin-1968
title: Rusk warns Dobrynin against a pretext
summary: On 22 July 1968 Secretary of State Dean Rusk told Soviet Ambassador Anatoly Dobrynin, orally and without
  a written note, that Soviet press charges of US involvement in Czechoslovakia were untrue, and asked whether
  they might be a pretext for future action against Czechoslovakia. Eugene Rostow had proposed a written aide-mémoire
  and a NATO ministerial meeting; Ambassador Llewellyn Thompson had advised against any appeal to the Soviets.
