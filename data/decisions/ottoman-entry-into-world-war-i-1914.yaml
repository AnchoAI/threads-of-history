id: ottoman-entry-into-world-war-i-1914
title: Ottoman entry into the First World War
summary: Ottoman warships, still crewed by German sailors, raided Russian Black Sea ports; Russia, Britain
  and France declared war in response. The Ottoman government had declared neutrality and was negotiating
  with both sides.
