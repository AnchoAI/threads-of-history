  title: Ottoman entry into World War I
  publisher: Wikipedia
  quote: The Ottoman Empire's entry into World War I began on 29 October 1914 when two recently purchased
    ships of its navy, which were still crewed by German sailors and commanded by their German admiral,
    carried out the Black Sea Raid, a surprise attack against Russian ports.
  type: reference
  accessed: '2026-10-03'
- url: https://en.wikipedia.org/wiki/Ottoman_entry_into_World_War_I
  title: Ottoman entry into World War I
  publisher: Wikipedia
  quote: Russia replied by declaring war on 1 November 1914.
