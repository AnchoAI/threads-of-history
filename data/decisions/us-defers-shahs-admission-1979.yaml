id: us-defers-shahs-admission-1979
title: Washington tells the Shah his admission now faces 'serious complications'
summary: On 23 February 1979, after the brief embassy takeover, the Special Coordination Committee decided to tell
  the Shah that the US invitation stood but there were now serious complications; Vance recommended denial and Brzezinski
  reluctantly concurred. The Shah went to the Bahamas and later Mexico.
