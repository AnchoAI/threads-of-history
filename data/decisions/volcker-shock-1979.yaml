id: volcker-shock-1979
title: 'Volcker shock: the Fed targets bank reserves to break inflation'
summary: On 6 October 1979, after an unscheduled meeting, Federal Reserve chairman Paul Volcker announced
  that the Fed would manage the volume of bank reserves instead of the day-to-day federal funds rate,
  accepting wider swings in interest rates to rein in inflation. The federal funds rate hit a record 20
  percent in late 1980 and the policy pushed the economy into a severe recession; Volcker is widely credited
  with ending the high inflation.
