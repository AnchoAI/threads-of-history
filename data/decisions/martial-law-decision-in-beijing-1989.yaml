id: martial-law-decision-in-beijing-1989
title: Decision to declare martial law in Beijing
summary: At a Politburo Standing Committee meeting at Deng Xiaoping's residence on 17 May 1989, Zhao Ziyang's
  strategy of concessions was rejected and Deng decided to move troops into Beijing and declare martial law.
  The State Council declared martial law on 20 May.
