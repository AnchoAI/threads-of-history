id: germany-resumes-unrestricted-submarine-warfare-1917
title: Germany decides to resume unrestricted submarine warfare
summary: In January 1917 Germany's leaders decided to resume unrestricted submarine attacks on Allied and neutral
  shipping from 1 February, expecting to defeat Britain before US troops could arrive. Chancellor Bethmann Hollweg
  warned it would bring the United States into the war.
