id: carter-admits-shah-to-us-1979
title: Carter decides to admit the Shah for medical treatment
summary: On 20–21 October 1979 President Carter decided to admit the deposed Shah, who had lymphoma, to the United
  States for medical treatment; he arrived in New York on 22 October. The State Department and the embassy in Tehran
  had warned against it, while Brzezinski, Kissinger and Rockefeller pressed for it.
