id: epstein-non-prosecution-agreement-2007
title: Federal prosecutors give Jeffrey Epstein a non-prosecution agreement
summary: The US Attorney's Office for the Southern District of Florida, led by Alexander Acosta, agrees not to charge
  Jeffrey Epstein federally if he pleads guilty to two state charges, serves a jail term and registers as a sex
  offender. The agreement grants immunity to Epstein, four co-conspirators and "any potential co-conspirators",
  and was filed under seal without the victims being told.
