id: johnson-postpones-moscow-summit-announcement-1968
title: Johnson withholds the Moscow summit announcement
summary: On the evening of 20 August 1968, after Ambassador Dobrynin told him that Soviet troops had been ordered
  into Czechoslovakia, President Johnson called an emergency National Security Council meeting, which decided
  to tell Dobrynin that the United States would not announce the President's planned visit to Moscow and that
  it had asked the UN Security Council to meet. General Wheeler said there was no military action the United
  States could take.
