id: germany-nuclear-phase-out-2011
title: Germany decides to close all its nuclear plants
summary: After Fukushima and mass protests, Angela Merkel's government suspends its 2010 extension of
  reactor lifetimes, shuts eight of 17 reactors and announces that all will close by 2022. The last three
  closed in April 2023, while Germany's use of natural gas rose.
