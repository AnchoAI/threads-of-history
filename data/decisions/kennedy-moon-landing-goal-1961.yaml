id: kennedy-moon-landing-goal-1961
title: Kennedy commits the US to a Moon landing
summary: Six weeks after Gagarin's flight, President Kennedy asks Congress to commit to "landing a man
  on the Moon and returning him safely to the Earth" before the end of the decade. The goal replaced NASA's
  vaguer plans for space stations and flights around the Moon.
