id: soviet-politburo-decides-to-invade-czechoslovakia-1968
title: Soviet Politburo decides to invade Czechoslovakia
summary: At its meeting of 16–17 August 1968 the Soviet Politburo unanimously resolved to "provide help to
  the Communist Party and people of Czechoslovakia through military force". On 18 August Brezhnev told the
  leaders of Bulgaria, East Germany, Hungary and Poland that the intervention would go ahead on the night of
  20 August.
