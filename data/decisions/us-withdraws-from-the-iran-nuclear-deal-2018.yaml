id: us-withdraws-from-the-iran-nuclear-deal-2018
title: US withdraws from the Iran nuclear deal
summary: On 8 May 2018 the Trump administration announced the US withdrawal from the JCPOA and reimposed sanctions,
  although the IAEA had verified Iran's compliance. Iran later took steps contrary to the deal, including stockpiling
  highly enriched uranium.
