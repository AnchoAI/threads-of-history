id: truman-orders-hydrogen-bomb-program-1950
title: Truman orders a hydrogen bomb programme
summary: After the first Soviet atomic test, and against the October 1949 advice of the Atomic Energy
  Commission's General Advisory Committee chaired by J. Robert Oppenheimer, Truman ordered on 31 January
  1950 a programme to develop the hydrogen bomb.
