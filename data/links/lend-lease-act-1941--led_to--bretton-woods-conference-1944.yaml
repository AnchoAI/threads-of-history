review:
  status: unverified
  notes:
  - Neither quote names Bretton Woods as the result of Lend-Lease directly. The Office of the Historian
    says Article VII laid the foundation for the postwar economic order, and its Bretton Woods page places
    Article VII in the run-up to the conference. A person should decide whether this is enough to count
    as stated.
