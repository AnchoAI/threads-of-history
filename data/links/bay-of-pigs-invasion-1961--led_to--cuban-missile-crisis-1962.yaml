  type: scholarly
  quote: After the failed U.S. attempt to overthrow the Castro regime in Cuba with the Bay of Pigs invasion, and while
    the Kennedy administration planned Operation Mongoose, in July 1962 Soviet premier Nikita Khrushchev reached a secret
    agreement with Cuban premier Fidel Castro to place Soviet nuclear missiles in Cuba to deter any future invasion attempt.
