  notes:
  - Batch CB. The quoted source states the connection; no person has reviewed it yet.
  - The Foreign Policy piece itself stresses that Tunisians already had reasons to protest (food prices, corruption,
    unemployment); the cables are presented as a final push, not the cause. No source found that denies any role,
    so this is documented, not contested.
  - The link goes to arab-spring-2011 because no Tunisian revolution item exists; the protests began in December
    2010, before that item's January 2011 start.
