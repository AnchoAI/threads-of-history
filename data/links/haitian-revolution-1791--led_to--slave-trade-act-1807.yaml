from: haitian-revolution-1791
to: slave-trade-act-1807
type: led_to
confidence: contested
note: Fear of a Haiti-style revolt in British colonies, and Haiti's effect on the sugar economy, are cited as reasons
  for abolition; others credit public moral outrage.
sources:
- url: https://en.wikipedia.org/wiki/Atlantic_slave_trade
  archive_url: https://web.archive.org/web/20261011192348/https://en.wikipedia.org/wiki/Atlantic_slave_trade
  title: Atlantic slave trade
  publisher: Wikipedia
  quote: Parliament was also concerned about the success of the Haitian Revolution, and they believed they had to
    abolish the trade to prevent a similar conflagration from occurring in a British Caribbean colony.
  type: reference
  accessed: '2026-10-14'
positions:
- claim: The Haitian Revolution, by bankrupting the West Indian sugar economy, was among the dominant factors behind
    abolition.
  held_by:
  - W. E. B. Du Bois
  sources:
  - url: https://en.wikipedia.org/wiki/Abolitionism_in_the_United_Kingdom
    archive_url: https://web.archive.org/web/20261006203805/https://en.wikipedia.org/wiki/Abolitionism_in_the_United_Kingdom
    title: Abolitionism in the United Kingdom
    publisher: Wikipedia
    quote: Other and dominant factors were the diminishing returns of the African slave trade itself, the bankruptcy
      of the West Indian sugar economy through the Haitian revolution, the interference of Napoleon and the competition
      of Spain.
    type: reference
    accessed: '2026-10-14'
- claim: Abolition in 1807 came from the moral outrage of the British voting public, not from slavery's declining
    value.
  held_by:
  - Seymour Drescher
  sources:
  - url: https://en.wikipedia.org/wiki/Capitalism_and_Slavery
    archive_url: https://web.archive.org/web/20261011065627/https://en.wikipedia.org/wiki/Capitalism_and_Slavery
    title: Capitalism and Slavery
    publisher: Wikipedia
    quote: Seymour Drescher in Econocide (1977) argued that the United Kingdom's abolition of the slave trade in
      1807 resulted not from the diminishing value of slavery for the nation, but instead from the moral outrage
      of the British public which could vote.
    type: reference
    accessed: '2026-10-14'
review:
  status: sourced
  notes:
  - Long arcs batch D. The quoted source states the connection; no person has reviewed it yet.
