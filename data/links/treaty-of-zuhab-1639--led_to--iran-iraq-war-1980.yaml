    type: reference
    accessed: '2026-10-14'
  - url: https://en.wikipedia.org/wiki/Shatt_al-Arab
    title: Shatt al-Arab
    publisher: Wikipedia
    quote: However, the treaty never demarcated a precise and fixed boundary regarding the frontier in the south.
    type: reference
    accessed: '2026-10-14'
  - url: https://en.wikipedia.org/wiki/Shatt_al-Arab
    title: Shatt al-Arab
    publisher: Wikipedia
    quote: Conflicting territorial claims and disputes over navigation rights between Iran and Iraq were among the
      main factors for the beginning of the Iran–Iraq War
    type: reference
    accessed: '2026-10-14'
- claim: Iraq went to war primarily to stop Iran exporting its revolution to Iraq's Shia majority; the border was
    a secondary aim.
  held_by:
  - Wikipedia, 'Iran–Iraq War'
  sources:
  - url: https://en.wikipedia.org/wiki/Iran%E2%80%93Iraq_War
    archive_url: https://web.archive.org/web/20261010041638/https://en.wikipedia.org/wiki/Iran%E2%80%93Iraq_War
    title: Iran–Iraq War
    publisher: Wikipedia
    quote: In starting the war, the Iraqi government—led by President Saddam Hussein—primarily wanted to prevent
