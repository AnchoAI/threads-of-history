note: The burglars chose the night of the fight, hoping people nearby would be listening to it on the radio.
sources:
- url: https://en.wikipedia.org/wiki/Citizens%27_Commission_to_Investigate_the_FBI
  archive_url: https://web.archive.org/web/20260929143855/https://en.wikipedia.org/wiki/Citizens%27_Commission_to_Investigate_the_FBI
  title: Citizens' Commission to Investigate the FBI
  publisher: Wikipedia
  quote: The break-in was perpetrated on the day of Joe Frazier and Muhammad Ali's Fight of the Century. The burglars
    confirmed in subsequent interviews this was done in the hope that the building manager and the residents upstairs
    would be glued to their radios
  type: reference
  accessed: '2026-10-20'
- url: https://en.wikipedia.org/wiki/Muhammad_Ali
  archive_url: https://web.archive.org/web/20261016101813/https://en.wikipedia.org/wiki/Muhammad_Ali
  title: Muhammad Ali
  publisher: Wikipedia
  quote: In 1971, Ali's Fight of the Century with Frazier was used by an activist group, the Citizens' Commission
    to Investigate the FBI, to pull off a burglary at an FBI office in Pennsylvania
  type: reference
  accessed: '2026-10-20'
review:
  status: sourced
  notes:
  - The fight shaped the timing of the burglary, not the decision to carry it out.
