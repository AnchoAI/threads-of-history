    type: reference
    accessed: '2026-10-15'
- claim: The uprising was not planned; it was a reaction to Sharon's visit and to Israel's excessive use of
    force against demonstrators.
  held_by:
  - Palestine Liberation Organization (submission to the Mitchell Report)
  sources:
  - url: https://en.wikipedia.org/wiki/Second_Intifada
    archive_url: https://web.archive.org/web/20261003220255/https://en.wikipedia.org/wiki/Second_Intifada
