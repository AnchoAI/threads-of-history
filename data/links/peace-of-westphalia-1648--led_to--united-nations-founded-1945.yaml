positions:
- claim: The principle of exclusive state sovereignty developed after the Peace of Westphalia and is enshrined
    in the UN Charter.
  held_by:
  - Some scholars of international relations (per Wikipedia)
  sources:
  - url: https://en.wikipedia.org/wiki/Westphalian_sovereignty
    archive_url: https://web.archive.org/web/20260924025559/https://en.wikipedia.org/wiki/Westphalian_sovereignty
    title: Westphalian sovereignty
    publisher: Wikipedia
    quote: The principle developed in Europe after the Peace of Westphalia in 1648, based on the state
      theory of Jean Bodin and the natural law teachings of Hugo Grotius.
    type: reference
    accessed: '2026-10-14'
  - url: https://en.wikipedia.org/wiki/Westphalian_sovereignty
    archive_url: https://web.archive.org/web/20260924025559/https://en.wikipedia.org/wiki/Westphalian_sovereignty
    title: Westphalian sovereignty
    publisher: Wikipedia
    quote: Chapter I of the United Nations Charter asserted a version of Westphalian sovereignty.
    type: reference
    accessed: '2026-10-14'
  - url: https://en.wikipedia.org/wiki/Peace_of_Westphalia
    title: Peace of Westphalia
    publisher: Wikipedia
    quote: Several scholars of international relations have identified the Peace of Westphalia as the
      origin of principles crucial to modern international relations, collectively known as Westphalian
      sovereignty.
    type: reference
    accessed: '2026-10-14'
- claim: The 1648 treaties had little to do with sovereignty; the link is a "Westphalian myth" formed
    in the 19th and 20th centuries.
  held_by:
  - Andreas Osiander
  - Hall Gardner
  - most modern historians (per Wikipedia)
  sources:
  - url: https://en.wikipedia.org/wiki/Westphalian_sovereignty
    archive_url: https://web.archive.org/web/20260924025559/https://en.wikipedia.org/wiki/Westphalian_sovereignty
    title: Westphalian sovereignty
    publisher: Wikipedia
    quote: For example, Andreas Osiander writes that "the treaties confirm neither [France's or Sweden's]
      'sovereignty' nor anybody else's; least of all do they contain anything about sovereignty as a principle."
    type: reference
    accessed: '2026-10-14'
  - url: https://en.wikipedia.org/wiki/Peace_of_Westphalia
    title: Peace of Westphalia
    publisher: Wikipedia
    quote: However, some historians have argued against this, suggesting that such views emerged during
      the nineteenth and twentieth centuries in relation to concerns about sovereignty during that time.
    type: reference
    accessed: '2026-10-14'
review:
