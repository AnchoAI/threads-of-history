positions:
- claim: By imposing Shia Islam and strengthening the mujtahids, the Safavids began a long struggle between clergy
    and crown, between theocratic and secular government.
  held_by:
  - Roger Savory (as quoted in Wikipedia's 'Safavid Iran')
  sources:
  - url: https://en.wikipedia.org/wiki/Safavid_Iran
    archive_url: https://web.archive.org/web/20260924133032/https://en.wikipedia.org/wiki/Safavid_Iran
    title: Safavid Iran
    publisher: Wikipedia
    quote: by imposing Ithna 'Ashari Shi'a Islam on Iran as the official religion of the Safavid state, they enhanced
      the power of mujtahids. The Safavids thus set in train a struggle for power between the turban and the crown
    type: reference
    accessed: '2026-10-14'
- claim: 'The revolution grew mainly from 20th-century causes: the Shia Islamic revival, nationalism, political
    populism and religious radicalism.'
  held_by:
  - Wikipedia, 'Iranian Revolution' (summary of the literature)
  sources:
  - url: https://en.wikipedia.org/wiki/Iranian_Revolution
    archive_url: https://web.archive.org/web/20261014125015/https://en.wikipedia.org/wiki/Iranian_Revolution
    title: Iranian Revolution
    publisher: Wikipedia
    quote: The revolution that substituted the monarchy of Mohammad Reza Pahlavi with Islam and Khomeini is credited
      in part to the spread of the Shi'a version of the Islamic revival.
    type: reference
    accessed: '2026-10-14'
  - url: https://en.wikipedia.org/wiki/Iranian_Revolution
    archive_url: https://web.archive.org/web/20261014125015/https://en.wikipedia.org/wiki/Iranian_Revolution
    title: Iranian Revolution
    publisher: Wikipedia
    quote: While often described mainly as a religious revolt, the revolution also grew from a mix of nationalist
