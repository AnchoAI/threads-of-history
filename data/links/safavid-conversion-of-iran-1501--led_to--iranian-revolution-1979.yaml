    type: reference
    accessed: '2026-10-14'
review:
  status: sourced
  notes:
  - Each position is quoted from a source that holds it. No source found states the Safavid-to-1979 link outright;
    Savory's 'turban and crown' is the closest, so the link is contested.
  - The second position is attributed to the Wikipedia article; a reviewer could replace it with a named historian.
