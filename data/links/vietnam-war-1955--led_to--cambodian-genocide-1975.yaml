    title: Cambodian genocide
    publisher: Wikipedia
    quote: According to Ben Kiernan, the Khmer Rouge "would not have won power without U.S. economic and military
      destabilization of Cambodia. ... It used the bombing's devastation and massacre of civilians as recruitment
