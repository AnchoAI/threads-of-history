    quote: Some scholars, including Michael Ignatieff, Adam Jones, and Greg Grandin, have cited the United
      States intervention and bombing campaign from 1965 to 1973 as a significant factor in increasing the
      Cambodian peasantry's support for the Khmer Rouge.
