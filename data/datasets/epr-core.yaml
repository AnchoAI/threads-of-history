id: epr-core
title: Ethnic Power Relations (EPR) Core Dataset
publisher: International Conflict Research (ICR), ETH Zürich
url: https://icr.ethz.ch/data/epr/core/
download_url: https://icr.ethz.ch/data/epr/core/EPR-2021.csv
version: '2021 (released 2021-06-08)'
license:
  name: No licence stated
  redistribution: unknown
citation: 'Vogt, Manuel, Nils-Christian Bormann, Seraina Rüegger, Lars-Erik Cederman, Philipp Hunziker, and Luc Girardin.
  2015. “Integrating Data on Ethnicity, Geography, and Conflict: The Ethnic Power Relations Data Set Family.” Journal
  of Conflict Resolution 59(7): 1327–42.'
unit_of_analysis: other
coverage:
  start: '1946'
  end: '2021'
  precision: year
  note: 'EPR Core page: "identifies all politically relevant ethnic groups and their access to state power in every
    country of the world from 1946 to 2021."'
importer: tools/importers/epr_core.py
notes:
- 'No licence found. The EPR Core page (https://icr.ethz.ch/data/epr/core/), the EPR family page (https://icr.ethz.ch/data/epr/)
  and the 7-page 2021 codebook (EPR_2021_Codebook_EPR.pdf) state no licence or terms of use. The GROW data portal
  (https://growup.ethz.ch/) is a JavaScript app and returned no readable text.'
- 'Version, from the EPR Core page: "You may also download the latest version (2021, released on June 8, 2021) of
  the raw EPR dataset directly". Citation copied from the same page ("When using this dataset in your research, please
  cite the following publication:"). For the original EPR v.1.1 the page asks for Cederman, Wimmer and Min (2010),
  World Politics 62(1).'
- 'Unit: the raw file has one row per ethnic group per period of years, which the schema has no value for, so it is
  set to other. The page adds: "The current version of the EPR data is available in research-ready country-year and
  group-year format from the GROW Research Front-End data portal." The importer would build country-year tables
  (e.g. share of population excluded from power).'
- 'Coverage ends in 2021: the dataset has not been updated since, so it cannot inform forecasts for 2022 onwards
  without another source.'
review:
  status: unverified
  notes:
  - Licence not confirmed. Do not import until ICR states a licence or grants permission (contact via https://icr.ethz.ch/).
