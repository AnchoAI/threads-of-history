notes:
- 'The commodity markets page links its data files to "Terms of use for Datasets" and "Data Access and Licensing". The
  World Bank dataset terms (https://www.worldbank.org/ext/en/legal/terms-conditions/datasets) say: "Unless specifically
  labeled otherwise, these Datasets are provided to you under a Creative Commons Attribution 4.0 International License
  (CC BY 4.0), with the additional terms below." The Pink Sheet carries no other label that we found.'
- The workbook's sheet "Annual Prices (Nominal)" says "annual prices, 1960 to present, nominal US dollars"; the tables
  here use the real (2010 US$) sheets.
